<script src="site-guides.js?v=20260914-progress"></script>
<script src="assets/guide-experience.js?v=20260914-1"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const game = (params.get('game') || '').trim();
  const datasets = Object.freeze({
    'Township': 'data/guide-experiences/township.json',
    'きのこ伝説': 'data/guide-experiences/kinoko.json',
    'メメントモリ': 'data/guide-experiences/mementomori.json',
    'ワーキングヒーロー': 'data/guide-experiences/working-heroes.json',
    'ホワイトアウト・サバイバル': 'data/guide-experiences/whiteout-survival.json'
  });

  const title = document.getElementById('pageTitle');
  const root = document.getElementById('experience');
  const empty = document.getElementById('emptyState');
  const detail = document.getElementById('detailLink');
  const guideLink = document.getElementById('guideLink');

  document.title = game ? `${game}｜みんなの進捗 | POIGAME LAB` : 'みんなの進捗 | POIGAME LAB';
  title.textContent = game ? `${game}｜みんなの進捗` : 'みんなの進捗';
  detail.href = game ? `game.html?game=${encodeURIComponent(game)}` : 'index.html';

  const guide = window.POIGAME_GUIDES?.[game];
  const primaryGuide = guide?.links?.find((item) => item && item.href && !item.href.startsWith('progress.html'));
  if (primaryGuide) guideLink.href = primaryGuide.href;
  else guideLink.href = 'guides.html';

  const src = datasets[game];
  if (!src) {
    root.hidden = true;
    empty.hidden = false;
    return;
  }

  root.dataset.experienceSrc = src;
  if (window.POIGAME_EXPERIENCE_BOOT) window.POIGAME_EXPERIENCE_BOOT(root);
})();
</script>
<script src="site-footer.js"></script>
</body>
