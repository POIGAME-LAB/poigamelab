name: Temporary ranking budget audit
on:
  push:
    branches: [audit/ranking-budget-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest new-game queue
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          aws s3 cp "s3://${R2_BUCKET}/state/latest/new_game_candidate_queue.json.gz" "${tmp}/queue.gz" --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          gzip -dc "${tmp}/queue.gz" > data/new_game_candidate_queue.json
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Audit ranking surface
        run: |
          python - <<'PY'
          import json,sys,collections
          sys.path.insert(0,"scripts")
          import daily_scan_review as daily
          import direct_offer_refresh as direct

          queue=json.load(open("data/new_game_candidate_queue.json",encoding="utf-8"))
          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          targets=json.load(open("config/game_targets.json",encoding="utf-8"))["games"]
          families=daily.source_families(sources)
          items=queue.get("items",[])

          def build(allow):
              groups={}
              dropped=collections.Counter()
              for item in items:
                  cls=item.get("classification") or "review"
                  if cls not in allow:
                      dropped[cls]+=1
                      continue
                  name=daily.discovery_name(item.get("titleHint"))
                  if not name or direct.context_matches_known_game(name,targets):
                      dropped["known_or_blank"]+=1
                      continue
                  sid,url=item.get("source"),item.get("firstPartyCandidateUrl")
                  if sid not in sources or not direct.source_host_allowed(url,sources[sid]) or not direct.detail_like(url,sources[sid]):
                      dropped["invalid_source_url"]+=1
                      continue
                  if not direct.source_participates_in_new_game_ranking(sources[sid]):
                      dropped["source_not_ranking"]+=1
                      continue
                  ident=direct.offer_identity_key(url,sid)
                  if not ident:
                      dropped["no_identity"]+=1
                      continue
                  key=direct.normalized_text(name)
                  bucket=groups.setdefault(key,{"game":name,"offers":{}})
                  bucket["offers"].setdefault((families[sid],ident),(sid,url))
              owners={}
              for key,g in groups.items():
                  for ident in g["offers"]:
                      owners.setdefault(ident,set()).add(key)
              for g in groups.values():
                  g["offers"]={ident:offer for ident,offer in g["offers"].items() if len(owners[ident])==1}
              eligible=[g for g in groups.values() if g["offers"]]
              dist=collections.Counter(len({f for f,_ in g["offers"]}) for g in eligible)
              detail_count=sum(len(g["offers"]) for g in eligible)
              return groups,eligible,dist,detail_count,dropped

          print("ITEMS",len(items))
          print("CLASSIFICATIONS",json.dumps(collections.Counter((x.get("classification") or "review") for x in items),ensure_ascii=False,sort_keys=True))
          print("SOURCES",json.dumps(collections.Counter(x.get("source") for x in items),ensure_ascii=False,sort_keys=True))
          for label,allow in [
              ("ALL_NON_NONGAME",{"likely_game","review"}),
              ("LIKELY_GAME_ONLY",{"likely_game"}),
          ]:
              groups,eligible,dist,detail_count,dropped=build(allow)
              print(label,json.dumps({
                  "groups":len(groups),"eligibleGroups":len(eligible),
                  "detailOffers":detail_count,
                  "sourceFamilyCountDistribution":dict(sorted(dist.items())),
                  "dropped":dict(dropped),
              },ensure_ascii=False,sort_keys=True))
              ranked=sorted(eligible,key=lambda g:(-len({f for f,_ in g["offers"]}),g["game"]))
              for g in ranked[:40]:
                  print(label+"_GROUP",json.dumps({
                    "game":g["game"],
                    "families":len({f for f,_ in g["offers"]}),
                    "offers":len(g["offers"]),
                    "sources":sorted({sid for sid,_ in g["offers"].values()}),
                  },ensure_ascii=False,sort_keys=True))
          PY
