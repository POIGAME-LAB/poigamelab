name: Temporary build unified eight-site foundation

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - ".github/workflows/tmp-build-unified-eight-site.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-eight-site-offers-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch unified source policy and runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          eight = ["moppy", "warau", "coincome", "hapitas", "amefuri", "point_town", "ec_navi", "powl"]

          policy_path = Path('config/refresh_policy.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          policy['unifiedDailySources'] = eight
          publication = policy.setdefault('structuredPublication', {})
          publication['sources'] = ["warau", "chobirich", "hapitas", "coincome", "point_town", "ec_navi", "amefuri"]
          publication['mode'] = 'complete-stepup-or-exact-reward-snapshot'
          policy_path.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = Path('scripts/direct_offer_refresh.py')
          text = path.read_text(encoding='utf-8')

          old = '''    comparison_sources = [\n        str(x).strip() for x in (policy.get("comparisonSources") or []) if str(x).strip()\n    ]\n    if not comparison_sources:\n        print("ERROR: comparisonSources is empty", file=sys.stderr)\n        return 2\n    unknown = [x for x in comparison_sources if x not in sources]\n    if unknown:\n        print("ERROR: unregistered comparison sources: " + ", ".join(unknown), file=sys.stderr)\n        return 2\n'''
          new = '''    comparison_sources = [\n        str(x).strip() for x in (policy.get("comparisonSources") or []) if str(x).strip()\n    ]\n    if not comparison_sources:\n        print("ERROR: comparisonSources is empty", file=sys.stderr)\n        return 2\n    unknown = [x for x in comparison_sources if x not in sources]\n    if unknown:\n        print("ERROR: unregistered comparison sources: " + ", ".join(unknown), file=sys.stderr)\n        return 2\n\n    unified_daily_sources = [\n        str(x).strip() for x in (policy.get("unifiedDailySources") or []) if str(x).strip()\n    ]\n    if not unified_daily_sources:\n        print("ERROR: unifiedDailySources is empty", file=sys.stderr)\n        return 2\n    unknown_unified = [x for x in unified_daily_sources if x not in sources]\n    if unknown_unified:\n        print("ERROR: unregistered unified daily sources: " + ", ".join(unknown_unified), file=sys.stderr)\n        return 2\n    invalid_unified = [\n        x for x in unified_daily_sources\n        if sources[x].get("new_game_discovery_enabled") is not True\n    ]\n    if invalid_unified:\n        print("ERROR: unified source is not enabled for the shared discovery crawl: "\n              + ", ".join(invalid_unified), file=sys.stderr)\n        return 2\n'''
          if old not in text:
              raise SystemExit('comparison source policy block not found')
          text = text.replace(old, new, 1)

          old = '        requested = list(dict.fromkeys(comparison_sources + supplemental + published_sources))\n'
          new = '        requested = list(dict.fromkeys(unified_daily_sources + comparison_sources + supplemental + published_sources))\n'
          if old not in text:
              raise SystemExit('requested source block not found')
          text = text.replace(old, new, 1)

          old = '            is_standard = source_id in comparison_sources\n'
          new = '            is_standard = source_id in unified_daily_sources\n'
          if old not in text:
              raise SystemExit('standard source marker not found')
          text = text.replace(old, new, 1)

          old = '''            if source.get("scheduled_fetch_enabled", True) is not True:\n                review.append({\n                    "game": game,\n                    "source": source_id,\n                    "reason": "scheduled_source_fetch_disabled",\n                    "existingRows": len(current_rows),\n                    "checkedAt": checked_at,\n                })\n                game_result["sources"].append({\n                    "source": source_id,\n                    "standard": is_standard,\n                    "knownOrDiscoveredUrls": 0,\n                    "confirmedOffers": 0,\n                    "updatedRows": 0,\n                    "reviewRequired": 1,\n                    "state": "review_required",\n                })\n                continue\n'''
          new = '''            reuse_unified_listing = (\n                source_id in unified_daily_sources\n                and source.get("new_game_discovery_enabled") is True\n            )\n            if (source.get("scheduled_fetch_enabled", True) is not True\n                    and not reuse_unified_listing):\n                review.append({\n                    "game": game,\n                    "source": source_id,\n                    "reason": "scheduled_source_fetch_disabled",\n                    "existingRows": len(current_rows),\n                    "checkedAt": checked_at,\n                })\n                game_result["sources"].append({\n                    "source": source_id,\n                    "standard": is_standard,\n                    "knownOrDiscoveredUrls": 0,\n                    "confirmedOffers": 0,\n                    "updatedRows": 0,\n                    "reviewRequired": 1,\n                    "state": "review_required",\n                })\n                continue\n'''
          if old not in text:
              raise SystemExit('scheduled fetch gate not found')
          text = text.replace(old, new, 1)

          old = '            detail_limit = max(0, min(6, int(source.get("direct_detail_limit", 6))))\n'
          new = '''            detail_limit = max(0, min(6, int(source.get("direct_detail_limit", 6))))\n            if reuse_unified_listing:\n                detail_limit = max(\n                    detail_limit,\n                    max(0, min(6, int(source.get("coverage_detail_review_limit_per_game") or 0))),\n                )\n'''
          if old not in text:
              raise SystemExit('detail limit line not found')
          text = text.replace(old, new, 1)

          old = '''            discovery_urls = [u for u in deduped_urls\n                              if offer_identity_key(u, source_id) not in published_identities]\n            discovery_budget = max(0, detail_limit - len(published_urls))\n            urls = published_urls + discovery_urls[:discovery_budget]\n'''
          new = '''            discovery_urls = [u for u in deduped_urls\n                              if offer_identity_key(u, source_id) not in published_identities]\n            if source_id in unified_daily_sources:\n                for observed_url in discovery_urls:\n                    review.append({\n                        "game": game,\n                        "source": source_id,\n                        "url": observed_url,\n                        "reason": "first_party_existing_game_listing_offer_observed",\n                        "candidateOnly": True,\n                        "publicationAuthorized": False,\n                        "checkedAt": checked_at,\n                    })\n            discovery_budget = max(0, detail_limit - len(published_urls))\n            urls = published_urls + discovery_urls[:discovery_budget]\n'''
          if old not in text:
              raise SystemExit('discovery budget block not found')
          text = text.replace(old, new, 1)

          old = '        game_result["standardTotal"] = len(comparison_sources)\n'
          new = '        game_result["standardTotal"] = len(unified_daily_sources)\n'
          if old not in text:
              raise SystemExit('standard total line not found')
          text = text.replace(old, new, 1)

          old = '''        "comparisonSources": comparison_sources,\n        "apiCalls": 0,\n'''
          new = '''        "comparisonSources": comparison_sources,\n        "unifiedDailySources": unified_daily_sources,\n        "apiCalls": 0,\n'''
          if old not in text:
              raise SystemExit('status comparison source block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/refresh-verified-offers.yml')
          w = workflow.read_text(encoding='utf-8')
          old = '''      - name: Write top-five content research handoff queue\n        if: steps.refresh.outcome == 'success'\n        run: python scripts/write_new_game_content_queue.py\n'''
          new = '''      - name: Build unified eight-site offer snapshot\n        if: steps.refresh.outcome == 'success'\n        run: python scripts/unified_offer_snapshot.py\n\n      - name: Write top-five content research handoff queue\n        if: steps.refresh.outcome == 'success'\n        run: python scripts/write_new_game_content_queue.py\n'''
          if old not in w:
              raise SystemExit('workflow handoff block not found')
          w = w.replace(old, new, 1)
          old = '''            data/daily_scan_review.json\n            data/new_game_content_queue.json\n'''
          new = '''            data/daily_scan_review.json\n            data/unified_offer_snapshot.json\n            data/new_game_content_queue.json\n'''
          if old not in w:
              raise SystemExit('archive list insertion point not found')
          w = w.replace(old, new, 1)
          old = '''            data/daily_scan_review.json \\\n            data/new_game_candidate_queue.json \\\n'''
          new = '''            data/daily_scan_review.json \\\n            data/unified_offer_snapshot.json \\\n            data/new_game_candidate_queue.json \\\n'''
          if old not in w:
              raise SystemExit('cleanup list insertion point not found')
          w = w.replace(old, new, 1)
          workflow.write_text(w, encoding='utf-8')
          PY

      - name: Expand exact reward-only publication contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/structured_publication.py')
          text = path.read_text(encoding='utf-8')
          old = '''REWARD_ONLY_CONTRACTS = {\n    "hapitas": {\n        "parser": "hapitas-detail-review-v1",\n        "identity": direct.hapitas_offer_id,\n        "rewardField": "verifiedCurrentRewardYen",\n        "fingerprintFields": [\n            "offerId", "name", "platform", "displayedCurrentRewardPoints",\n            "stepRewardPoints", "verifiedCurrentRewardPoints",\n            "verifiedCurrentRewardYen", "rewardUnit", "sourcePointRate",\n            "headerText", "termsText", "publicationAuthorized",\n        ],\n        "rewardUnit": "Hapitas-pt",\n        "sourcePointRate": "1pt=1JPY",\n        "termsMarkers": ("ポイント対象条件",),\n    },\n}\n'''
          new = '''REWARD_ONLY_CONTRACTS = {\n    "hapitas": {\n        "parser": "hapitas-detail-review-v1",\n        "identity": direct.hapitas_offer_id,\n        "rewardField": "verifiedCurrentRewardYen",\n        "fingerprintFields": [\n            "offerId", "name", "platform", "displayedCurrentRewardPoints",\n            "stepRewardPoints", "verifiedCurrentRewardPoints",\n            "verifiedCurrentRewardYen", "rewardUnit", "sourcePointRate",\n            "headerText", "termsText", "publicationAuthorized",\n        ],\n        "rewardUnit": "Hapitas-pt",\n        "sourcePointRate": "1pt=1JPY",\n        "pointField": "verifiedCurrentRewardPoints",\n        "pointScale": 1,\n        "termsMarkers": ("ポイント対象条件",),\n    },\n    "coincome": {\n        "parser": "coincome-detail-review-v1",\n        "identity": direct.coincome_offer_id,\n        "rewardField": "displayedRewardYen",\n        "fingerprintFields": [\n            "offerId", "name", "platform", "displayedRewardYen",\n            "rewardUnit", "headerText", "termsText",\n        ],\n        "rewardUnit": "JPY-equivalent",\n        "termsMarkers": ("適用端末", "キャッシュバック条件", "承認条件", "ポイント獲得条件", "否認条件"),\n    },\n    "point_town": {\n        "parser": "pointtown-detail-review-v1",\n        "identity": direct.pointtown_offer_id,\n        "rewardField": "verifiedCurrentRewardYen",\n        "fingerprintFields": [\n            "offerId", "name", "platform", "verifiedCurrentRewardPoints",\n            "verifiedCurrentRewardYen", "rewardUnit", "sourcePointRate",\n            "headerText", "termsText", "publicationAuthorized",\n        ],\n        "rewardUnit": "PointTown-point",\n        "sourcePointRate": "1pt=1JPY",\n        "pointField": "verifiedCurrentRewardPoints",\n        "pointScale": 1,\n        "termsMarkers": ("ポイント獲得条件",),\n    },\n    "ec_navi": {\n        "parser": "ecnavi-detail-review-v1",\n        "identity": direct.ecnavi_offer_id,\n        "rewardField": "verifiedCurrentRewardYen",\n        "fingerprintFields": [\n            "offerId", "name", "platform", "displayedPointCandidates",\n            "verifiedCurrentRewardPoints", "verifiedCurrentRewardYen",\n            "rewardUnit", "sourcePointRate", "headerText", "termsText",\n            "publicationAuthorized",\n        ],\n        "rewardUnit": "ECNavi-pt",\n        "sourcePointRate": "10pt=1JPY",\n        "pointField": "verifiedCurrentRewardPoints",\n        "pointScale": 10,\n        "termsMarkers": ("加算条件", "加算時期"),\n    },\n    "amefuri": {\n        "parser": "amefuri-multistep-review-v1",\n        "identity": direct.amefuri_offer_id,\n        "rewardField": "verifiedCurrentRewardYen",\n        "fingerprintFields": [\n            "offerId", "name", "platform", "displayedRewardYenCandidates",\n            "stepRewardPoints", "stepTotalPoints", "verifiedCurrentRewardYen",\n            "rewardUnit", "sourcePointRate", "headerText", "termsText",\n            "publicationAuthorized",\n        ],\n        "rewardUnit": "JPY-equivalent",\n        "sourcePointRate": "10pt=1JPY",\n        "pointField": "stepTotalPoints",\n        "pointScale": 10,\n        "termsMarkers": ("ポイント獲得条件", "成果受付期限"),\n    },\n}\n'''
          if old not in text:
              raise SystemExit('reward-only contract block not found')
          text = text.replace(old, new, 1)

          old = '''    require(e.get("rewardUnit") == contract["rewardUnit"], "unknown_reward_unit")\n    require(\n        e.get("sourcePointRate") == contract["sourcePointRate"],\n        "unit_conversion_review_required",\n    )\n    if sid == "hapitas":\n        require(\n            e.get("verifiedCurrentRewardPoints") == reward\n            and e.get("displayedCurrentRewardPoints") == reward,\n            "yen_point_mismatch",\n        )\n        steps = e.get("stepRewardPoints")\n        require(isinstance(steps, list), "invalid_steps")\n        if steps:\n            require(\n                all(type(value) is int and value >= 0 for value in steps),\n                "invalid_step",\n            )\n            require(sum(steps) == reward, "step_total_mismatch")\n'''
          new = '''    require(e.get("rewardUnit") == contract["rewardUnit"], "unknown_reward_unit")\n    if "sourcePointRate" in contract:\n        require(\n            e.get("sourcePointRate") == contract["sourcePointRate"],\n            "unit_conversion_review_required",\n        )\n    point_field = contract.get("pointField")\n    if point_field:\n        points = e.get(point_field)\n        scale = contract.get("pointScale")\n        require(\n            type(points) is int and type(scale) is int and scale > 0\n            and points == reward * scale,\n            "yen_point_mismatch",\n        )\n    if sid == "hapitas":\n        require(e.get("displayedCurrentRewardPoints") == reward, "yen_point_mismatch")\n        steps = e.get("stepRewardPoints")\n        require(isinstance(steps, list), "invalid_steps")\n        if steps:\n            require(\n                all(type(value) is int and value >= 0 for value in steps),\n                "invalid_step",\n            )\n            require(sum(steps) == reward, "step_total_mismatch")\n    elif sid == "point_town":\n        require(\n            not re.search(r"で\\s*[0-9][0-9,]*\\s+[0-9][0-9,]*(?:\\s|$)",\n                          str(e.get("headerText") or "")),\n            "ambiguous_displayed_reward",\n        )\n    elif sid == "amefuri":\n        steps = e.get("stepRewardPoints")\n        require(isinstance(steps, list) and len(steps) >= 2, "invalid_steps")\n        require(all(type(value) is int and value >= 0 for value in steps), "invalid_step")\n        require(sum(steps) == e.get("stepTotalPoints"), "step_total_mismatch")\n        displayed = e.get("displayedRewardYenCandidates")\n        require(isinstance(displayed, list) and reward in displayed, "displayed_reward_mismatch")\n'''
          if old not in text:
              raise SystemExit('reward-only validation block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Syntax and focused regression tests
        run: |
          python -m py_compile scripts/direct_offer_refresh.py scripts/daily_scan_review.py scripts/structured_publication.py scripts/unified_offer_snapshot.py tests/test_unified_eight_site_pipeline.py
          python -m pytest -q \
            tests/test_unified_eight_site_pipeline.py \
            tests/test_structured_publication.py \
            tests/test_daily_scan_review.py \
            tests/test_daily_scan_review_recall.py \
            tests/test_direct_offer_refresh_v1.py \
            tests/test_new_game_content_queue.py

      - name: Commit permanent changes only
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-build-unified-eight-site.yml
          git config user.name "poigamelab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/refresh_policy.json scripts/direct_offer_refresh.py scripts/structured_publication.py .github/workflows/refresh-verified-offers.yml
          git add -u .github/workflows/tmp-build-unified-eight-site.yml
          git diff --cached --check
          git commit -m "feat: unify eight-site offer crawl for listed games"
          git push origin HEAD:feat/unified-eight-site-offers-v2
