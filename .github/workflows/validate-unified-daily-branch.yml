name: Validate unified daily branch

on:
  push:
    branches:
      - feat/unified-daily-free-pipeline

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax checks
        run: |
          python -m py_compile scripts/adopt_verified_games.py scripts/publish_verified_offers.py scripts/direct_offer_refresh.py scripts/daily_scan_review.py scripts/structured_publication.py scripts/validate_daily_publication.py
          node --check assets/current-offers.js
          node --check site-footer.js
      - name: Focused regression suite
        run: |
          python -m pytest -q \
            tests/test_phase3_production_adoption_v30.py \
            tests/test_high_reward_adoption_bridge.py \
            tests/test_enable_adopted_refresh.py \
            tests/test_structured_publication.py \
            tests/test_daily_scan_review.py \
            tests/test_daily_publication_gate.py
