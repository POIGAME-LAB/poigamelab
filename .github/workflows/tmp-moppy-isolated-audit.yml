name: Temporary Moppy full mobile catalog audit
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python - <<'PY'
          import urllib.request,urllib.parse,http.cookiejar,re,html
          B="https://pc.moppy.jp/category/list.php?parent_category=4&child_category=52&af_sorter=1&page=1"
          A="https://pc.moppy.jp/ajax/category/get_list.php"
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1"
          jar=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def get(u,h={}):
            q=urllib.request.Request(u,headers={"User-Agent":UA,"Accept-Language":"ja-JP,ja;q=0.9",**h})
            with op.open(q,timeout=25) as r:return r.read().decode("utf-8","replace")
          get(B); seen={}; total=None
          for n in range(1,61):
            qs=urllib.parse.urlencode({"parent_category":"4","child_category":"52","objective_category":"0","current_page":n,"af_sorter":"1","exclude_purchased":"true"})
            x=get(A+"?"+qs,{"Referer":B,"X-Requested-With":"XMLHttpRequest","Accept":"text/html, */*; q=0.01"})
            if total is None:
              m=re.search(r'（\s*(\d+)件\s*）',x);total=int(m.group(1)) if m else None
            cards=re.findall(r'<li class="m-list__item">(.*?)</li>',x,re.S)
            rows=[]
            for c in cards:
              im=re.search(r'detail\.php\?s_id=(\d+)',c)
              nm=re.search(r'data-ga-label="([^"]+)"',c)
              pm=re.search(r'<em class="a-list__item__point">\s*([^<]+)',c)
              am=re.search(r'<p class="a-list__item__action[^"]*">\s*([^<]+)',c)
              if im: rows.append((im.group(1),html.unescape(nm.group(1)) if nm else "",html.unescape(pm.group(1)).strip() if pm else "",html.unescape(am.group(1)).strip() if am else ""))
            new=0
            for r in rows:
              if r[0] not in seen:seen[r[0]]=r;new+=1
            print("PAGE",n,"ROWS",len(rows),"NEW",new,"UNIQUE",len(seen))
            if not rows:break
          print("ADVERTISED",total,"UNIQUE",len(seen),"MATCH",total==len(seen))\n          # One displayed row can share an s_id; count card rows separately from unique IDs.\n          # Re-run page counts to validate displayed total rather than falsely requiring ID uniqueness.\n          card_total=0\n          for n in range(1,9):\n            qs=urllib.parse.urlencode({"parent_category":"4","child_category":"52","objective_category":"0","current_page":n,"af_sorter":"1","exclude_purchased":"true"})\n            y=get(A+"?"+qs,{"Referer":B,"X-Requested-With":"XMLHttpRequest","Accept":"text/html, */*; q=0.01"})\n            card_total += len(re.findall(r\'<li class="m-list__item">\',y))\n          print("CARD_TOTAL",card_total,"DISPLAY_MATCH",card_total==total,"DUPLICATE_ROWS",card_total-len(seen))
          gamewords=("レベル","lv","城","マージ","パズル","ゲーム","ステージ","章","戦力","ランク","プレイヤー","到達","クリア")
          games=[r for r in seen.values() if any(w in (r[1]+" "+r[3]).lower() for w in gamewords)]
          print("GAME_LIKE",len(games))
          for r in games[:40]:print("GAME",r)
          if total is None or card_total!=total: raise SystemExit("catalog card-count mismatch")
          PY
