name: Temporary Moppy isolated discovery audit
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Inspect public Moppy navigation
        run: |
          python - <<'PY'
          import json,re
          from http.cookiejar import CookieJar
          from urllib.request import build_opener,HTTPCookieProcessor
          import scripts.direct_offer_refresh as d
          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          s=next(x for x in cfg["sources"] if x["id"]=="moppy")
          uas={"desktop":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36","ios":"Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1","android":"Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36"}
          opener=build_opener(d.FirstPartyRedirectHandler(s),HTTPCookieProcessor(CookieJar()))
          raw,base=d.fetch_first_party(s["listing_session_bootstrap_url"],s,opener=opener)
          print("BOOTSTRAP",len(raw.encode()))
          for pat in [r'<form[^>]*>.*?</form>',r'href=["\\\'][^"\\\']*(?:app|game|category)[^"\\\']*["\\\']',r'(?:parent_category|child_category)[^<"\\\']{0,160}']:
            hits=re.findall(pat,raw,re.I|re.S)
            print("HINT",pat,"COUNT",len(hits))
            for h in hits[:100]: print(re.sub(r'\\s+',' ',h)[:700])
          exact="parent_category, child_category, current_page, af_sorter, exclude_purchased"
          pos=raw.find(exact)
          print("EXACT_PAGINATION",raw[max(0,pos-3000):pos+7000].replace("\\n"," ") if pos>=0 else "NONE")
          print("PHP_URLS",sorted(set(re.findall(r'[^"\\\' ]+\\.php(?:\\?[^"\\\' ]*)?',raw,re.I)))[:150])
          idx=raw.find("function get")
          for needle in ["current_page", "af_sorter", "exclude_purchased", "ajax"]:
            pos=raw.find(needle)
            print("SNIPPET",needle,raw[max(0,pos-1200):pos+2600].replace("\\n"," ") if pos>=0 else "NONE")
          print("SCRIPTS",re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)',raw,re.I))
          from urllib.parse import urlencode
          for label,ua in uas.items():
            ss=dict(s)
            op=build_opener(d.FirstPartyRedirectHandler(ss),HTTPCookieProcessor(CookieJar()))
            boot,_=d.fetch_first_party(ss["listing_session_bootstrap_url"],ss,opener=op,extra_headers={"User-Agent":ua})
            print("UA",label,"BOOT",len(boot.encode()))
            for page in range(1,4):
              url="https://pc.moppy.jp/ajax/category/get_list.php?"+urlencode({"parent_category":"4","child_category":"52","objective_category":"0","current_page":str(page),"af_sorter":"1","exclude_purchased":"true"})
              try:
                body,final=d.fetch_first_party(url,ss,opener=op,extra_headers={"User-Agent":ua,"Referer":ss["listing_session_bootstrap_url"],"X-Requested-With":"XMLHttpRequest","Accept":"text/html,*/*;q=0.8"})
                cand=d.discover_new_game_listing_candidates(body,final,ss,[],limit=500)
                print("UA_PAGE",label,page,"bytes",len(body.encode()),"candidates",len(cand),"sample",[x.get("titleHint") for x in cand[:5]])
              except Exception as e: print("UA_PAGE",label,page,"ERROR",d.summarize_fetch_error(e))
          PY
