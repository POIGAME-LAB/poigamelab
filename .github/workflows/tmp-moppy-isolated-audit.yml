name: Temporary Moppy detail audit
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify known public game details
        run: |
          python - <<'PY'
          import json
          import scripts.direct_offer_refresh as d
          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          s=next(x for x in cfg["sources"] if x["id"]=="moppy")
          for url,name in [
            ("https://pc.moppy.jp/ad/detail.php?site_id=160726","MONOPOLY GO!"),
            ("https://pc.moppy.jp/ad/detail.php?site_id=160688","メメントモリ"),
            ("https://pc.moppy.jp/ad/detail.php?site_id=154630","出荷ぶた")]:
            try:
              raw,final=d.fetch_first_party(url,s)
              ev=d.inspect_offer(raw,final,s,[name])
              print("DETAIL",name,len(raw.encode()),{k:ev.get(k) for k in ("state","rewardPoints","rewardUnit","verifiedCurrentRewardPoints","platform","parserVersion")})
            except Exception as e: print("DETAIL",name,"ERROR",d.summarize_fetch_error(e),type(e).__name__)
          PY
