name: Temporary Moppy route audit
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Probe alternative public Moppy routes
        run: |
          python - <<'PY'
          import json,re
          from urllib.parse import urljoin
          import scripts.direct_offer_refresh as d
          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          s=next(x for x in cfg["sources"] if x["id"]=="moppy")
          urls=[
            "https://pc.moppy.jp/ad/category_ranking/list.php",
            "https://pc.moppy.jp/help/?category_id=9",
            "https://pc.moppy.jp/help/?category_id=16",
            "https://pc.moppy.jp/gamecontents/",
          ]
          for url in urls:
            try:
              raw,final=d.fetch_first_party(url,s)
              print("ROUTE",url,"bytes",len(raw.encode()),"final",final)
              links=sorted(set(urljoin(final,h) for h in re.findall(r'href=["\\\']([^"\\\']+)',raw,re.I)))
              for h in links:
                if any(k in h.lower() for k in ("category","ranking","game","app","ajax")):
                  print("LINK",url,"=>",h)
            except Exception as e: print("ROUTE",url,"ERROR",d.summarize_fetch_error(e))
          PY
