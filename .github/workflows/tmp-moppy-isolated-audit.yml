name: Temporary Moppy exceptional-card audit
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python - <<'PY'
          import urllib.request,urllib.parse,http.cookiejar,re
          B="https://pc.moppy.jp/category/list.php?parent_category=4&child_category=52&af_sorter=1&page=1";A="https://pc.moppy.jp/ajax/category/get_list.php"
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1"
          jar=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def get(u,h={}):
            q=urllib.request.Request(u,headers={"User-Agent":UA,"Accept-Language":"ja-JP,ja;q=0.9",**h})
            with op.open(q,timeout=25) as r:return r.read().decode("utf-8","replace")
          get(B)
          qs=urllib.parse.urlencode({"parent_category":4,"child_category":52,"objective_category":0,"current_page":5,"af_sorter":1,"exclude_purchased":"true"})
          x=get(A+"?"+qs,{"Referer":B,"X-Requested-With":"XMLHttpRequest","Accept":"text/html, */*; q=0.01"})
          cards=re.findall(r'<li class="m-list__item">(.*?)</li>',x,re.S)
          print("CARDS",len(cards))
          for i,c in enumerate(cards,1):
            if not re.search(r'detail\.php\?s_id=(\d+)',c):
              print("NO_ID_INDEX",i)
              print("NO_ID_CARD",re.sub(r'\s+',' ',c)[:5000])
          PY
