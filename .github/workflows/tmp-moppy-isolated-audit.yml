name: Temporary Moppy detail parser regression
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/moppy-isolated-collector-20260923}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m py_compile scripts/direct_offer_refresh.py
          python - <<'PY'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location("d","scripts/direct_offer_refresh.py");d=importlib.util.module_from_spec(spec);spec.loader.exec_module(d)
          cfg=json.load(open("config/point_sources.json",encoding="utf-8"));s=next(x for x in cfg["sources"] if x["id"]=="moppy")
          cases=[("Impossible Kart",159942,145),("放置少女",147269,1852),("パズル＆サバイバル",157998,2700),("信長の野望",161201,6000),("Family Island",162198,2470),("Arrow Away",162167,300)]
          for name,sid,expected in cases:
            u=f"https://pc.moppy.jp/ad/detail.php?s_id={sid}";raw,final=d.fetch_first_party(u,s)
            out=d.inspect_moppy_offer(raw,u,final,[name])
            print("DETAIL",name,out.get("state"),out.get("platform"),out.get("displayedRewardPoints"),out.get("reason"))
            assert out["state"]=="parsed",out
            assert out["displayedRewardPoints"]==expected,(name,out)
            assert out["displayedRewardYen"]==expected
          PY
