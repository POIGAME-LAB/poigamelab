name: Temporary Moppy isolated discovery audit
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Inspect public Moppy navigation
        run: |
          python - <<'PY'
          import json,re
          from http.cookiejar import CookieJar
          from urllib.request import build_opener,HTTPCookieProcessor
          import scripts.direct_offer_refresh as d
          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          s=next(x for x in cfg["sources"] if x["id"]=="moppy")
          opener=build_opener(d.FirstPartyRedirectHandler(s),HTTPCookieProcessor(CookieJar()))
          raw,base=d.fetch_first_party(s["listing_session_bootstrap_url"],s,opener=opener)
          print("BOOTSTRAP",len(raw.encode()))
          for pat in [r'<form[^>]*>.*?</form>',r'href=["\\\'][^"\\\']*(?:app|game|category)[^"\\\']*["\\\']',r'(?:parent_category|child_category)[^<"\\\']{0,160}']:
            hits=re.findall(pat,raw,re.I|re.S)
            print("HINT",pat,"COUNT",len(hits))
            for h in hits[:100]: print(re.sub(r'\\s+',' ',h)[:700])
          idx=raw.find("function get")
          for needle in ["current_page", "af_sorter", "exclude_purchased", "ajax"]:
            pos=raw.find(needle)
            print("SNIPPET",needle,raw[max(0,pos-1200):pos+2600].replace("\\n"," ") if pos>=0 else "NONE")
          print("SCRIPTS",re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)',raw,re.I))
          for page in range(1,6):
            url=s["new_game_discovery_page_url_template"].replace("{page}",str(page))
            try:
              body,final=d.fetch_first_party(url,s,opener=opener,extra_headers={"Referer":s["listing_session_bootstrap_url"],"X-Requested-With":"XMLHttpRequest","Accept":"text/html,*/*;q=0.8"})
              cand=d.discover_new_game_listing_candidates(body,final,s,[],limit=500)
              print("PAGE",page,"bytes",len(body.encode()),"candidates",len(cand),"sample",[x.get("titleHint") for x in cand[:5]])
            except Exception as e: print("PAGE",page,"ERROR",d.summarize_fetch_error(e))
          PY
