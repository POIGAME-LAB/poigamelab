name: Temporary Moppy LKG regression
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/moppy-isolated-collector-20260923}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m py_compile scripts/direct_offer_refresh.py
          cp data/published_offers.csv /tmp/before.csv
          python scripts/direct_offer_refresh.py || true
          python - <<'PY'
          import csv,hashlib,json
          def rows(p):
            with open(p,encoding="utf-8",newline="") as f:return list(csv.DictReader(f))
          a=rows("/tmp/before.csv");b=rows("data/published_offers.csv")
          ma=[r for r in a if r["site"]=="moppy"];mb=[r for r in b if r["site"]=="moppy"]
          print("MOPPY_BEFORE",len(ma),"AFTER",len(mb))
          changed=[]
          ka={r["offerKey"]:r for r in ma};kb={r["offerKey"]:r for r in mb}
          for k in sorted(set(ka)|set(kb)):
            if ka.get(k)!=kb.get(k):changed.append((k,ka.get(k),kb.get(k)))
          print("MOPPY_CHANGED",len(changed))
          for x in changed[:10]:print("CHANGE",x)
          print("WHOLE_FILE_CHANGED",hashlib.sha256(open("/tmp/before.csv","rb").read()).hexdigest()!=hashlib.sha256(open("data/published_offers.csv","rb").read()).hexdigest())
          q=json.load(open("data/comparison_review_queue.json",encoding="utf-8"))
          mq=[x for x in q if x.get("source")=="moppy"]
          print("MOPPY_REVIEW",len(mq))
          from collections import Counter
          print("MOPPY_REASONS",dict(Counter(x.get("reason") for x in mq)))
          assert not changed
          PY
