name: Temporary Moppy isolated discovery audit
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Audit Moppy listing routes without publishing
        run: |
          python - <<'PY'
          import json,re
          from http.cookiejar import CookieJar
          from urllib.request import build_opener,HTTPCookieProcessor
          import scripts.direct_offer_refresh as d
          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          s=next(x for x in cfg["sources"] if x["id"]=="moppy")
          opener=build_opener(d.FirstPartyRedirectHandler(s),HTTPCookieProcessor(CookieJar()))
          raw,base=d.fetch_first_party(s["listing_session_bootstrap_url"],s,opener=opener)
          print("BOOTSTRAP",len(raw.encode()),"detail_ids",len(set(re.findall(r'ad/detail\\.php\\?(?:site_id|s_id)=[0-9]+',raw))))
          for page in range(1,11):
            url=s["new_game_discovery_page_url_template"].replace("{page}",str(page))
            try:
              raw,final=d.fetch_first_party(url,s,opener=opener,extra_headers={"Referer":s["listing_session_bootstrap_url"],"X-Requested-With":"XMLHttpRequest","Accept":"text/html,*/*;q=0.8"})
              sig=d.listing_detail_identity_signature(raw,final,s,limit=5000)
              cand=d.discover_new_game_listing_candidates(raw,final,s,[],limit=500)
              print("PAGE",page,"bytes",len(raw.encode()),"identities",len(sig),"candidates",len(cand),"sample",[x.get("titleHint") for x in cand[:3]])
            except Exception as e:
              print("PAGE",page,"ERROR",d.summarize_fetch_error(e),type(e).__name__)
          PY
