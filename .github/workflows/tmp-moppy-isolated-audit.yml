name: Temporary Moppy production-path test
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/moppy-isolated-collector-20260923}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Syntax and focused tests
        run: |
          python -m py_compile scripts/direct_offer_refresh.py
          python -m pytest -q tests/test_import_moppy_device_catalog.py
      - name: Exercise production discovery helpers against live Moppy catalog
        run: |
          python - <<'PY'
          import importlib.util,json
          from urllib.request import build_opener,HTTPCookieProcessor
          from http.cookiejar import CookieJar
          spec=importlib.util.spec_from_file_location("d","scripts/direct_offer_refresh.py");d=importlib.util.module_from_spec(spec);spec.loader.exec_module(d)
          cfg=json.load(open("config/point_sources.json",encoding="utf-8"));s=next(x for x in cfg["sources"] if x["id"]=="moppy")
          opener=build_opener(d.FirstPartyRedirectHandler(s),HTTPCookieProcessor(CookieJar()))
          boot,_=d.fetch_first_party(s["listing_session_bootstrap_url"],s,opener=opener)
          all_ids=[]; all_candidates=[]
          for page in range(1,10):
            u=d.paginated_listing_url(s,page)
            raw,final=d.fetch_first_party(u,s,opener=opener,extra_headers={"Referer":s["listing_session_bootstrap_url"],"X-Requested-With":"XMLHttpRequest","Accept":"text/html, */*; q=0.01"})
            sig=d.listing_detail_identity_signature(raw,final,s)
            cand=d.discover_new_game_listing_candidates(raw,final,s,[],limit=500)
            print("PAGE",page,"IDENTITIES",len(sig),"CANDIDATES",len(cand))
            if not sig: break
            all_ids.extend(sig);all_candidates.extend(cand)
          uniq=set(all_ids)
          print("TOTAL_IDENTITIES",len(all_ids),"UNIQUE",len(uniq),"CANDIDATES",len(all_candidates))
          print("SAMPLE",[(x["titleHint"][:70],x["firstPartyCandidateUrl"]) for x in all_candidates[:12]])
          assert len(uniq)>=225, len(uniq)
          assert any(":s_id:" in x for x in uniq)
          assert any("Impossible Kart" in x["titleHint"] for x in all_candidates)
          PY
