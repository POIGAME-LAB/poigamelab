name: Temporary Moppy frontend-source audit
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests beautifulsoup4
      - name: Trace Moppy app-list data source
        run: |
          python - <<'PY'
          import re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"}
          u="https://pc.moppy.jp/category/list.php?parent_category=4&child_category=52&af_sorter=1&page=1"
          s=requests.Session(); r=s.get(u,headers=H,timeout=20); print("BOOT",r.status_code,len(r.content))
          soup=BeautifulSoup(r.text,"html.parser")
          scripts=[urljoin(r.url,x.get("src")) for x in soup.find_all("script") if x.get("src")]
          print("SCRIPTS",len(scripts))
          needles=("get_list.php","getCategoryList","current_page","exclude_purchased","objective_category","child_category")
          for js in scripts:
            try:
              q=s.get(js,headers={**H,"Referer":u},timeout=20)
              if any(n in q.text for n in needles):
                print("JS",q.status_code,len(q.content),js)
                for line in q.text.splitlines():
                  if any(n in line for n in needles): print("SRC",line.strip()[:1000])
            except Exception as e: print("JSERR",js,type(e).__name__)
          # Probe the exact endpoint with plausible browser pagination/query variants, GET and POST.
          ep="https://pc.moppy.jp/ajax/category/get_list.php"
          base={"parent_category":"4","child_category":"52","objective_category":"0","af_sorter":"1","exclude_purchased":"true"}
          for method in ("GET","POST"):
            for key in ("current_page","page"):
              for page in (1,2,3):
                d={**base,key:str(page)}
                h={**H,"Referer":u,"X-Requested-With":"XMLHttpRequest","Accept":"text/html, */*;q=0.9"}
                q=s.request(method,ep,params=d if method=="GET" else None,data=d if method=="POST" else None,headers=h,timeout=20)
                ids=set(re.findall(r'(?:detail\.php\?site_id=|site_id["\\\'=:\s]+)(\d{4,})',q.text,re.I))
                print("AJAX",method,key,page,q.status_code,len(q.content),"ids",len(ids),sorted(ids)[:8],"head",repr(" ".join(BeautifulSoup(q.text,"html.parser").stripped_strings)[:160]))
          PY
