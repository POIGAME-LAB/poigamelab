name: Temporary Moppy discovery audit
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests beautifulsoup4
      - name: Discover Moppy public game details
        run: |
          python - <<'PY'
          import re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"}
          seeds=[
           "https://pc.moppy.jp/ad/category_ranking/list.php",
           "https://pc.moppy.jp/category/list.php?parent_category=4&child_category=52&af_sorter=1&page=1",
           "https://pc.moppy.jp/gamecontents/",
          ]
          ids={}
          for u in seeds:
            r=requests.get(u,headers=H,timeout=20); print("SEED",r.status_code,len(r.content),u)
            for m in re.finditer(r'(?:detail\.php\?site_id=|site_id["\\\'=:\s]+)(\d{4,})',r.text,re.I):
              ids[m.group(1)]=u
          print("DIRECT_IDS",len(ids),sorted(ids)[:30])
          # Bing HTML public discovery, queries deliberately broad and Moppy-domain scoped.
          for q in ["site:pc.moppy.jp/ad/detail.php ゲーム モッピー","site:pc.moppy.jp/ad/detail.php アプリ レベル モッピー","site:pc.moppy.jp/ad/detail.php 城 レベル モッピー"]:
            r=requests.get("https://www.google.com/search",params={"q":q,"num":100},headers=H,timeout=20)
            print("SEARCH",r.status_code,len(r.content),q)
            for sid in re.findall(r'pc\.moppy\.jp/ad/detail\.php\?site_id%3D(\d+)|pc\.moppy\.jp/ad/detail\.php\?site_id=(\d+)',r.text):
              x=next(v for v in sid if v); ids[x]="search"
          print("ALL_IDS",len(ids),sorted(ids))
          # Validate discovered detail pages and print title/reward-ish snippets.
          good=0
          for sid in sorted(ids):
            u=f"https://pc.moppy.jp/ad/detail.php?site_id={sid}"
            r=requests.get(u,headers=H,timeout=20)
            s=BeautifulSoup(r.text,"html.parser")
            h=s.find("h1"); title=" ".join(h.stripped_strings) if h else (s.title.get_text(" ",strip=True) if s.title else "")
            txt=" ".join(s.stripped_strings)
            rewards=re.findall(r'\b[\d,]{2,}\s*P\b',txt,re.I)[:4]
            if r.status_code==200 and len(r.content)>100000: good+=1
            print("DETAIL",sid,r.status_code,len(r.content),repr(title[:100]),rewards)
          print("GOOD_DETAIL_PAGES",good)
          PY
