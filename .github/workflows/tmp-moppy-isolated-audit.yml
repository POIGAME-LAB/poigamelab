name: Temporary Moppy detail parser audit
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/moppy-isolated-collector-20260923}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python - <<'PY'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location("d","scripts/direct_offer_refresh.py");d=importlib.util.module_from_spec(spec);spec.loader.exec_module(d)
          cfg=json.load(open("config/point_sources.json",encoding="utf-8"));s=next(x for x in cfg["sources"] if x["id"]=="moppy")
          cases=[("Impossible Kart",159942),("放置少女",147269),("パズル＆サバイバル",157998),("信長の野望",161201),("Family Island",162198),("Arrow Away",162167)]
          for name,sid in cases:
            u=f"https://pc.moppy.jp/ad/detail.php?s_id={sid}"
            raw,final=d.fetch_first_party(u,s)
            out=d.inspect_moppy_offer(raw,u,final,[name])
            doc=d.EvidenceHTML(raw).root
            h=d.evidence_text(d.one(doc.find(tag="h1")))
            textv=d.visible_text(raw); pos=textv.find(h); tail=textv[pos:pos+1200] if pos>=0 else textv[:1200]
            print("DETAIL",name,sid,len(raw),out.get("state"),out.get("reason"))
            print("H1",repr(h))
            print("HEAD",repr(tail[:700]))
          PY
