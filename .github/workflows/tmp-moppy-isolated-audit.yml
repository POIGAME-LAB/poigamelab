name: Temporary Moppy detail DOM audit
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/moppy-isolated-collector-20260923}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python - <<'PY'
          import importlib.util,json,re
          spec=importlib.util.spec_from_file_location("d","scripts/direct_offer_refresh.py");d=importlib.util.module_from_spec(spec);spec.loader.exec_module(d)
          cfg=json.load(open("config/point_sources.json",encoding="utf-8"));s=next(x for x in cfg["sources"] if x["id"]=="moppy")
          for name,sid in [("Impossible Kart",159942),("信長の野望",161201),("Arrow Away",162167)]:
            u=f"https://pc.moppy.jp/ad/detail.php?s_id={sid}";raw,final=d.fetch_first_party(u,s)
            print("CASE",name)
            for m in re.finditer(r".{0,120}(?:145P|6,000P|300P|ポイント獲得条件|成果受付期間|iOS|Android).{0,180}",raw,re.I|re.S):
              z=re.sub(r"\s+"," ",m.group(0))
              if "script" not in z.lower(): print("RAW",z[:360])
          PY
