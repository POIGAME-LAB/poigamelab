name: Temporary Moppy device-import test
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pytest
      - run: pytest -q tests/test_import_moppy_device_catalog.py
      - name: Simulate current 231-row iPhone catalog
        run: |
          python - <<'PY'
          import json
          json.dump({"siteIds":[str(160000+i) for i in range(231)]},open("/tmp/moppy.json","w"))
          PY
          python scripts/import-moppy-device-catalog.py /tmp/moppy.json /tmp/accepted.json
          python -c 'import json; d=json.load(open("/tmp/accepted.json")); assert d["count"]==231 and d["candidateOnly"] and not d["catalogCompleteClaim"]'
