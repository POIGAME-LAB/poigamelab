name: Temporary Moppy mobile-structure audit
on:
  push:
    branches: [feat/moppy-isolated-collector-20260923]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python - <<'PY'
          import urllib.request,urllib.parse,http.cookiejar,re,html as H
          B="https://pc.moppy.jp/category/list.php?parent_category=4&child_category=52&af_sorter=1&page=1"
          A="https://pc.moppy.jp/ajax/category/get_list.php"
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1"
          jar=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def get(u,h={}):
            q=urllib.request.Request(u,headers={"User-Agent":UA,"Accept-Language":"ja-JP,ja;q=0.9",**h})
            with op.open(q,timeout=20) as r:return r.read().decode("utf-8","replace")
          get(B)
          def page(n):
            qs=urllib.parse.urlencode({"parent_category":"4","child_category":"52","objective_category":"0","current_page":str(n),"af_sorter":"1","exclude_purchased":"true"})
            return get(A+"?"+qs,{"Referer":B,"X-Requested-With":"XMLHttpRequest","Accept":"text/html, */*; q=0.01"})
          for n in (1,2):
            x=page(n); print("PAGE",n,"BYTES",len(x),"COUNT",re.findall(r'アプリ広告一覧\s*[（(]\s*(\d+)件',x))
            hrefs=[H.unescape(v) for v in re.findall(r'href\s*=\s*["\x27]([^"\x27]+)',x,re.I)]
            print("HREF_COUNT",len(hrefs)); print("HREFS",hrefs[:80])
            for key in ("site_id","siteId","ad_id","adId","campaign","detail","entry","program","id="):
              vals=re.findall(r'.{0,100}'+re.escape(key)+r'.{0,180}',x,re.I|re.S)
              if vals: print("KEY",key,[re.sub(r'\s+',' ',v)[:280] for v in vals[:12]])
            # first candidate/card-like chunks containing points
            chunks=re.findall(r'<(?:li|article|div)[^>]*>.*?</(?:li|article|div)>',x,re.I|re.S)
            samples=[]
            for c in chunks:
              t=re.sub(r'<[^>]+>',' ',c);t=re.sub(r'\s+',' ',H.unescape(t)).strip()
              if re.search(r'\d[\d,]*\s*P',t,re.I) and 20<len(t)<1500:samples.append((t[:500],c[:1500]))
            print("SAMPLES",samples[:5])
          PY
