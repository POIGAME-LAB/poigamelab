name: Validate unified new-game content pipeline

on:
  push:
    branches:
      - feat/unified-daily-free-pipeline

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax checks
        run: |
          python -m py_compile \
            scripts/research_new_game_channels.py \
            scripts/build_new_game_content_packages.py \
            scripts/new_game_content_gate.py \
            scripts/render_new_game_guide.py \
            scripts/write_new_game_content_queue.py \
            scripts/adopt_verified_games.py \
            scripts/publish_verified_offers.py
      - name: Offline regression suite
        run: |
          python -m pytest -q \
            tests/test_research_new_game_channels.py \
            tests/test_new_game_research_workflow.py \
            tests/test_build_new_game_content_packages.py \
            tests/test_new_game_content_queue.py \
            tests/test_new_game_content_gate.py \
            tests/test_render_generated_guides.py \
            tests/test_phase3_production_adoption_v30.py \
            tests/test_v30_real_research_fixtures.py
