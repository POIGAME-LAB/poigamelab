name: Validate unified offer pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/unified-eight-site-offers-v2
    paths:
      - "config/refresh_policy.json"
      - "scripts/direct_offer_refresh.py"
      - "scripts/daily_scan_review.py"
      - "scripts/structured_publication.py"
      - "scripts/unified_offer_snapshot.py"
      - "scripts/publication_scope_guard.py"
      - "scripts/validate_daily_publication.py"
      - "scripts/write_new_game_content_queue.py"
      - "tests/test_unified_eight_site_pipeline.py"
      - "tests/test_unified_daily_integration.py"
      - "tests/test_unified_nightly_workflow.py"
      - "tests/test_publication_scope_guard.py"
      - "tests/test_archived_offer_visibility.js"
      - "tests/test_structured_publication.py"
      - "tests/test_daily_scan_review.py"
      - "tests/test_daily_scan_review_recall.py"
      - "tests/test_daily_scan_resilient_fetch.py"
      - "tests/test_new_game_content_queue.py"
      - "tests/test_direct_offer_refresh_v1.py"
      - ".github/workflows/refresh-verified-offers.yml"
      - ".github/workflows/validate-unified-offers.yml"
  pull_request:
    branches:
      - main
    paths:
      - "config/refresh_policy.json"
      - "scripts/direct_offer_refresh.py"
      - "scripts/daily_scan_review.py"
      - "scripts/structured_publication.py"
      - "scripts/unified_offer_snapshot.py"
      - "scripts/publication_scope_guard.py"
      - "scripts/validate_daily_publication.py"
      - "scripts/write_new_game_content_queue.py"
      - "tests/test_unified_eight_site_pipeline.py"
      - "tests/test_unified_daily_integration.py"
      - "tests/test_unified_nightly_workflow.py"
      - "tests/test_publication_scope_guard.py"
      - "tests/test_archived_offer_visibility.js"
      - "tests/test_structured_publication.py"
      - "tests/test_daily_scan_review.py"
      - "tests/test_daily_scan_review_recall.py"
      - "tests/test_daily_scan_resilient_fetch.py"
      - "tests/test_new_game_content_queue.py"
      - "tests/test_direct_offer_refresh_v1.py"
      - ".github/workflows/refresh-verified-offers.yml"
      - ".github/workflows/validate-unified-offers.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Syntax checks
        run: |
          python -m py_compile \
            scripts/direct_offer_refresh.py \
            scripts/daily_scan_review.py \
            scripts/structured_publication.py \
            scripts/unified_offer_snapshot.py \
            scripts/publication_scope_guard.py \
            scripts/validate_daily_publication.py \
            tests/test_unified_eight_site_pipeline.py \
            tests/test_unified_daily_integration.py \
            tests/test_unified_nightly_workflow.py \
            tests/test_publication_scope_guard.py \
            tests/test_daily_scan_resilient_fetch.py

      - name: Unified foundation and daily integration tests
        run: |
          python -m pytest -q \
            tests/test_unified_eight_site_pipeline.py \
            tests/test_unified_daily_integration.py \
            tests/test_unified_nightly_workflow.py \
            tests/test_publication_scope_guard.py \
            tests/test_structured_publication.py \
            tests/test_daily_scan_review.py \
            tests/test_daily_scan_review_recall.py \
            tests/test_daily_scan_resilient_fetch.py \
            tests/test_new_game_content_queue.py \
            'tests/test_direct_offer_refresh_v1.py::test_listing_failure_is_retained_with_or_without_known_details[404-True]' \
            'tests/test_direct_offer_refresh_v1.py::test_listing_failure_is_retained_with_or_without_known_details[429-True]' \
            tests/test_direct_offer_refresh_v1.py::test_moppy_first_party_terms_map_appdriver_without_external_fetch

      - name: Archived rows stay out of current comparison UI
        run: node tests/test_archived_offer_visibility.js
