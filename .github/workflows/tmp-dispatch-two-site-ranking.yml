name: Temporary dispatch two-site ranking refresh
on:
  push:
    branches: [ops/run-two-site-ranking-refresh-20260924]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical refresh on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-verified-offers.yml --repo POIGAME-LAB/poigamelab --ref main
