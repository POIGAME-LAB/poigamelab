name: Temporary Amefuri v2 validation
on:
  push:
    branches: [fix/amefuri-live-parser-20260924]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect remaining Amefuri hold patterns
        run: |
          python - <<'PY'
          import json,re,sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d
          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          s=sources["amefuri"]
          for offer_id in ("139291","136152","138766","134928","130963","131569","140544","140783"):
              url=f"https://www.amefri.net/detail/id/{offer_id}"
              raw,final=d.fetch_first_party(url,s,timeout=20,max_bytes=1500000)
              text=d.visible_text(raw)
              doc=d.EvidenceHTML(raw).root
              names=[]
              for node in doc.find(tag="h1"):
                  value=d.evidence_text(node).strip()
                  m=re.fullmatch(r"案件詳細[:：]\s*(.+?)\s*でポイントが貯まる",value)
                  if m:names.append(m.group(1).strip())
              name=names[0] if len(names)==1 else ""
              hs=text.find("アメフリ経由で登録すると")
              oe=text.find("公式サイトを確認",hs)
              ts=text.find("ポイント獲得条件",oe if oe>=0 else hs)
              if ts<0: ts=text.find("ポイント獲得条件",hs)
              end_candidates=[p for marker in ("友達紹介のダウン報酬対象外です。","広告案件のポイント付与に関するご質問","他のユーザーが取り組んでいる案件もチェック") if (p:=text.find(marker,ts+1))>=0] if ts>=0 else []
              te=min(end_candidates) if end_candidates else min(len(text),ts+9000 if ts>=0 else 9000)
              terms=text[ts:te] if ts>=0 else ""
              scope=(name+" "+text[hs:oe if oe>=0 else hs+5000]) if hs>=0 else name
              platforms=sorted(set(re.findall(r"(?<![A-Za-z])(iOS|Android)(?![A-Za-z])",scope,re.I)))
              print("OFFER",offer_id)
              print("NAME",name)
              print("PLATFORMS",json.dumps(platforms,ensure_ascii=False))
              print("PLATFORM_SCOPE",re.sub(r"\s+"," ",scope)[:3500])
              print("TERMS",re.sub(r"\s+"," ",terms)[:7000])
          PY
