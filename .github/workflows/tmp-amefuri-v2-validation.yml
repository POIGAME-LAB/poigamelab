name: Temporary Amefuri v2 validation
on:
  push:
    branches: [fix/amefuri-live-parser-20260924]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused Amefuri regressions
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile scripts/direct_offer_refresh.py scripts/daily_scan_review.py scripts/structured_publication.py
          python -m pytest -q tests/test_direct_offer_refresh_v1.py -k amefuri
          python -m pytest -q tests/test_unified_eight_site_pipeline.py -k reward_contracts
      - name: Restore latest R2 new-game queue
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          aws s3 cp "s3://${R2_BUCKET}/state/latest/new_game_candidate_queue.json.gz" "${tmp}/queue.gz" --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          gzip -dc "${tmp}/queue.gz" > data/new_game_candidate_queue.json
      - name: Verify current Amefuri candidates live
        run: |
          python - <<'PY'
          import collections,json,sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d
          import daily_scan_review as daily
          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          s=sources["amefuri"]
          items=[x for x in json.load(open("data/new_game_candidate_queue.json",encoding="utf-8")).get("items",[])
                 if x.get("source")=="amefuri" and x.get("active",True)]
          sample=[]
          if items:
              step=max(1,len(items)//30)
              for i in range(0,len(items),step):
                  if len(sample)>=30: break
                  sample.append(items[i])
          counts=collections.Counter()
          parsed=[]
          for item in sample:
              url=item.get("firstPartyCandidateUrl")
              alias=daily.discovery_name(item.get("titleHint"))
              raw,final=d.fetch_first_party(url,s,timeout=20,max_bytes=1500000)
              ev=d.inspect_amefuri_offer(raw,url,final,[alias])
              counts[(ev.get("state"),ev.get("reason") or "")]+=1
              row={
                  "titleHint":item.get("titleHint"),"url":url,
                  "state":ev.get("state"),"reason":ev.get("reason"),
                  "parserVersion":ev.get("parserVersion"),
                  "platform":ev.get("platform"),"rewardMode":ev.get("rewardMode"),
                  "rewardYen":ev.get("verifiedCurrentRewardYen"),
                  "steps":len(ev.get("stepRewardPoints") or []),
                  "publicationAuthorized":ev.get("publicationAuthorized"),
              }
              print("LIVE",json.dumps(row,ensure_ascii=False,sort_keys=True))
              if ev.get("state")=="parsed":
                  parsed.append(row)
          print("SUMMARY",json.dumps({
              "sample":len(sample),"parsed":len(parsed),
              "outcomes":{f"{k[0]}|{k[1]}":v for k,v in counts.items()},
          },ensure_ascii=False,sort_keys=True))
          assert parsed, "no live Amefuri candidate parsed"
          assert all(x["parserVersion"]=="amefuri-detail-review-v2" for x in parsed)
          assert all(x["publicationAuthorized"] is False for x in parsed)
          PY
