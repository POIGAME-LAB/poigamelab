name: Temporary two-site ranking validation
on:
  push:
    branches: [fix/two-site-ranking-budget-20260924]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ranking and queue regressions
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile scripts/daily_scan_review.py scripts/write_new_game_content_queue.py
          python -m pytest -q             tests/test_daily_scan_review.py             tests/test_daily_scan_review_recall.py             tests/test_new_game_content_queue.py
