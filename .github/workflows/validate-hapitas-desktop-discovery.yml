name: Validate Hapitas desktop discovery

on:
  pull_request:
    paths:
      - "config/point_sources.json"
      - "tests/test_hapitas_desktop_discovery.py"
      - ".github/workflows/validate-hapitas-desktop-discovery.yml"

permissions:
  contents: read

jobs:
  validate-hapitas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax check
        run: python -m py_compile tests/test_hapitas_desktop_discovery.py
      - name: Run focused Hapitas config test
        run: python -m pytest -q tests/test_hapitas_desktop_discovery.py
