name: Temporary inspect COINCOME R2 state
on:
  push:
    branches: [audit/coincome-r2-state-20260924]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest refresh state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          aws s3 cp "s3://${R2_BUCKET}/state/latest/" "${tmp}/" --recursive --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          for name in new_game_candidate_queue.json new_game_candidate_history.json existing_game_candidate_queue.json comparison_candidate_queue.json comparison_review_queue.json comparison_refresh_status.json daily_scan_review.json new_game_content_queue.json published_offers.csv; do
            if [ -f "${tmp}/${name}.gz" ]; then gzip -dc "${tmp}/${name}.gz" > "data/${name}"; fi
          done
      - name: Inspect COINCOME state
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path

          def load(name):
              p=Path("data")/name
              return json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}

          ex=load("existing_game_candidate_queue.json")
          ng=load("new_game_candidate_queue.json")
          dr=load("daily_scan_review.json")
          st=load("comparison_refresh_status.json")
          cc=[x for x in ex.get("items",[]) if x.get("source")=="coincome"]
          nc=[x for x in ng.get("items",[]) if x.get("source")=="coincome"]
          print("EXISTING_SUMMARY",json.dumps({
            "checkedAt":ex.get("checkedAt"),"count":ex.get("count"),
            "newOfferCount":ex.get("newOfferCount"),"rewardChangeCount":ex.get("rewardChangeCount"),
            "coincomeCount":len(cc)},ensure_ascii=False,sort_keys=True))
          for x in cc: print("EXISTING_COINCOME",json.dumps(x,ensure_ascii=False,sort_keys=True))
          print("NEW_SUMMARY",json.dumps({
            "checkedAt":ng.get("checkedAt"),"count":ng.get("count"),
            "newTodayCount":ng.get("newTodayCount"),"coincomeCount":len(nc)},ensure_ascii=False,sort_keys=True))
          for x in nc[:50]: print("NEW_COINCOME",json.dumps(x,ensure_ascii=False,sort_keys=True))
          print("DAILY_SUMMARY",json.dumps({
            "checkedAt":dr.get("checkedAt"),"listingGroups":dr.get("listingGroups"),
            "reviewedGroups":dr.get("reviewedGroups"),"detailInspectionCalls":dr.get("detailInspectionCalls"),
            "groupLimitReached":dr.get("groupLimitReached"),"detailLimitReached":dr.get("detailLimitReached"),
            "rankingComplete":dr.get("rankingComplete"),"rankingHoldReasons":dr.get("rankingHoldReasons"),
            "topFive":dr.get("topFiveReviewCandidates")},ensure_ascii=False,sort_keys=True))
          ns=(st.get("newGameDiscovery") or {})
          coin=next((x for x in ns.get("sourceResults",[]) if x.get("source")=="coincome"),{})
          print("STATUS_COINCOME",json.dumps(coin,ensure_ascii=False,sort_keys=True))
          print("STATUS_COUNTS",json.dumps({
            "checkedAt":st.get("checkedAt"),"refreshedRows":st.get("refreshedRows"),
            "publishedRewardChanges":st.get("publishedRewardChanges"),
            "existingGameNewOfferCandidateCount":st.get("existingGameNewOfferCandidateCount"),
            "existingRewardChangeCandidateCount":st.get("existingRewardChangeCandidateCount"),
            "existingGameVerifiedRewardCount":st.get("existingGameVerifiedRewardCount"),
            "newGameCandidateQueueCount":st.get("newGameCandidateQueueCount")},ensure_ascii=False,sort_keys=True))
          p=Path("data/published_offers.csv")
          if p.exists():
              rows=list(csv.DictReader(p.open(encoding="utf-8",newline="")))
              print("PUBLISHED_COINCOME",json.dumps([r for r in rows if r.get("site")=="coincome"],ensure_ascii=False,sort_keys=True))
          PY
