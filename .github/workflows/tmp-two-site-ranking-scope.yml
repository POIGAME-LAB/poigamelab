name: Temporary two-site ranking scope audit
on:
  push:
    branches: [audit/two-site-ranking-scope-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest new-game queue
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          aws s3 cp "s3://${R2_BUCKET}/state/latest/new_game_candidate_queue.json.gz" "${tmp}/queue.gz" --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          gzip -dc "${tmp}/queue.gz" > data/new_game_candidate_queue.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure handoff-eligible ranking universe
        run: |
          python - <<'PY'
          import collections,json,sys
          sys.path.insert(0,"scripts")
          import daily_scan_review as daily
          import direct_offer_refresh as direct

          items=json.load(open("data/new_game_candidate_queue.json",encoding="utf-8")).get("items",[])
          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          targets=json.load(open("config/game_targets.json",encoding="utf-8"))["games"]
          families=daily.source_families(sources)
          groups={}
          for item in items:
              if item.get("classification")=="likely_non_game":
                  continue
              name=daily.discovery_name(item.get("titleHint"))
              if not name or direct.context_matches_known_game(name,targets):
                  continue
              sid,url=item.get("source"),item.get("firstPartyCandidateUrl")
              if sid not in sources or not direct.source_host_allowed(url,sources[sid]) or not direct.detail_like(url,sources[sid]):
                  continue
              if not direct.source_participates_in_new_game_ranking(sources[sid]):
                  continue
              ident=direct.offer_identity_key(url,sid)
              if not ident:
                  continue
              key=direct.normalized_text(name)
              groups.setdefault(key,{"game":name,"offers":{}})["offers"].setdefault((families[sid],ident),(sid,url))
          owners={}
          for key,g in groups.items():
              for identity in g["offers"]:
                  owners.setdefault(identity,set()).add(key)
          for g in groups.values():
              g["offers"]={identity:offer for identity,offer in g["offers"].items() if len(owners[identity])==1}
          eligible=[g for g in groups.values() if g["offers"]]
          handoff=[g for g in eligible if len({f for f,_ in g["offers"]})>=2]
          def dist(rows):
              return dict(sorted(collections.Counter(len({f for f,_ in g["offers"]}) for g in rows).items()))
          print("SUMMARY",json.dumps({
              "queueItems":len(items),
              "listingGroups":len(groups),
              "eligibleGroups":len(eligible),
              "handoffEligibleGroups":len(handoff),
              "eligibleOffers":sum(len(g["offers"]) for g in eligible),
              "handoffEligibleOffers":sum(len(g["offers"]) for g in handoff),
              "familyDistributionEligible":dist(eligible),
              "familyDistributionHandoff":dist(handoff),
              "maxOffersInHandoffGroup":max((len(g["offers"]) for g in handoff),default=0),
          },ensure_ascii=False,sort_keys=True))
          ranked=sorted(handoff,key=lambda g:(-len({f for f,_ in g["offers"]}),-len(g["offers"]),g["game"]))
          for g in ranked[:80]:
              print("GROUP",json.dumps({
                  "game":g["game"],
                  "families":len({f for f,_ in g["offers"]}),
                  "offers":len(g["offers"]),
                  "sources":sorted({sid for sid,_ in g["offers"].values()}),
              },ensure_ascii=False,sort_keys=True))
          PY
