name: Temporary scalable ranking live validation

on:
  push:
    branches:
      - fix/scalable-ranking-bounds-20260925
    paths:
      - ".github/workflows/tmp-scalable-ranking-live.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused ranking regressions
        run: |
          python -m pytest -q tests/test_daily_scan_review.py tests/test_daily_scan_review_recall.py

      - name: Restore latest candidate state from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          restore_dir="$(mktemp -d)"
          trap 'rm -rf "${restore_dir}"' EXIT
          aws s3 cp "s3://${R2_BUCKET}/state/latest/" "${restore_dir}/"             --recursive --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          for name in             new_game_candidate_queue.json             new_game_candidate_history.json             existing_game_candidate_queue.json             comparison_candidate_queue.json             comparison_review_queue.json             comparison_refresh_status.json
          do
            if [ -f "${restore_dir}/${name}.gz" ]; then
              gzip -dc "${restore_dir}/${name}.gz" > "data/${name}.r2tmp"
              mv "data/${name}.r2tmp" "data/${name}"
            fi
          done

      - name: Run production-equivalent full ranking scan
        run: python scripts/daily_scan_review.py

      - name: Enforce complete scalable ranking
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("data/daily_scan_review.json").read_text(encoding="utf-8"))
          refresh=json.loads(Path("data/comparison_refresh_status.json").read_text(encoding="utf-8"))
          disc=refresh.get("newGameDiscovery") or {}
          names=report.get("topFiveReviewCandidates") or []
          summary={
              "rankingComplete":report.get("rankingComplete"),
              "rankingHoldReasons":report.get("rankingHoldReasons"),
              "listingGroups":report.get("listingGroups"),
              "rankingEligibleGroups":report.get("rankingEligibleGroups"),
              "reviewedGroups":report.get("reviewedGroups"),
              "detailInspectionCalls":report.get("detailInspectionCalls"),
              "detailLimitReached":report.get("detailLimitReached"),
              "groupLimitReached":report.get("groupLimitReached"),
              "groupSafetyCap":report.get("groupSafetyCap"),
              "listingUpperBoundUnknownGroups":report.get("listingUpperBoundUnknownGroups"),
              "prefilterSkippedGroups":report.get("prefilterSkippedGroups"),
              "topFive":names,
              "kurashiruCandidates":next((
                  row.get("candidateCount")
                  for row in disc.get("sourceResults",[])
                  if row.get("source")=="kurashiru_reward"
              ),None),
          }
          print("SCALABLE_RANKING_LIVE",json.dumps(summary,ensure_ascii=False,sort_keys=True))
          assert report.get("rankingComplete") is True
          assert report.get("groupLimitReached") is False
          assert report.get("detailLimitReached") is False
          assert report.get("detailInspectionCalls",999999) < 768
          assert report.get("rankingEligibleGroups",0) > 320
          assert "【60日間でいずれかのTier4隊員をアンロック】ザ・グランドマフィア" not in names
          assert len(names) == len(set(names))
          PY
