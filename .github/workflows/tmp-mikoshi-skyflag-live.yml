name: Temporary MIKOSHI Skyflag validation

on:
  push:
    branches:
      - feat/mikoshi-skyflag-discovery-20260925
    paths:
      - ".github/workflows/tmp-mikoshi-skyflag-live.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused regressions
        run: |
          python -m py_compile scripts/direct_offer_refresh.py scripts/daily_scan_review.py
          python -m pytest -q tests/test_direct_offer_refresh_v1.py -k "mikoshi"
          python -m pytest -q tests/test_daily_scan_review.py -k "mikoshi"
      - name: Validate current anonymous MIKOSHI feeds and details
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as direct
          import daily_scan_review as daily

          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          source=next(x for x in cfg["sources"] if x["id"]=="mikoshi")
          feeds=[
              ("Android","https://web.mikoshi.jp/v2/skyflag/ads?os=1&limit=1000"),
              ("iOS","https://web.mikoshi.jp/v2/skyflag/ads?os=2&limit=1000"),
          ]
          listing_summary=[]
          all_candidates=[]
          for platform,url in feeds:
              raw,final=direct.fetch_first_party(url,source,timeout=25,max_bytes=8_000_000)
              signature=direct.listing_detail_identity_signature(raw,final,source,limit=5000)
              candidates=direct.discover_new_game_listing_candidates(
                  raw,final,source,[],limit=1000
              )
              listing_summary.append({
                  "platform":platform,
                  "identities":len(signature),
                  "candidates":len(candidates),
                  "sample":[{
                      "name":x.get("titleHint"),
                      "points":x.get("listingRewardPoints"),
                      "platform":x.get("platformHint"),
                      "url":x.get("firstPartyCandidateUrl"),
                  } for x in sorted(
                      candidates,
                      key=lambda x:-(x.get("listingRewardPoints") or 0)
                  )[:8]],
              })
              all_candidates.extend(candidates)

          details=[]
          samples=[
              ("https://web.mikoshi.jp/v2/skyflag/ads/34631",
               ["Heroes vs Crazy Wiggler"],"Android",31060),
              ("https://web.mikoshi.jp/v2/skyflag/ads/34630",
               ["Heroes vs Crazy Wiggler"],"iOS",31060),
              ("https://web.mikoshi.jp/v2/skyflag/ads/33491",
               ["パズル＆カオス"],"Android",17057),
              ("https://web.mikoshi.jp/v2/skyflag/ads/32076",
               ["パズル＆カオス"],"iOS",17057),
          ]
          for url,aliases,expected_platform,expected_points in samples:
              detail=direct.inspect_detail(url,source,aliases)
              ev=detail.get("sourceEvidence") or {}
              details.append({
                  "url":url,
                  "state":ev.get("state"),
                  "reason":ev.get("reason"),
                  "name":ev.get("name"),
                  "platform":ev.get("platform"),
                  "points":ev.get("verifiedCurrentRewardPoints"),
                  "stepTotal":sum(
                      x.get("rewardPoints",0) for x in (ev.get("steps") or [])
                  ),
                  "rate":ev.get("sourcePointRate"),
                  "rankingYen":daily.explicit_yen(ev),
                  "parserVersion":ev.get("parserVersion"),
                  "termsLength":len(ev.get("termsText") or ""),
              })
              assert ev.get("state")=="parsed", (url,ev)
              assert ev.get("platform")==expected_platform, (url,ev)
              assert ev.get("verifiedCurrentRewardPoints")==expected_points, (url,ev)
              assert sum(x["rewardPoints"] for x in ev["steps"])==expected_points
              assert ev.get("sourcePointRate")=="unverified"
              assert "verifiedCurrentRewardYen" not in ev
              assert daily.explicit_yen(ev) is None
              assert ev.get("publicationAuthorized") is False

          union={(x["offerIdentity"]) for x in all_candidates}
          result={
              "listings":listing_summary,
              "unionOfferIdentities":len(union),
              "details":details,
              "rankingParticipation":direct.source_participates_in_new_game_ranking(source),
          }
          print("MIKOSHI_SKYFLAG_LIVE",json.dumps(result,ensure_ascii=False,sort_keys=True))
          assert listing_summary[0]["identities"] >= 200
          assert listing_summary[1]["identities"] >= 200
          assert len(union) >= 400
          assert result["rankingParticipation"] is False
          PY
