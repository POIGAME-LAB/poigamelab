name: Temporary Powl bounded live validation
on:
  push:
    branches: [feat/powl-bounded-ranking-v1-20260924]
    paths:
      - "scripts/direct_offer_refresh.py"
      - "scripts/daily_scan_review.py"
      - "config/point_sources.json"
      - "config/point_value_rates.json"
      - "tests/test_daily_scan_review.py"
      - "tests/test_direct_offer_refresh_v1.py"
      - ".github/workflows/tmp-powl-bounded-live.yml"

permissions:
  contents: read

jobs:
  validate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Focused Powl and ranking tests
        run: |
          python -m pytest -q \
            tests/test_daily_scan_review.py \
            tests/test_direct_offer_refresh_v1.py::test_ranking_health_only_requires_sources_that_can_verify_details \
            tests/test_direct_offer_refresh_v1.py::test_powl_detail_parser_binds_reward_parent_total_and_preserves_fractional_yen \
            tests/test_direct_offer_refresh_v1.py::test_powl_detail_parser_ignores_step_amounts_outside_reward_parent \
            tests/test_direct_offer_refresh_v1.py::test_powl_detail_parser_rejects_conflicting_responsive_totals \
            tests/test_direct_offer_refresh_v1.py::test_powl_offer_identity_rejects_queries \
            tests/test_direct_offer_refresh_v1.py::test_powl_primary_listing_container_excludes_sidebar_reward_links \
            tests/test_direct_offer_refresh_v1.py::test_powl_ranking_config_is_candidate_only_and_publication_disabled
      - name: Restore latest candidate queue
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          aws s3 cp "s3://${R2_BUCKET}/state/latest/new_game_candidate_queue.json.gz" "${tmp}/queue.gz" --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          gzip -dc "${tmp}/queue.gz" > data/new_game_candidate_queue.json
      - name: Live Powl bounded ranking audit
        run: |
          python - <<'PY'
          import json,sys
          from datetime import datetime,timezone
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as direct
          import daily_scan_review as daily

          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          sources={x["id"]:x for x in cfg["sources"]}
          targets=json.load(open("config/game_targets.json",encoding="utf-8"))["games"]
          old=json.load(open("data/new_game_candidate_queue.json",encoding="utf-8")).get("items",[])

          powl=sources["powl"]
          raw,final=direct.fetch_first_party(
              powl["direct_listing_urls"][0],powl,timeout=20,max_bytes=2500000
          )
          live=direct.discover_new_game_listing_candidates(
              raw,final,powl,targets,limit=powl["new_game_discovery_candidate_limit"]
          )
          for item in live:
              item["checkedAt"]=datetime.now(timezone.utc).isoformat()
              item.update(direct.classify_new_game_candidate(item))

          if len(live) < 900:
              raise SystemExit(f"Powl primary listing unexpectedly small: {len(live)}")

          # Prove the strict parser on live first-party game details before the
          # larger branch-and-bound scan.
          parsed=[]
          for item in live:
              if item.get("classification") == "likely_non_game":
                  continue
              try:
                  result=direct.inspect_detail(
                      item["firstPartyCandidateUrl"],powl,
                      [daily.discovery_name(item["titleHint"])],
                      fetcher=direct.fetch_first_party,
                  )
              except Exception:
                  continue
              ev=result.get("sourceEvidence") or {}
              if ev.get("state")=="parsed":
                  parsed.append({
                      "url":item["firstPartyCandidateUrl"],
                      "points":ev.get("displayedRewardPoints"),
                      "yen":ev.get("verifiedCurrentRewardYen"),
                  })
              if len(parsed)>=8:
                  break
          if len(parsed)<5:
              raise SystemExit(f"Too few live Powl details parsed: {len(parsed)}")

          items=[x for x in old if x.get("source")!="powl"] + live
          report=daily.review_scan(
              items=items,
              sources=sources,
              targets=targets,
              rows=[],
              checked_at=datetime.now(timezone.utc).isoformat(),
              fetcher=direct.fetch_first_party,
              max_groups=daily.MAX_GROUPS,
              max_details=daily.MAX_DETAILS,
          )
          powl_details=[
              d for r in report.get("results",[])
              for d in r.get("details",[])
              if d.get("source")=="powl"
          ]
          parsed_powl=sum(
              1 for d in powl_details
              if (d.get("evidence") or {}).get("state")=="parsed"
          )
          summary={
              "powlPrimaryCandidates":len(live),
              "sampleParsedPowlDetails":len(parsed),
              "rankingEligibleGroups":report.get("rankingEligibleGroups"),
              "reviewedGroups":report.get("reviewedGroups"),
              "detailInspectionCalls":report.get("detailInspectionCalls"),
              "maxDetails":daily.MAX_DETAILS,
              "listingUpperBoundUnknownGroups":report.get("listingUpperBoundUnknownGroups"),
              "prefilterSkippedGroups":report.get("prefilterSkippedGroups"),
              "detailLimitReached":report.get("detailLimitReached"),
              "groupLimitReached":report.get("groupLimitReached"),
              "rankingComplete":report.get("rankingComplete"),
              "powlDetailsInspected":len(powl_details),
              "powlDetailsParsed":parsed_powl,
              "topFive":report.get("topFiveReviewCandidates"),
          }
          print("LIVE_SUMMARY",json.dumps(summary,ensure_ascii=False,sort_keys=True))
          if report.get("rankingComplete") is not True:
              raise SystemExit("ranking did not complete")
          if report.get("detailLimitReached"):
              raise SystemExit("768 detail safety cap was reached")
          if report.get("detailInspectionCalls",999999) >= daily.MAX_DETAILS:
              raise SystemExit("detail calls did not remain below cap")
          if report.get("prefilterSkippedGroups",0) <= 0:
              raise SystemExit("listing upper-bound prefilter skipped no groups")
          if parsed_powl <= 0:
              raise SystemExit("no Powl detail participated in live bounded review")
          PY
