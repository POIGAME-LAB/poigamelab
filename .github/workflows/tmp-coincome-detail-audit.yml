name: Temporary COINCOME detail audit
on:
  push:
    branches: [audit/coincome-details-20260924]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Inspect current COINCOME detail structure
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d
          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          src=next(x for x in cfg["sources"] if x["id"]=="coincome")
          for offer_id in ("9663","9587","10261","9974"):
              url=f"https://cimcome.jp/campaigns/details/{offer_id}"
              raw,final=d.fetch_first_party(url,src,timeout=20,max_bytes=1500000)
              text=d.visible_text(raw)
              doc=d.EvidenceHTML(raw).root
              print("===== OFFER",offer_id,"FINAL",final,"BYTES",len(raw.encode("utf-8")),"=====")
              print("HEADINGS")
              for tag in ("h1","h2","h3","h4"):
                  vals=[d.evidence_text(x) for x in doc.find(tag=tag)]
                  print(tag, json.dumps(vals[:30],ensure_ascii=False))
              print("TEXT",text[:7500])
          PY
