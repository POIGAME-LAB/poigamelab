name: Temporary COINCOME detail audit
on:
  push:
    branches: [audit/coincome-details-20260924]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run COINCOME regressions
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile scripts/direct_offer_refresh.py scripts/daily_scan_review.py scripts/structured_publication.py
          python -m pytest -q tests/test_direct_offer_refresh_v1.py -k "coincome"
          python -m pytest -q tests/test_daily_scan_review.py
          python -m pytest -q tests/test_structured_publication.py -k "coincome"
      - name: Audit remaining COINCOME edge cases
        run: |
          python - <<'PY'
          import json,sys,re
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d
          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          src=next(x for x in cfg["sources"] if x["id"]=="coincome")
          cases={
            "9940":["ペタペタペンギン団"],
            "7446":["TikTok"],
            "10134":["タイトーオンラインクレーン"],
          }
          for offer_id,aliases in cases.items():
              url=f"https://cimcome.jp/campaigns/details/{offer_id}"
              raw,final=d.fetch_first_party(url,src,timeout=20,max_bytes=1500000)
              text=d.visible_text(raw)
              doc=d.EvidenceHTML(raw).root
              title=d.evidence_text(d.one(doc.find(cls="sale__title")))
              reward_node=d.one(d.one(doc.find(cls="sale__up")).find(tag="p"))
              direct_reward=" ".join(x.strip() for x in reward_node.children if isinstance(x,str) and x.strip())
              descriptions=doc.find(cls="description")
              description=d.evidence_text(d.one(descriptions)) if descriptions else ""
              steps=[
                  int(x.replace(",",""))
                  for x in re.findall(r"STEP\s*[0-9]+\..*?【([0-9][0-9,]*)\s*円】",description,flags=re.I)
              ]
              start=text.find("適用端末")
              end=text.find("リンクをコピーする",start)
              terms=text[start:end] if start>=0 and end>start else ""
              ev=d.inspect_coincome_offer(raw,url,final,aliases)
              print("EDGE",json.dumps({
                  "id":offer_id,"title":title,"directReward":direct_reward,
                  "steps":steps,"stepSum":sum(steps),"hasDayWithin":bool(re.search(r"[0-9]+\s*日以内",terms)),
                  "termsPrefix":terms[:1800],"parsed":ev,
              },ensure_ascii=False,sort_keys=True))
          PY
