name: Diagnose Moppy and Powl first page

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'diag/moppy-powl-first-page-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Moppy listing alternatives
        run: |
          python - <<'PY'
          import json, sys, re
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import direct_offer_refresh as d

          cfg=json.loads(Path("config/point_sources.json").read_text(encoding="utf-8"))
          sources={x["id"]:x for x in cfg["sources"]}
          m=sources["moppy"]
          tests=[
            ("moppy_ajax", d.paginated_listing_url(m,1)),
            ("moppy_direct", m["direct_listing_urls"][0]),
            ("moppy_start", m["start_url"]),
            ("moppy_page2", "https://pc.moppy.jp/category/list.php?parent_category=4&child_category=52&af_sorter=1&page=2"),
            ("powl", sources["powl"]["direct_listing_urls"][0]),
          ]
          out=[]
          for label,url in tests:
              source=sources["powl"] if label=="powl" else m
              row={"label":label,"url":url}
              try:
                  raw,final=d.fetch_first_party(url,source,timeout=15,max_bytes=1200000)
                  sig=d.listing_detail_identity_signature(raw,final,source,limit=5000)
                  snippets=[]
                  for needle in ("get_list","current_page","objective_category","ajax/category"):
                      i=raw.find(needle)
                      if i>=0:
                          snippets.append(raw[max(0,i-180):i+500].replace("\n"," ")[:700])
                  row.update({
                    "ok":True,
                    "finalUrl":final,
                    "bytes":len(raw.encode("utf-8",errors="ignore")),
                    "identityCount":len(sig),
                    "visibleTextPrefix":d.visible_text(raw)[:220],
                    "ajaxSnippets":snippets[:4],
                  })
              except Exception as exc:
                  row.update({"ok":False,"errorType":type(exc).__name__,"errorCategory":d.summarize_fetch_error(exc)})
              out.append(row)
          print("MOPPY_ALT_DIAG="+json.dumps(out,ensure_ascii=False))
          PY
