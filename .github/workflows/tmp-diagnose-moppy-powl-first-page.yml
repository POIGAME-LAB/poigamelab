name: Diagnose Moppy and Powl first page

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'diag/moppy-powl-first-page-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect corrected Moppy Ajax parameters
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import direct_offer_refresh as d
          cfg=json.loads(Path("config/point_sources.json").read_text(encoding="utf-8"))
          m=next(x for x in cfg["sources"] if x["id"]=="moppy")
          urls=[
            "https://pc.moppy.jp/ajax/category/get_list.php?parent_category=4&child_category=52&objective_category=0&current_page=1&af_sorter=1&exclude_purchased=true",
            "https://pc.moppy.jp/ajax/category/get_list.php?parent_category=4&child_category=52&objective_category=0&current_page=2&af_sorter=1&exclude_purchased=true",
          ]
          out=[]
          for url in urls:
              row={"url":url}
              try:
                  raw,final=d.fetch_first_party(url,m,timeout=15,max_bytes=1200000)
                  sig=d.listing_detail_identity_signature(raw,final,m,limit=5000)
                  row.update({
                    "ok":True,
                    "bytes":len(raw.encode("utf-8",errors="ignore")),
                    "identityCount":len(sig),
                    "visibleTextPrefix":d.visible_text(raw)[:250],
                  })
              except Exception as exc:
                  row.update({"ok":False,"errorType":type(exc).__name__,"errorCategory":d.summarize_fetch_error(exc)})
              out.append(row)
          print("MOPPY_FIXED_PARAM_DIAG="+json.dumps(out,ensure_ascii=False))
          PY
