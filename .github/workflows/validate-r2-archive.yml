name: Validate R2 archive integration

on:
  pull_request:
    paths:
      - ".github/workflows/refresh-verified-offers.yml"
      - ".github/workflows/validate-r2-archive.yml"
      - "scripts/build_public_site.py"
      - "scripts/write_public_monitors.py"
      - "tests/test_r2_archive_workflow.py"
      - "tests/test_r2_public_builder.py"
      - "tests/test_public_monitor_bounds.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax check R2 migration files
        run: |
          python -m py_compile scripts/build_public_site.py
          python -m py_compile scripts/write_public_monitors.py
          python -m py_compile tests/test_r2_archive_workflow.py
          python -m py_compile tests/test_r2_public_builder.py
          python -m py_compile tests/test_public_monitor_bounds.py
      - name: Run focused R2 and public-build tests
        run: |
          python -m pytest -q \
            tests/test_r2_archive_workflow.py \
            tests/test_r2_public_builder.py \
            tests/test_public_monitor_bounds.py
