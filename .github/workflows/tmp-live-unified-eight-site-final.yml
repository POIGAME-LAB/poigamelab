name: Temporary source fetch diagnostics

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - .github/workflows/tmp-live-unified-eight-site-final.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-eight-site-offers-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose COINCOME, Moppy, Amefuri and Powl cap
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          import direct_offer_refresh as direct

          root = Path('.')
          cfg = json.loads((root / 'config/point_sources.json').read_text(encoding='utf-8'))
          targets_cfg = json.loads((root / 'config/game_targets.json').read_text(encoding='utf-8'))
          targets = targets_cfg.get('targets') if isinstance(targets_cfg, dict) else targets_cfg
          targets = targets or []
          sources = {row['id']: row for row in cfg['sources']}

          def fetch_diag(source_id, url, label):
              source = sources[source_id]
              try:
                  raw, final_url = direct.fetch_first_party(url, source)
                  if source_id == 'coincome':
                      path_hits = len(re.findall(r'/campaigns/details/', raw, flags=re.I))
                  elif source_id == 'moppy':
                      path_hits = len(re.findall(r'ad/detail\\.php', raw, flags=re.I))
                  elif source_id == 'amefuri':
                      path_hits = len(re.findall(r'/detail/id/', raw, flags=re.I))
                  else:
                      path_hits = 0
                  discovered = direct.discover_new_game_listing_candidates(
                      raw, final_url, source, targets, limit=2000
                  )
                  print(json.dumps({
                      'source': source_id,
                      'label': label,
                      'ok': True,
                      'finalUrl': final_url,
                      'bytes': len(raw.encode('utf-8', errors='replace')),
                      'detailPathOccurrences': path_hits,
                      'discoveredCandidates': len(discovered),
                  }, ensure_ascii=False))
                  return True
              except Exception as exc:
                  print(json.dumps({
                      'source': source_id,
                      'label': label,
                      'ok': False,
                      'errorCategory': direct.summarize_fetch_error(exc),
                      'exceptionType': type(exc).__name__,
                  }, ensure_ascii=False))
                  return False

          # COINCOME: the configured official app-category listing should not be empty.
          coincome = sources['coincome']
          for i, url in enumerate(coincome.get('direct_listing_urls') or [], 1):
              fetch_diag('coincome', url, f'listing-{i}')

          # Moppy: compare the visible category shell with the reviewed AJAX feed.
          moppy = sources['moppy']
          for i, url in enumerate(moppy.get('direct_listing_urls') or [], 1):
              fetch_diag('moppy', url, f'shell-{i}')
          template = moppy.get('new_game_discovery_page_url_template')
          for page in (1, 2):
              url = template.replace('{page}', str(page))
              fetch_diag('moppy', url, f'ajax-page-{page}')

          # Amefuri: identify the exact page that fails without dumping page content.
          amefuri = sources['amefuri']
          for i, url in enumerate(amefuri.get('direct_listing_urls') or [], 1):
              fetch_diag('amefuri', url, f'page-{i}')

          # Powl: verify that 500 is an explicit configured ceiling, not a fetch error.
          powl = sources['powl']
          print(json.dumps({
              'source': 'powl',
              'configuredCandidateLimit': powl.get('new_game_discovery_candidate_limit'),
              'scope': powl.get('new_game_discovery_scope'),
              'fullCatalogDiscoveryEnabled': powl.get('full_catalog_discovery_enabled'),
          }, ensure_ascii=False))
          PY
