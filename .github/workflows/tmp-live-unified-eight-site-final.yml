name: Temporary COINCOME listing diagnostic

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - .github/workflows/tmp-live-unified-eight-site-final.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify COINCOME listing structure and candidate filtering
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          import daily_scan_review as daily
          import direct_offer_refresh as direct

          sources_cfg = json.loads(Path('config/point_sources.json').read_text(encoding='utf-8'))
          source = next(row for row in sources_cfg['sources'] if row['id'] == 'coincome')
          targets = json.loads(Path('config/game_targets.json').read_text(encoding='utf-8')).get('games') or []
          url = source['direct_listing_urls'][0]

          raw, final_url = daily.resilient_fetch_first_party(
              url, source, base_fetch=direct.fetch_first_party
          )
          detail_occurrences = len(re.findall(r'/campaigns/details/', raw, flags=re.I))
          candidates = direct.discover_new_game_listing_candidates(
              raw, final_url, source, targets, limit=2000
          )

          result = {
              'finalUrl': final_url,
              'bytes': len(raw.encode('utf-8', errors='replace')),
              'detailPathOccurrences': detail_occurrences,
              'knownGameCount': len(targets),
              'unlistedCandidateCount': len(candidates),
          }
          print(json.dumps(result, ensure_ascii=False))
          assert detail_occurrences > 0, result
          PY
