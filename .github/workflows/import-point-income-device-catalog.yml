name: Import Point Income device catalog

on:
  workflow_dispatch:
    inputs:
      point_income_catalog_base64:
        description: gzip+Base64 JSON from residential iPhone/Pythonista capture
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode device payload
        env:
          POINT_INCOME_CATALOG_BASE64: ${{ inputs.point_income_catalog_base64 }}
        run: |
          python - <<'PY'
          import base64
          import gzip
          import io
          import os

          MAX_COMPRESSED_BYTES = 100_000
          MAX_RAW_BYTES = 750_000

          packed = base64.b64decode(
              os.environ["POINT_INCOME_CATALOG_BASE64"],
              validate=True,
          )
          if len(packed) > MAX_COMPRESSED_BYTES:
              raise SystemExit("compressed payload too large")

          if packed[:2] == bytes.fromhex("1f8b"):
              with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
                  raw = stream.read(MAX_RAW_BYTES + 1)
          else:
              raw = packed
          if len(raw) > MAX_RAW_BYTES:
              raise SystemExit("payload too large")
          open("/tmp/point-income-device.json", "wb").write(raw)
          PY

      - name: Validate fail-closed catalog
        run: >-
          python scripts/import-point-income-device-catalog.py
          /tmp/point-income-device.json
          /tmp/point-income-device-accepted.json

      - name: Build existing-game and unmatched-app review queues
        run: >-
          python scripts/postprocess-point-income-device-catalog.py
          /tmp/point-income-device-accepted.json
          games.csv
          /tmp/point-income-existing-game-candidates.json
          /tmp/point-income-unmatched-app-candidates.json

      - name: Persist accepted device catalog to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID}"
          test -n "${AWS_SECRET_ACCESS_KEY}"
          test -n "${R2_ENDPOINT}"
          test -n "${R2_BUCKET}"

          stamp="$(date -u +'%Y/%m/%d/%H%M%SZ')"
          archive_dir="$(mktemp -d)"
          trap 'rm -rf "${archive_dir}"' EXIT

          for path in \
            /tmp/point-income-device-accepted.json \
            /tmp/point-income-existing-game-candidates.json \
            /tmp/point-income-unmatched-app-candidates.json
          do
            base="$(basename "${path}")"
            gzip -9 -c "${path}" > "${archive_dir}/${base}.gz"
          done

          (
            cd "${archive_dir}"
            sha256sum *.gz > SHA256SUMS
          )

          aws s3 cp "${archive_dir}/" \
            "s3://${R2_BUCKET}/device/point-income/daily/${stamp}/" \
            --recursive \
            --endpoint-url "${R2_ENDPOINT}" \
            --only-show-errors

          aws s3 cp "${archive_dir}/" \
            "s3://${R2_BUCKET}/device/point-income/latest/" \
            --recursive \
            --endpoint-url "${R2_ENDPOINT}" \
            --only-show-errors

      - uses: actions/upload-artifact@v4
        with:
          name: point-income-device-catalog
          path: |
            /tmp/point-income-device-accepted.json
            /tmp/point-income-existing-game-candidates.json
            /tmp/point-income-unmatched-app-candidates.json
          retention-days: 3
