name: Temporary Gendama live audit

on:
  push:
    branches:
      - audit/gendama-live-20260924
    paths:
      - ".github/workflows/tmp-gendama-live-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Gendama response encoding and current detail shape
        run: |
          python - <<'PY'
          import json, re
          from urllib.request import Request, urlopen

          url="https://www.gendama.jp/sp/client_detail?cd_client=1583632&rt=s"
          req=Request(url,headers={
              "User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1",
              "Accept":"text/html,application/xhtml+xml",
              "Accept-Language":"ja,en-US;q=0.7,en;q=0.5",
          })
          with urlopen(req,timeout=20) as r:
              data=r.read(1_500_000)
              ctype=r.headers.get("Content-Type")
              hcharset=r.headers.get_content_charset()
              final=r.geturl()
          latin=data[:20000].decode("latin1","replace")
          metas=sorted(set(re.findall(r"(?i)charset\s*=\s*['\"]?([a-z0-9._-]+)",latin)))
          attempts=[]
          for enc in ("utf-8","cp932","shift_jis","euc_jp"):
              text=data.decode(enc,errors="replace")
              visible=re.sub(r"\s+"," ",re.sub(r"(?s)<[^>]+>"," ",text)).strip()
              attempts.append({
                  "encoding":enc,
                  "replacementCount":text.count("\ufffd"),
                  "hasGrandMafia":"ザ・グランドマフィア" in text,
                  "hasRewardCondition":"獲得条件" in text,
                  "hasAttention":"ポイントを獲得するための注意事項" in text,
                  "excerpt":visible[:900],
              })
          decoded=data.decode("cp932",errors="replace")
          visible=re.sub(r"\\s+"," ",re.sub(r"(?is)<(?:script|style|noscript|svg)\\b[^>]*>.*?</(?:script|style|noscript|svg)>"," ",decoded))
          visible=re.sub(r"(?s)<[^>]+>"," ",visible)
          visible=re.sub(r"\\s+"," ",visible).strip()
          snippets={}
          for marker in ("ザ・グランドマフィア","獲得条件","ポイント獲得条件","判定ポイント","ポイントを獲得",
                         "注意事項","却下","対象外","ポイント獲得について","サービスの詳細","円相当","48,750pt","48,750"):
              pos=visible.find(marker)
              if pos>=0:
                  snippets[marker]=visible[max(0,pos-220):pos+900]
          patterns={
              "ptParenYen":re.findall(r"([1-9][0-9,]*)\\s*pt\\s*[（(]\\s*([1-9][0-9,]*)\\s*円相当",visible,re.I)[:10],
              "ptValues":re.findall(r"([1-9][0-9,]*)\\s*pt",visible,re.I)[:20],
              "yenEquivalent":re.findall(r"([1-9][0-9,]*)\\s*円相当",visible)[:20],
          }
          h1s=[re.sub(r"\\s+"," ",re.sub(r"(?s)<[^>]+>"," ",x)).strip()
               for x in re.findall(r"(?is)<h1[^>]*>(.*?)</h1>",decoded)]
          titles=[re.sub(r"\\s+"," ",re.sub(r"(?s)<[^>]+>"," ",x)).strip()
                  for x in re.findall(r"(?is)<title[^>]*>(.*?)</title>",decoded)]
          raw_fragments={}
          for marker in ("48,750pt","ザ・グランドマフィア","Android","iOS"):
              pos=decoded.find(marker)
              if pos>=0:
                  raw_fragments[marker]=decoded[max(0,pos-1200):pos+1800]
          print("GENDAMA_ENCODING_AUDIT",json.dumps({
              "finalUrl":final,"contentType":ctype,"headerCharset":hcharset,
              "metaCharsets":metas,"bytes":len(data),"attempts":attempts,
              "h1s":h1s[:5],"titles":titles[:5],"patterns":patterns,"snippets":snippets,
              "rawFragments":raw_fragments
          },ensure_ascii=False,sort_keys=True))
          PY
      - name: Probe Gendama search-card platform markup
        run: |
          python - <<'PY'
          import json, re
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          url="https://www.gendama.jp/sp/service_search/index/?point_max=&point_min=&search_type=and&w="+quote("ザ・グランドマフィア")
          req=Request(url,headers={
              "User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1",
              "Accept":"text/html,application/xhtml+xml","Accept-Language":"ja,en-US;q=0.7,en;q=0.5",
          })
          with urlopen(req,timeout=20) as r:
              data=r.read(1_500_000)
          text=data.decode("cp932",errors="replace")
          marker="cd_client=1583632"
          pos=text.find(marker)
          fragment=text[max(0,pos-2200):pos+4500] if pos>=0 else ""
          print("GENDAMA_SEARCH_CARD",json.dumps({"found":pos>=0,"fragment":fragment},ensure_ascii=False))
          PY
      - name: Probe Gendama term containers for sample games
        run: |
          python - <<'PY'
          import json, re
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen

          class Collector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack=[]
                  self.nodes=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  node={"tag":tag,"class":attrs.get("class",""),"parts":[]}
                  self.stack.append(node)
              def handle_data(self,data):
                  for node in self.stack:
                      node["parts"].append(data)
              def handle_endtag(self,tag):
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i]["tag"]==tag:
                          node=self.stack.pop(i)
                          if "service_detail_p" in node["class"].split():
                              self.nodes.append(re.sub(r"\s+"," "," ".join(node["parts"])).strip())
                          break

          out=[]
          for offer_id in ("1583632","1399459","1407128"):
              url=f"https://www.gendama.jp/sp/client_detail?cd_client={offer_id}&rt=s"
              req=Request(url,headers={
                  "User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1",
                  "Accept":"text/html,application/xhtml+xml","Accept-Language":"ja,en-US;q=0.7,en;q=0.5",
              })
              with urlopen(req,timeout=20) as r:
                  data=r.read(1_500_000)
              raw=data.decode("cp932",errors="replace")
              p=Collector(); p.feed(raw)
              rows=[]
              for text in p.nodes:
                  markers=[m for m in (
                      "成果受付期限","成果調査受付期限","成果対象外","広告主",
                      "スポンサーサイト","ご注意点","却下","否認","ポイント獲得条件"
                  ) if m in text]
                  rows.append({"length":len(text),"markers":markers,"excerpt":text[:1800]})
              out.append({"offerId":offer_id,"containers":rows})
          print("GENDAMA_TERM_CONTAINERS",json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
      - name: Audit current Gendama search and detail surfaces
        run: |
          python - <<'PY'
          import json, re, sys
          from collections import Counter
          from html.parser import HTMLParser
          from urllib.parse import quote, urljoin, urlparse
          sys.path.insert(0, "scripts")
          import direct_offer_refresh as direct

          source = next(
              x for x in json.load(open("config/point_sources.json", encoding="utf-8"))["sources"]
              if x["id"] == "gendama"
          )

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]
                  self._href=None
                  self._text=[]
              def handle_starttag(self, tag, attrs):
                  if tag=="a":
                      self._href=dict(attrs).get("href")
                      self._text=[]
              def handle_data(self, data):
                  if self._href is not None:
                      self._text.append(data)
              def handle_endtag(self, tag):
                  if tag=="a" and self._href is not None:
                      self.links.append((self._href, re.sub(r"\s+"," "," ".join(self._text)).strip()))
                      self._href=None
                      self._text=[]

          def parse_links(raw, base):
              p=Links(); p.feed(raw)
              out=[]
              for href,text in p.links:
                  if not href:
                      continue
                  out.append((urljoin(base,href),text))
              return out

          summary={"queries":[],"sampleDetails":[]}
          detail_urls={}
          for query in ["ゲーム","アプリ","ザ・グランドマフィア","パズル＆サバイバル","エバーテイル"]:
              url=source["direct_search_url_template"].format(query=quote(query))
              raw,final=direct.fetch_first_party(url,source,timeout=20,max_bytes=2_500_000)
              links=parse_links(raw,final)
              items=[]
              candidate_like=[]
              for u,text in links:
                  path=urlparse(u).path
                  if "/service/item/" in path:
                      oid=direct.offer_identity_key(u,"gendama")
                      if oid and oid not in detail_urls:
                          detail_urls[oid]=(u,text,query)
                      items.append({"identity":oid,"url":u,"text":text[:220]})
                  if ("client_detail" in path or path.startswith("/service/") or
                          any(k in urlparse(u).query for k in ("service_id=", "id=", "sid="))):
                      candidate_like.append({"url":u,"text":text[:240]})
              href_paths=Counter(urlparse(u).path.split("/")[2] if len(urlparse(u).path.split("/"))>2 else urlparse(u).path for u,_ in links)
              pages=[u for u,_ in links if "service_search" in urlparse(u).path and ("page=" in u or "p=" in u)]
              summary["queries"].append({
                  "query":query,
                  "finalUrl":final,
                  "htmlBytes":len(raw.encode("utf-8")),
                  "detailLinks":len(items),
                  "uniqueDetailLinks":len({x["identity"] for x in items if x["identity"]}),
                  "paginationLinks":len(set(pages)),
                  "sampleItems":items[:8],
                  "sampleCandidateLinks":candidate_like[:20],
                  "commonLinkBuckets":href_paths.most_common(8),
              })

          for oid,(url,hint,query) in list(detail_urls.items())[:12]:
              try:
                  raw,final=direct.fetch_first_party(url,source,timeout=20,max_bytes=2_500_000)
                  m=re.search(r"<h1[^>]*>(.*?)</h1>",raw,re.I|re.S)
                  title=direct.visible_text(m.group(0)) if m else hint
                  ev=direct.inspect_gendama_offer(raw,url,final,[title or hint])
                  summary["sampleDetails"].append({
                      "identity":oid,
                      "query":query,
                      "url":url,
                      "title":title[:180] if title else "",
                      "state":ev.get("state"),
                      "reason":ev.get("reason"),
                      "points":ev.get("displayedRewardPoints"),
                      "yen":ev.get("displayedRewardYen"),
                      "platform":ev.get("platform"),
                      "parserVersion":ev.get("parserVersion"),
                  })
              except Exception as exc:
                  summary["sampleDetails"].append({
                      "identity":oid,"query":query,"url":url,
                      "state":"fetch_error","reason":type(exc).__name__
                  })

          print("GENDAMA_LIVE_AUDIT", json.dumps(summary, ensure_ascii=False, sort_keys=True))
          if not any(x["sampleCandidateLinks"] for x in summary["queries"]):
              raise SystemExit("No current Gendama candidate-like links discovered")
          PY
