name: Independent offer audit (read only)
on:
  workflow_dispatch:
  push:
    branches: ["fix/independent-offer-audit-20260923"]
    paths:
      - ".github/workflows/audit-offers-readonly.yml"
permissions:
  contents: read
jobs:
  audit:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify safety and data isolation
        run: python -m pytest -q tests/test_audit_safety.py tests/test_daily_scan_review.py tests/test_point_value_rates.py tests/test_structured_publication_hapitas.py tests/test_structured_publication.py tests/test_daily_scan_review_recall.py tests/test_daily_publication_gate.py tests/test_readonly_audit_runner.py
      - name: Scan in an isolated temporary copy
        run: python scripts/audit_readonly_scan.py audit-results/readonly-scan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-offer-audit
          path: audit-results/readonly-scan.json
          if-no-files-found: error
          retention-days: 7
