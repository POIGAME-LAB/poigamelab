name: Temporary validate unified eight-site foundation

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - ".github/workflows/tmp-run-unified-eight-site-v3.yml"
      - "tests/test_unified_daily_integration.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-eight-site-offers-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Syntax checks
        run: |
          python -m py_compile \
            scripts/direct_offer_refresh.py \
            scripts/daily_scan_review.py \
            scripts/structured_publication.py \
            scripts/unified_offer_snapshot.py \
            tests/test_unified_eight_site_pipeline.py \
            tests/test_unified_daily_integration.py

      - name: Unified foundation and daily integration tests
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -vv \
            tests/test_unified_eight_site_pipeline.py \
            tests/test_unified_daily_integration.py \
            tests/test_structured_publication.py \
            tests/test_daily_scan_review.py \
            tests/test_daily_scan_review_recall.py \
            tests/test_new_game_content_queue.py \
            'tests/test_direct_offer_refresh_v1.py::test_listing_failure_is_retained_with_or_without_known_details[404-True]' \
            'tests/test_direct_offer_refresh_v1.py::test_listing_failure_is_retained_with_or_without_known_details[429-True]' \
            tests/test_direct_offer_refresh_v1.py::test_moppy_first_party_terms_map_appdriver_without_external_fetch \
            2>&1 | tee unified-integration.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-integration-log
          path: unified-integration.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when tests failed
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
