name: Temporary test unified eight-site foundation v3

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - ".github/workflows/tmp-run-unified-eight-site-v3.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-eight-site-offers-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source/config patch
        run: python scripts/tmp_patch_unified_eight_site.py

      - name: Preserve legacy policy compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/direct_offer_refresh.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    unified_daily_sources = \[\n'
              r'        str\(x\)\.strip\(\) for x in \(policy\.get\("unifiedDailySources"\) or \[\]\) if str\(x\)\.strip\(\)\n'
              r'    \]\n'
              r'    if not unified_daily_sources:\n'
              r'        print\("ERROR: unifiedDailySources is empty", file=sys\.stderr\)\n'
              r'        return 2\n'
              r'    unknown_unified = \[x for x in unified_daily_sources if x not in sources\]\n'
              r'    if unknown_unified:\n'
              r'        print\("ERROR: unregistered unified daily sources: " \+ ", "\.join\(unknown_unified\), file=sys\.stderr\)\n'
              r'        return 2\n'
              r'    invalid_unified = \[\n'
              r'        x for x in unified_daily_sources\n'
              r'        if sources\[x\]\.get\("new_game_discovery_enabled"\) is not True\n'
              r'    \]\n'
              r'    if invalid_unified:\n'
              r'        print\("ERROR: unified source is not enabled for the shared discovery crawl: "\n'
              r'              \+ ", "\.join\(invalid_unified\), file=sys\.stderr\)\n'
              r'        return 2\n'
          )
          replacement = '''    unified_sources_declared = "unifiedDailySources" in policy
          unified_daily_sources = [
              str(x).strip() for x in (policy.get("unifiedDailySources") or []) if str(x).strip()
          ]
          if unified_sources_declared and not unified_daily_sources:
              print("ERROR: unifiedDailySources is empty", file=sys.stderr)
              return 2
          if not unified_sources_declared:
              unified_daily_sources = list(comparison_sources)
          unknown_unified = [x for x in unified_daily_sources if x not in sources]
          if unknown_unified:
              print("ERROR: unregistered unified daily sources: " + ", ".join(unknown_unified), file=sys.stderr)
              return 2
          if unified_sources_declared:
              invalid_unified = [
                  x for x in unified_daily_sources
                  if sources[x].get("new_game_discovery_enabled") is not True
              ]
              if invalid_unified:
                  print("ERROR: unified source is not enabled for the shared discovery crawl: "
                        + ", ".join(invalid_unified), file=sys.stderr)
                  return 2
          '''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'unified compatibility block replacements={count}')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Syntax checks
        run: |
          python -m py_compile scripts/direct_offer_refresh.py scripts/daily_scan_review.py scripts/structured_publication.py scripts/unified_offer_snapshot.py tests/test_unified_eight_site_pipeline.py

      - name: Focused regression tests
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -vv \
            tests/test_unified_eight_site_pipeline.py \
            tests/test_structured_publication.py \
            tests/test_daily_scan_review.py \
            tests/test_daily_scan_review_recall.py \
            tests/test_direct_offer_refresh_v1.py \
            tests/test_new_game_content_queue.py 2>&1 | tee pytest-unified.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-pytest-log
          path: pytest-unified.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when pytest failed
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1

      - name: Commit source/config changes only
        run: |
          set -euo pipefail
          git config user.name "poigamelab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/refresh_policy.json scripts/direct_offer_refresh.py scripts/structured_publication.py
          git diff --cached --check
          git commit -m "feat: unify eight-site offer crawl for listed games"
          git push origin HEAD:feat/unified-eight-site-offers-v2
