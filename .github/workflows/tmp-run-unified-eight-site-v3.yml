name: Temporary test unified eight-site foundation v3

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - ".github/workflows/tmp-run-unified-eight-site-v3.yml"
      - "scripts/tmp_fix_unified_compat.py"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-eight-site-offers-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Capture pre-change baseline failures
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_structured_publication.py \
            tests/test_daily_scan_review.py \
            tests/test_daily_scan_review_recall.py \
            tests/test_direct_offer_refresh_v1.py \
            tests/test_new_game_content_queue.py 2>&1 | tee pytest-baseline.log
          exit 0

      - name: Apply source/config patch
        run: python scripts/tmp_patch_unified_eight_site.py

      - name: Preserve legacy policy compatibility
        run: python scripts/tmp_fix_unified_compat.py

      - name: Syntax checks
        run: |
          python -m py_compile scripts/direct_offer_refresh.py scripts/daily_scan_review.py scripts/structured_publication.py scripts/unified_offer_snapshot.py tests/test_unified_eight_site_pipeline.py

      - name: Capture patched regression results
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_unified_eight_site_pipeline.py \
            tests/test_structured_publication.py \
            tests/test_daily_scan_review.py \
            tests/test_daily_scan_review_recall.py \
            tests/test_direct_offer_refresh_v1.py \
            tests/test_new_game_content_queue.py 2>&1 | tee pytest-patched.log
          exit 0

      - name: Reject new regression failures
        run: |
          python - <<'PY'
          from pathlib import Path

          def failures(path):
              result = set()
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if not line.startswith('FAILED '):
                      continue
                  node = line[len('FAILED '):].split(' - ', 1)[0].strip()
                  result.add(node)
              return result

          baseline = failures('pytest-baseline.log')
          patched = failures('pytest-patched.log')
          new_failures = sorted(patched - baseline)
          fixed_failures = sorted(baseline - patched)
          print('baseline failures:', len(baseline))
          print('patched failures:', len(patched))
          print('fixed baseline failures:', len(fixed_failures))
          if fixed_failures:
              for item in fixed_failures:
                  print('FIXED', item)
          if new_failures:
              for item in new_failures:
                  print('NEW FAILURE', item)
              raise SystemExit(1)
          print('No new regression failures.')
          PY

      - name: Upload comparison logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-baseline-and-patched-logs
          path: |
            pytest-baseline.log
            pytest-patched.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit source/config changes only
        run: |
          set -euo pipefail
          git config user.name "poigamelab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/refresh_policy.json scripts/direct_offer_refresh.py scripts/structured_publication.py
          git diff --cached --check
          git commit -m "feat: unify eight-site offer crawl for listed games"
          git push origin HEAD:feat/unified-eight-site-offers-v2
