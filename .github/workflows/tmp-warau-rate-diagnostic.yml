name: Temporary Warau rate diagnostic
on:
  push:
    branches: [feat/powl-bounded-ranking-v1-20260924]
    paths:
      - ".github/workflows/tmp-warau-rate-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect first-party Warau rate page
        run: |
          python - <<'PY'
          import json,re,sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as direct
          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          url="https://www.warau.jp/help/qa/128/"
          raw,final=direct.fetch_first_party(url,sources["warau"])
          text=direct.visible_text(raw)
          matched=bool(re.search(r"原則として\s*1ポイント\s*[=＝]\s*1円",text))
          print(json.dumps({
            "requested":url,
            "final":final,
            "same":final==url,
            "matched":matched,
            "hostAllowed":direct.source_host_allowed(final,sources["warau"]),
            "excerpt":text[text.find("ポイント交換レート"):text.find("ポイント交換レート")+180]
          },ensure_ascii=False))
          PY
