name: Temporary Gendama current-surface validation
# rerun after charset sniff fix

on:
  push:
    branches:
      - feat/gendama-current-surface-v2-20260924
    paths:
      - ".github/workflows/tmp-gendama-current-live.yml"

permissions:
  contents: read

jobs:
  validate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore latest candidate queue
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          aws s3 cp "s3://${R2_BUCKET}/state/latest/new_game_candidate_queue.json.gz" "${tmp}/queue.gz"             --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          gzip -dc "${tmp}/queue.gz" > data/new_game_candidate_queue.json

      - name: Validate live Gendama parser and bounded ranking
        run: |
          python - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          sys.path.insert(0, "scripts")
          import direct_offer_refresh as direct
          import daily_scan_review as daily

          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          sources={x["id"]:x for x in cfg["sources"]}
          targets=json.load(open("config/game_targets.json",encoding="utf-8"))["games"]
          old=json.load(open("data/new_game_candidate_queue.json",encoding="utf-8")).get("items",[])

          now=datetime.now(timezone.utc).isoformat()
          def live_candidates(source_id):
              source=sources[source_id]
              found=[]
              seen=set()
              for url in source.get("direct_listing_urls",[])[:source.get("new_game_discovery_listing_limit",1)]:
                  raw,final=direct.fetch_first_party(url,source,timeout=20,max_bytes=2_500_000)
                  rows=direct.discover_new_game_listing_candidates(
                      raw,final,source,targets,
                      limit=source.get("new_game_discovery_candidate_limit",500)
                  )
                  for item in rows:
                      identity=item.get("offerIdentity")
                      if identity in seen:
                          continue
                      seen.add(identity)
                      item["checkedAt"]=now
                      item.update(direct.classify_new_game_candidate(item))
                      found.append(item)
              return found

          gendama=live_candidates("gendama")
          powl=live_candidates("powl")
          if len(gendama) < 5:
              raise SystemExit(f"Gendama discovery unexpectedly small: {len(gendama)}")
          if len(powl) < 900:
              raise SystemExit(f"Powl discovery unexpectedly small: {len(powl)}")

          exact=[
              ("https://www.gendama.jp/sp/client_detail?cd_client=1583632&rt=s",
               ["ザ・グランドマフィア"],48750,4875),
              ("https://www.gendama.jp/sp/client_detail?cd_client=1399459&rt=s",
               ["パズル＆サバイバル"],20400,2040),
          ]
          parsed=[]
          for url,aliases,points,yen in exact:
              result=direct.inspect_detail(
                  url,sources["gendama"],aliases,fetcher=direct.fetch_first_party
              )
              ev=result.get("sourceEvidence") or {}
              parsed.append({
                  "url":url,"state":ev.get("state"),"reason":ev.get("reason"),
                  "points":ev.get("displayedRewardPoints"),
                  "yen":ev.get("displayedRewardYen"),
                  "platform":ev.get("platform"),
                  "parserVersion":ev.get("parserVersion"),
              })
              if ev.get("state")!="parsed":
                  raise SystemExit(f"Gendama live parser failed: {parsed[-1]}")
              if ev.get("displayedRewardPoints")!=points or ev.get("displayedRewardYen")!=yen:
                  raise SystemExit(f"Gendama reward mismatch: {parsed[-1]}")
              if ev.get("parserVersion")!="gendama-detail-review-v2":
                  raise SystemExit(f"Unexpected Gendama parser version: {parsed[-1]}")

          items=[
              x for x in old
              if x.get("source") not in {"gendama","powl"}
          ] + gendama + powl

          report=daily.review_scan(
              items=items,
              sources=sources,
              targets=targets,
              rows=[],
              checked_at=now,
              fetcher=direct.fetch_first_party,
              max_groups=daily.MAX_GROUPS,
              max_details=daily.MAX_DETAILS,
          )
          gd=[
              d for r in report.get("results",[])
              for d in r.get("details",[])
              if d.get("source")=="gendama"
          ]
          summary={
              "gendamaCandidates":len(gendama),
              "powlCandidates":len(powl),
              "exactGendama":parsed,
              "rankingEligibleGroups":report.get("rankingEligibleGroups"),
              "reviewedGroups":report.get("reviewedGroups"),
              "detailInspectionCalls":report.get("detailInspectionCalls"),
              "maxDetails":daily.MAX_DETAILS,
              "listingUpperBoundUnknownGroups":report.get("listingUpperBoundUnknownGroups"),
              "prefilterSkippedGroups":report.get("prefilterSkippedGroups"),
              "detailLimitReached":report.get("detailLimitReached"),
              "groupLimitReached":report.get("groupLimitReached"),
              "rankingComplete":report.get("rankingComplete"),
              "gendamaDetailsInspected":len(gd),
              "gendamaDetailsParsed":sum(
                  1 for d in gd if (d.get("evidence") or {}).get("state")=="parsed"
              ),
              "topFive":report.get("topFiveReviewCandidates"),
          }
          print("GENDAMA_CURRENT_LIVE",json.dumps(summary,ensure_ascii=False,sort_keys=True))
          if report.get("rankingComplete") is not True:
              raise SystemExit("ranking did not complete")
          if report.get("detailLimitReached") is True:
              raise SystemExit("detail safety cap reached")
          if report.get("detailInspectionCalls",999999) >= daily.MAX_DETAILS:
              raise SystemExit("detail calls did not remain below cap")
          PY
