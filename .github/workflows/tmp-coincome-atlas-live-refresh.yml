name: Temporary COINCOME ATLAS live refresh audit
on:
  push:
    branches: [audit/coincome-atlas-live-refresh-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify live COINCOME ATLAS refresh contract
        run: |
          python - <<'PY'
          import csv,json,sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d
          import structured_publication as p

          url="https://cimcome.jp/campaigns/details/9663"
          with open("config/point_sources.json",encoding="utf-8") as h:
              sources={x["id"]:x for x in json.load(h)["sources"]}
          with open("data/published_offers.csv",encoding="utf-8",newline="") as h:
              rows=list(csv.DictReader(h))
          row=next(r for r in rows if r["game"]=="ATLAS: EARTH" and r["site"]=="coincome")
          raw,final=d.fetch_first_party(url,sources["coincome"],timeout=20,max_bytes=1500000)
          evidence=d.inspect_coincome_offer(raw,url,final,["ATLAS: EARTH","Atlas Earth","ATLAS EARTH"])
          print("EVIDENCE",json.dumps({
              "state":evidence.get("state"),
              "parserVersion":evidence.get("parserVersion"),
              "offerId":evidence.get("offerId"),
              "platform":evidence.get("platform"),
              "displayedRewardYen":evidence.get("displayedRewardYen"),
              "stepTotalYen":evidence.get("stepTotalYen"),
              "termsLength":len(evidence.get("termsText") or ""),
          },ensure_ascii=False,sort_keys=True))
          item={
              "source":"coincome","game":"ATLAS: EARTH","url":url,
              "checkedAt":"2026-09-24T01:40:00+00:00",
              "sourceEvidence":evidence,
          }
          updated,report=p.prepare(
              [row],[item],sources,item["checkedAt"],
              {"enabled":True,"sources":["coincome"]},False
          )
          print("ROW_BEFORE",json.dumps(row,ensure_ascii=False,sort_keys=True))
          print("ROW_AFTER",json.dumps(updated[0],ensure_ascii=False,sort_keys=True))
          print("REPORT",json.dumps(report,ensure_ascii=False,sort_keys=True))
          assert evidence["state"]=="parsed"
          assert evidence["parserVersion"]=="coincome-detail-review-v2"
          assert evidence["offerId"]=="9663"
          assert evidence["platform"]=="iOS"
          assert evidence["displayedRewardYen"]==8620
          assert evidence["stepTotalYen"]==8620
          assert report["heldRows"]==0
          assert report["updatedRows"]==0 or report["updatedRows"]==1
          assert updated[0]["reward"]=="8620"
          assert updated[0]["condition"]==row["condition"]
          assert updated[0]["deadline"]==row["deadline"]
          PY
