name: Temporary patch ranking budget

on:
  push:
    branches:
      - fix/complete-top-five-ranking-budget
    paths:
      - ".github/workflows/tmp-patch-ranking-budget.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-top-five-ranking-budget
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand bounded ranking review and add regression
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('scripts/daily_scan_review.py')
          text = source.read_text(encoding='utf-8')
          old = 'MAX_GROUPS = 30\nMAX_DETAILS = 120'
          new = 'MAX_GROUPS = 120\nMAX_DETAILS = 360'
          if old not in text:
              raise SystemExit('expected ranking budget constants not found')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_daily_scan_review.py')
          t = tests.read_text(encoding='utf-8')
          marker = 'def test_default_budget_handles_more_than_thirty_two_site_groups'
          if marker not in t:
              t += '''\n\ndef test_default_budget_handles_more_than_thirty_two_site_groups(monkeypatch):\n    items = []\n    for i in range(31):\n        for site in ("a", "b"):\n            items.append({\n                "classification": "likely_game",\n                "titleHint": f"Budget Puzzle {i:02d}",\n                "source": site,\n                "firstPartyCandidateUrl": f"https://{site}.example/detail?id={i}",\n            })\n    result = scan(items, monkeypatch)\n    assert daily.MAX_GROUPS == 120\n    assert daily.MAX_DETAILS == 360\n    assert result["twoSiteListingGroups"] == 31\n    assert result["reviewedGroups"] == 31\n    assert result["detailInspectionCalls"] == 62\n    assert result["groupLimitReached"] is False\n    assert result["detailLimitReached"] is False\n    assert result["rankingComplete"] is True\n\n\ndef test_default_budget_covers_observed_210_candidate_surface():\n    # The 2026-09-16 production probe exposed 210 new candidate offer rows.\n    # Even if every two rows formed a distinct two-site game, 105 groups and\n    # 210 detail inspections remain inside the bounded daily review envelope.\n    assert daily.MAX_GROUPS >= 105\n    assert daily.MAX_DETAILS >= 210\n'''
              tests.write_text(t, encoding='utf-8')
          PY

      - name: Run focused tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile scripts/daily_scan_review.py tests/test_daily_scan_review.py
          python -m pytest -q tests/test_daily_scan_review.py tests/test_daily_scan_review_recall.py tests/test_new_game_content_queue.py

      - name: Commit only permanent changes
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-patch-ranking-budget.yml
          git config user.name "poigamelab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/daily_scan_review.py tests/test_daily_scan_review.py
          git add -u .github/workflows/tmp-patch-ranking-budget.yml
          git diff --cached --check
          git commit -m "fix: complete bounded top-five ranking review"
          git push origin HEAD:fix/complete-top-five-ranking-budget
