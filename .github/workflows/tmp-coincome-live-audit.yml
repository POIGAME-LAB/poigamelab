name: Temporary COINCOME live audit
on:
  push:
    branches: [audit/coincome-live-20260924]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run direct-refresh regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile scripts/direct_offer_refresh.py
          python -m pytest -q tests/test_direct_offer_refresh_v1.py -k "coincome_descriptive_target_link_does_not_leak_to_sibling_links or coincome_mobile_shared_grid_does_not_hide_unrelated_descriptive_links or gendama_search_listing_discovers_only_target_service_links"
      - name: Verify COINCOME on GitHub runner
        run: |
          python - <<'PY'
          import importlib.util, json
          spec=importlib.util.spec_from_file_location("d","scripts/direct_offer_refresh.py")
          d=importlib.util.module_from_spec(spec); spec.loader.exec_module(d)
          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          src=next(x for x in cfg["sources"] if x["id"]=="coincome")
          targets=json.load(open("config/game_targets.json",encoding="utf-8"))
          if isinstance(targets,dict): targets=targets.get("targets") or targets.get("games") or []
          url=src["direct_listing_urls"][0]
          for mobile in (True,False):
              s=dict(src); s["mobile"]=mobile
              raw,final=d.fetch_first_party(url,s,timeout=20,max_bytes=1500000)
              detail=[]
              for a in d.EvidenceHTML(raw).root.find(tag="a"):
                  absolute=d.urljoin(final,a.attrs.get("href","")).split("#",1)[0]
                  if d.source_host_allowed(absolute,s) and d.detail_like(absolute,s):
                      detail.append((d.evidence_text(a)[:120],absolute))
              candidates=d.discover_new_game_listing_candidates(raw,final,s,targets,limit=200)
              atlas=d.discover_detail_links(
                  raw,final,s,["ATLAS: EARTH","ATLAS:EARTH"],limit=6
              )
              print("MODE", "mobile" if mobile else "desktop")
              print("DETAIL_LINKS",len(detail))
              print("CANDIDATES",len(candidates))
              print("ATLAS_URLS",atlas)
              for item in candidates[:20]:
                  print("CANDIDATE",item.get("titleHint"),item.get("firstPartyCandidateUrl"))
              if mobile:
                  assert len(detail) >= 10, len(detail)
                  assert len(candidates) >= 1, len(candidates)
                  assert len(atlas) == 1, atlas
                  assert all("ATLAS" not in str(x.get("titleHint","")).upper() for x in candidates), candidates
          PY
