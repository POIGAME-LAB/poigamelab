name: Temporary Amefuri live audit
on:
  push:
    branches: [audit/amefuri-live-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect current Amefuri detail structure
        run: |
          python - <<'PY'
          import json,re,sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d

          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          s=sources["amefuri"]
          for offer_id in ("135997","140497","138814","140783"):
              url=f"https://www.amefri.net/detail/id/{offer_id}"
              raw,final=d.fetch_first_party(url,s,timeout=20,max_bytes=1500000)
              doc=d.EvidenceHTML(raw).root
              text=d.visible_text(raw)
              h1=[d.evidence_text(x) for x in doc.find(tag="h1")]
              h2=[d.evidence_text(x) for x in doc.find(tag="h2")]
              canon=[x.attrs.get("href","") for x in doc.find(tag="link") if "canonical" in x.attrs.get("rel","").split()]
              titles=[d.evidence_text(x) for x in doc.find(tag="title")]
              print("===== OFFER",offer_id,"FINAL",final,"BYTES",len(raw.encode("utf-8")),"=====")
              print("TITLES",json.dumps(titles,ensure_ascii=False))
              print("H1",json.dumps(h1,ensure_ascii=False))
              print("H2",json.dumps(h2[:30],ensure_ascii=False))
              print("CANONICALS",json.dumps(canon,ensure_ascii=False))
              for marker in (
                  "アメフリ経由で登録すると","※下記条件の合計","多段階",
                  "ポイント獲得条件","成果受付期限","成果調査受付期限","お問い合わせ受付期限",
                  "10pt","10 pt","1円","iOS","Android","android","認証済"
              ):
                  pos=[m.start() for m in re.finditer(re.escape(marker),text,re.I)]
                  print("MARKER",marker,"COUNT",len(pos),"POS",pos[:12])
              # Print bounded contexts around title/reward/terms landmarks.
              for marker in (h1[0] if h1 else "", "アメフリ経由で登録すると", "ポイント獲得条件", "成果受付期限"):
                  if not marker: continue
                  p=text.find(marker)
                  if p>=0:
                      print("CONTEXT",json.dumps({"marker":marker,"text":re.sub(r"\s+"," ",text[max(0,p-700):p+5000])},ensure_ascii=False))
          PY
