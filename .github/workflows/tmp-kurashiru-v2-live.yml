name: Temporary Kurashiru Reward v2 live validation

on:
  push:
    branches:
      - feat/kurashiru-reward-ranking-v2-20260924
    paths:
      - ".github/workflows/tmp-kurashiru-v2-live.yml"

permissions:
  contents: read

# retry: condition suffix fix

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused regressions
        run: |
          python -m pytest -q tests/test_direct_offer_refresh_v1.py -k "kurashiru_reward_v2"
          python -m pytest -q tests/test_daily_scan_review.py -k "kurashiru_v2"
      - name: Validate live first-party listing and details
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as direct
          import daily_scan_review as daily

          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          source=next(x for x in cfg["sources"] if x["id"]=="kurashiru_reward")

          listing_rows=[]
          all_candidates=[]
          for page in (1,2,49,50):
              url=source["new_game_discovery_page_url_template"].format(page=page)
              raw,final=direct.fetch_first_party(url,source,timeout=20,max_bytes=2_000_000)
              signature=direct.listing_detail_identity_signature(raw,final,source,limit=5000)
              candidates=direct.discover_new_game_listing_candidates(
                  raw,final,source,[],limit=100
              )
              listing_rows.append({
                  "page":page,"identities":len(signature),"candidates":len(candidates),
                  "sample":[{
                      "title":x.get("titleHint"),
                      "rewardText":x.get("listingRewardText"),
                      "boundYen":daily.listing_reward_upper_bound_yen(x),
                      "url":x.get("firstPartyCandidateUrl"),
                  } for x in candidates[:3]],
              })
              all_candidates.extend(candidates)

          samples=[
              ("https://www.rewards.kurashiru.com/ads/19120",
               ["隠しオブジェクトゲーム：探してみよう（レベル300到達）（iOS）"]),
              ("https://www.rewards.kurashiru.com/ads/19125",["パズル＆カオス"]),
              ("https://www.rewards.kurashiru.com/ads/19108",["タウンシップ"]),
          ]
          details=[]
          for url,aliases in samples:
              parsed=direct.inspect_detail(url,source,aliases)
              ev=parsed.get("sourceEvidence") or {}
              details.append({
                  "url":url,"state":ev.get("state"),"reason":ev.get("reason"),
                  "name":ev.get("name"),"platform":ev.get("platform"),
                  "coins":ev.get("verifiedCurrentRewardCoins"),
                  "yen":ev.get("verifiedCurrentRewardYen"),
                  "rankingYen":daily.explicit_yen(ev),
                  "parserVersion":ev.get("parserVersion"),
                  "termsLength":len(ev.get("termsText") or ""),
              })

          summary={"listings":listing_rows,"details":details}
          print("KURASHIRU_V2_LIVE",json.dumps(summary,ensure_ascii=False,sort_keys=True))
          assert listing_rows[0]["identities"] >= 15
          assert listing_rows[2]["identities"] > 0
          assert listing_rows[3]["identities"] == 0
          assert any(x["boundYen"] is not None for x in listing_rows[0]["sample"])
          assert all(x["state"]=="parsed" for x in details)
          ios=details[0]
          assert ios["platform"]=="iOS"
          assert ios["coins"]==19200
          assert ios["yen"]==192
          assert ios["rankingYen"]==192
          assert all(x["parserVersion"]=="kurashiru-reward-detail-review-v2" for x in details)
          PY
