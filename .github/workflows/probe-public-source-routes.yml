name: Probe public source routes

on:
  pull_request:
    paths:
      - "scripts/probe_public_source_routes.py"
      - "scripts/probe_moppy_category_endpoint.py"
      - ".github/workflows/probe-public-source-routes.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile scripts/probe_public_source_routes.py
          python -m py_compile scripts/probe_moppy_category_endpoint.py
      - name: Probe anonymous public routes
        run: python scripts/probe_public_source_routes.py
      - name: Probe Moppy category AJAX endpoint
        run: python scripts/probe_moppy_category_endpoint.py
