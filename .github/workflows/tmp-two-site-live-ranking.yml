name: Temporary live two-site ranking audit
on:
  push:
    branches: [fix/two-site-ranking-budget-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest new-game queue
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          aws s3 cp "s3://${R2_BUCKET}/state/latest/new_game_candidate_queue.json.gz" "${tmp}/queue.gz" --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          gzip -dc "${tmp}/queue.gz" > data/new_game_candidate_queue.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rank current two-site universe from live first-party detail pages
        run: |
          python - <<'PY'
          import csv,json,sys
          sys.path.insert(0,"scripts")
          import daily_scan_review as daily
          import direct_offer_refresh as direct

          items=json.load(open("data/new_game_candidate_queue.json",encoding="utf-8")).get("items",[])
          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          targets=json.load(open("config/game_targets.json",encoding="utf-8"))["games"]
          rows=list(csv.DictReader(open("data/published_offers.csv",encoding="utf-8",newline="")))

          def fetch(url,source):
              return direct.fetch_first_party(url,source,timeout=20,max_bytes=1500000)

          result=daily.review_scan(
              items=items,sources=sources,targets=targets,rows=rows,
              checked_at="2026-09-24T04:35:00+00:00",fetcher=fetch,
          )
          errors=[]
          for group in result["results"]:
              for detail in group.get("details",[]):
                  if detail.get("error"):
                      errors.append({
                          "game":group["game"],"source":detail.get("source"),
                          "url":detail.get("url"),"error":detail.get("error"),
                      })
          print("SUMMARY",json.dumps({
              "listingGroups":result["listingGroups"],
              "rankingEligibleGroups":result["rankingEligibleGroups"],
              "twoSiteListingGroups":result["twoSiteListingGroups"],
              "singleSiteListingGroups":result["singleSiteListingGroups"],
              "reviewedGroups":result["reviewedGroups"],
              "detailInspectionCalls":result["detailInspectionCalls"],
              "groupLimitReached":result["groupLimitReached"],
              "detailLimitReached":result["detailLimitReached"],
              "rankingComplete":result["rankingComplete"],
              "verifiedCandidates":sum(1 for g in result["results"] if g["candidateEligible"]),
              "detailFetchErrors":len(errors),
              "topFive":result["topFiveReviewCandidates"],
          },ensure_ascii=False,sort_keys=True))
          for game in result["topFiveReviewCandidates"]:
              row=next(g for g in result["results"] if g["game"]==game)
              print("TOP",json.dumps({
                  "game":game,
                  "reward":row["maxObservedRewardYen"],
                  "confirmedSources":row["confirmedSourceCount"],
                  "listingSources":row["listingSourceCount"],
                  "verifiedRewardSources":row["verifiedRewardSourceCount"],
                  "details":[
                    {"source":d.get("source"),"rewardYen":d.get("rewardYen"),
                     "detailConfirmed":d.get("detailConfirmed"),"finalUrl":d.get("finalUrl")}
                    for d in row["details"]
                  ],
              },ensure_ascii=False,sort_keys=True))
          for err in errors[:50]:
              print("FETCH_ERROR",json.dumps(err,ensure_ascii=False,sort_keys=True))
          assert result["groupLimitReached"] is False
          assert result["detailLimitReached"] is False
          PY
