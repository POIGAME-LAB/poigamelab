name: Validate player progress pages

on:
  pull_request:
    paths:
      - "site-guides.js"
      - "progress.html"
      - "puzzles-survival-guide.html"
      - "kingshot-guide.html"
      - "houchishojo-guide.html"
      - "evertale-guide.html"
      - "atlas-earth-guide.html"
      - "data/guide-experiences/**"
      - "scripts/build_public_site.py"
      - "tests/test_player_progress_pages.py"
      - ".github/workflows/validate-player-progress-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-player-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused player progress tests
        run: python -m pytest -q tests/test_player_progress_pages.py tests/test_township_guide_merge.py tests/test_deploy_smoke.py
