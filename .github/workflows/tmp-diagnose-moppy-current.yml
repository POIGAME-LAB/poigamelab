name: Diagnose current Moppy payload

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  moppy:
    if: github.head_ref == 'diag/moppy-current-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test browser-like Moppy AJAX session
        run: |
          set -euo pipefail
          category='https://pc.moppy.jp/category/list.php?parent_category=4&child_category=52&af_sorter=1&page=1'
          ajax='https://pc.moppy.jp/ajax/category/get_list.php?parent_category=4&child_category=52&objective_category=0&current_page=1&af_sorter=1&exclude_purchased=true'
          ua='Mozilla/5.0 (compatible; POIGAMELAB/1.0; +https://poigamelab.com/)'
          curl -fsSL -A "$ua" -c /tmp/moppy.cookies "$category" -o /tmp/moppy-category.html
          curl -fsSL -A "$ua" -b /tmp/moppy.cookies -e "$category" -H 'X-Requested-With: XMLHttpRequest' -H 'Accept: text/html, */*; q=0.01' "$ajax" -o /tmp/moppy-ajax.html
          python - <<'PY'
          from pathlib import Path
          import json,re
          raw=Path('/tmp/moppy-ajax.html').read_text(encoding='utf-8',errors='replace')
          hrefs=re.findall(r'href=["\']([^"\']+)["\']',raw,flags=re.I)
          detail=[h for h in hrefs if 'ad/detail.php' in h]
          print('MOPPY_SESSION_AJAX='+json.dumps({
            'chars':len(raw),
            'hrefCount':len(hrefs),
            'detailHrefCount':len(detail),
            'detailHrefs':detail[:20],
            'rawStart':raw[:700],
          },ensure_ascii=False))
          PY

      - name: Inspect Moppy first discovery page
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import direct_offer_refresh as d
          cfg=json.loads(Path("config/point_sources.json").read_text(encoding="utf-8"))
          source=next(x for x in cfg["sources"] if x["id"]=="moppy")
          urls=[
            d.paginated_listing_url(source,1),
            source["direct_listing_urls"][0],
          ]
          current_ajax="https://pc.moppy.jp/ajax/category/get_list.php?parent_category=4&child_category=52&objective_category=0&current_page=1&af_sorter=1&exclude_purchased=true"
          urls.insert(1,current_ajax)
          labels=["ajax_old","ajax_current","category"]
          for label,url in zip(labels,urls):
              try:
                  raw, final=d.fetch_first_party(url,source)
                  sig=d.listing_detail_identity_signature(raw,final,source,limit=5000)
                  hrefs=re.findall(r'href=["\']([^"\']+)["\']',raw,flags=re.I)
                  detail=[h for h in hrefs if "ad/detail.php" in h][:30]
                  text=d.visible_text(raw)
                  extra={}
                  if label=="category":
                      script_srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',raw,flags=re.I)
                      needles=["get_list","ajax/category","current_page","exclude_purchased","af_sorter","child_category","parent_category"]
                      contexts={}
                      for needle in needles:
                          pos=raw.find(needle)
                          contexts[needle]=raw[max(0,pos-700):pos+1800] if pos>=0 else ""
                      extra={"scriptSrcs":script_srcs[-30:],"contexts":contexts}
                  print("MOPPY_"+label.upper()+"="+json.dumps({
                    "requestedUrl":url,
                    "finalUrl":final,
                    "chars":len(raw),
                    "signatureCount":len(sig),
                    "hrefCount":len(hrefs),
                    "detailHrefCount":len(detail),
                    "detailHrefs":detail,
                    "textStart":text[:700],
                    "rawStart":raw[:700],
                    **extra,
                  },ensure_ascii=False))
              except Exception as exc:
                  print("MOPPY_"+label.upper()+"_ERROR="+type(exc).__name__+":"+str(exc)[:500])
          PY
