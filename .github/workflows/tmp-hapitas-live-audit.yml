name: Temporary Hapitas live audit
on:
  push:
    branches: [audit/hapitas-live-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Inspect Hapitas catalog contexts for published item IDs
        run: |
          python - <<'PY'
          import csv,json,re,sys
          from urllib.parse import urljoin
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d

          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          s=sources["hapitas"]
          listing=s["direct_listing_urls"][0]
          raw,final=d.fetch_first_party(listing,s,timeout=20,max_bytes=3000000)
          doc=d.EvidenceHTML(raw).root
          published=[r for r in csv.DictReader(open("data/published_offers.csv",encoding="utf-8",newline="")) if r["site"]=="hapitas"]
          ids={d.hapitas_offer_id(r["url"]):r for r in published}
          print("LISTING",final,"BYTES",len(raw.encode("utf-8")),"PUBLISHED_IDS",len(ids))
          found=set()
          for a in doc.find(tag="a"):
              href=a.attrs.get("href","")
              absolute=urljoin(final,href)
              try:
                  oid=d.hapitas_offer_id(absolute)
              except ValueError:
                  continue
              if oid not in ids:
                  continue
              found.add(oid)
              parent=a.parent
              contexts=[]
              depth=0
              while parent is not None and depth<4:
                  txt=d.evidence_text(parent)
                  marker=" ".join([parent.tag,parent.attrs.get("id",""),parent.attrs.get("class","")])
                  contexts.append({"depth":depth,"marker":marker,"text":re.sub(r"\s+"," ",txt)[:1200]})
                  parent=parent.parent
                  depth+=1
              print("MATCH",json.dumps({
                  "id":oid,"game":ids[oid]["game"],"storedPlatform":ids[oid]["platform"],
                  "anchor":d.evidence_text(a),"href":absolute,"contexts":contexts,
              },ensure_ascii=False,sort_keys=True))
          print("FOUND",sorted(found))
          print("MISSING",sorted(set(ids)-found))
          PY
