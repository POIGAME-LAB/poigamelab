name: Temporary Hapitas live audit
on:
  push:
    branches: [audit/hapitas-live-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Inspect current Hapitas detail structure
        run: |
          python - <<'PY'
          import json,re,sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d
          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          s=sources["hapitas"]
          for offer_id in ("101445","101355","91316"):
              url=f"https://hapitas.jp/item/detail/itemid/{offer_id}"
              raw,final=d.fetch_first_party(url,s,timeout=20,max_bytes=1500000)
              doc=d.EvidenceHTML(raw).root
              bodies=doc.find(tag="body")
              body=d.evidence_text(bodies[0]) if len(bodies)==1 else d.visible_text(raw)
              print("===== OFFER",offer_id,"FINAL",final,"BYTES",len(raw.encode("utf-8")),"=====")
              print("H1",json.dumps([d.evidence_text(x) for x in doc.find(tag="h1")],ensure_ascii=False))
              print("H2",json.dumps([d.evidence_text(x) for x in doc.find(tag="h2")][:20],ensure_ascii=False))
              print("CONVERSION_MARKERS",json.dumps(re.findall(r".{0,80}1\s*(?:ポイント|pt).{0,80}1\s*円.{0,80}",body,re.I)[:10],ensure_ascii=False))
              for marker in ("ポイント対象条件","ポイント獲得条件","成果受付期限","STEP1","pt獲得"):
                  positions=[m.start() for m in re.finditer(re.escape(marker),body,re.I)]
                  print("MARKER",marker,"COUNT",len(positions),"POS",positions[:10])
              for h in [d.evidence_text(x) for x in doc.find(tag="h1")][:4]:
                  positions=[m.start() for m in re.finditer(re.escape(h),body)]
                  print("TITLE_HITS",json.dumps(h,ensure_ascii=False),positions[:10])
                  for p in positions[:2]:
                      print("TITLE_CONTEXT",re.sub(r"\s+"," ",body[max(0,p-500):p+1800]))
              reward_matches=list(re.finditer(r"[0-9][0-9,]*\s*pt\b",body,re.I))
              print("PT_CONTEXTS")
              for m in reward_matches[:20]:
                  p=m.start()
                  print(re.sub(r"\s+"," ",body[max(0,p-180):p+260]))
          PY
