name: Temporary validate Chobirich live fetch

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - .github/workflows/tmp-validate-chobirich-live.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch current Chobirich published offers once
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          import scripts.direct_offer_refresh as direct

          source_cfg = json.loads(Path('config/point_sources.json').read_text(encoding='utf-8'))
          source = next(x for x in source_cfg['sources'] if x['id'] == 'chobirich')
          cases = [
              ('https://www.chobirich.com/ad_details/1894712', ['Township', 'タウンシップ']),
              ('https://www.chobirich.com/ad_details/1896200', ['きのこ伝説', 'キノコ伝説', 'キノコ伝説：勇者と魔法のランプ']),
              ('https://www.chobirich.com/ad_details/1896275', ['きのこ伝説', 'キノコ伝説', 'キノコ伝説：勇者と魔法のランプ']),
          ]
          results = []
          for url, aliases in cases:
              raw, final = direct.fetch_first_party(url, source)
              evidence = direct.inspect_chobirich_offer(raw, url, final, aliases)
              points = re.findall(r'最大\s*([0-9,]+)\s*ポイント', direct.visible_text(raw))
              yen = re.findall(r'最大\s*([0-9,]+)\s*円相当', direct.visible_text(raw))
              results.append({
                  'url': url,
                  'final': final,
                  'bytes': len(raw.encode('utf-8')),
                  'state': evidence.get('state'),
                  'reason': evidence.get('reason'),
                  'pointTotals': points[:5],
                  'yenTotals': yen[:5],
              })
          print(json.dumps(results, ensure_ascii=False, indent=2))
          assert all(item['bytes'] > 1000 for item in results)
          assert all(item['final'].startswith('https://www.chobirich.com/ad_details/') for item in results)
          PY
