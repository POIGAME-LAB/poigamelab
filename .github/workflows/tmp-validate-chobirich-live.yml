name: Temporary validate Chobirich live fetch

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - .github/workflows/tmp-validate-chobirich-live.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare Chobirich user agents from GitHub runner
        run: |
          python - <<'PY'
          import json
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          url = 'https://www.chobirich.com/ad_details/1894712'
          agents = {
              'iphone': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1',
              'poigamelab-desktop': 'Mozilla/5.0 (compatible; POIGAMELAB/1.0; +https://poigamelab.com/)',
              'chrome-desktop': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          }
          results = []
          for name, ua in agents.items():
              req = Request(url, headers={
                  'User-Agent': ua,
                  'Accept': 'text/html,application/xhtml+xml',
                  'Accept-Language': 'ja,en-US;q=0.7,en;q=0.5',
              })
              try:
                  with urlopen(req, timeout=15) as response:
                      body = response.read(1200000)
                      results.append({'ua': name, 'status': response.status, 'bytes': len(body), 'final': response.geturl()})
              except HTTPError as exc:
                  results.append({'ua': name, 'status': exc.code, 'bytes': 0, 'final': url})
              except URLError:
                  results.append({'ua': name, 'status': 'network_error', 'bytes': 0, 'final': url})
          print(json.dumps(results, ensure_ascii=False, indent=2))
          PY
