name: Temporary Moppy v3 live audit

on:
  push:
    branches:
      - fix/moppy-ranking-current-v3-20260924
    paths:
      - ".github/workflows/tmp-moppy-v3-live.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused Moppy v3 regressions
        run: |
          python -m pytest -q tests/test_direct_offer_refresh_v1.py -k "moppy"
          python -m pytest -q tests/test_daily_scan_review.py -k "moppy_v3"

      - name: Audit Moppy parser after category URL fix
        run: |
          python - <<'PY'
          import json, sys
          from http.cookiejar import CookieJar
          from urllib.request import HTTPCookieProcessor, build_opener
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as direct
          import daily_scan_review as daily

          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          source=next(x for x in cfg["sources"] if x["id"]=="moppy")
          opener=build_opener(HTTPCookieProcessor(CookieJar()),direct.FirstPartyRedirectHandler(source))
          bootstrap=source["listing_session_bootstrap_url"]
          direct.fetch_first_party(bootstrap,source,opener=opener)

          candidates=[]
          seen=set()
          for page in range(1,3):
              url=source["new_game_discovery_page_url_template"].format(page=page)
              raw,final=direct.fetch_first_party(
                  url,source,opener=opener,
                  extra_headers={"Referer":bootstrap,"X-Requested-With":"XMLHttpRequest",
                                 "Accept":"text/html, */*; q=0.01"}
              )
              for item in direct.discover_new_game_listing_candidates(raw,final,source,[],limit=100):
                  key=item.get("offerIdentity")
                  if key and key not in seen:
                      seen.add(key); candidates.append(item)

          rows=[]
          reasons={}
          for item in candidates[:18]:
              url=item["firstPartyCandidateUrl"]
              title=item.get("titleHint") or ""
              game=daily.discovery_name(title)
              try:
                  raw,final=direct.fetch_first_party(url,source,timeout=20,max_bytes=2_000_000)
                  detail=direct.inspect_detail(url,source,[game,title])
                  ev=detail.get("sourceEvidence") or {}
                  reason=ev.get("reason") or "parsed"
                  reasons[reason]=reasons.get(reason,0)+1
                  reward_yen=daily.explicit_yen(ev)
                  rows.append({
                      "game":game,"url":url,"finalUrl":final,
                      "state":ev.get("state"),"reason":ev.get("reason"),
                      "platform":ev.get("platform"),
                      "points":ev.get("displayedRewardPoints"),
                      "yen":ev.get("displayedRewardYen"),
                      "rankingYen":reward_yen,
                      "downstreamTermsRequired":ev.get("downstreamTermsRequired"),
                      "providerCandidates":ev.get("downstreamProviderCandidates") or [],
                      "parserVersion":ev.get("parserVersion"),
                  })
              except Exception as exc:
                  reason="fetch:"+direct.summarize_fetch_error(exc)
                  reasons[reason]=reasons.get(reason,0)+1
                  rows.append({"game":game,"url":url,"state":"fetch_error","reason":reason})

          probe_url="https://pc.moppy.jp/ad/detail.php?s_id=162206&track_ref=category"
          probe_raw,probe_final=direct.fetch_first_party(probe_url,source,timeout=20,max_bytes=2_000_000)
          probe_doc=direct.EvidenceHTML(probe_raw).root
          structural=[]
          for tag in ("div","section","article","p","dl","table"):
              for node in probe_doc.find(tag=tag):
                  value=direct.evidence_text(node)
                  if len(value) < 30 or len(value) > 12000:
                      continue
                  if any(marker in value for marker in (
                      "ポイント獲得条件","▼ポイント獲得条件","■獲得条件",
                      "注意事項","ポイントに関するお問い合わせ"
                  )):
                      structural.append({
                          "tag":tag,
                          "id":node.attrs.get("id",""),
                          "class":node.attrs.get("class",""),
                          "length":len(value),
                          "text":value[:2600],
                      })
          print("MOPPY_STRUCTURE",json.dumps({
              "url":probe_final,"nodes":structural[:40]
          },ensure_ascii=False,sort_keys=True))
          rankable=[
              row for row in rows
              if row.get("state")=="parsed"
              and row.get("platform") in {"iOS","Android"}
              and row.get("rankingYen") is not None
              and row.get("downstreamTermsRequired") is False
          ]
          print("MOPPY_V3_LIVE",json.dumps({
              "candidateCount":len(candidates),
              "reasonCounts":reasons,
              "rankableCount":len(rankable),
              "rankable":rankable[:10],
              "rows":rows,
          },ensure_ascii=False,sort_keys=True))
          if not candidates:
              raise SystemExit("no candidates")
          if not rankable:
              raise SystemExit("no Moppy v3 ranking evidence")
          PY
