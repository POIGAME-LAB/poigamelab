name: Temporary Kurashiru Rewards live audit

on:
  push:
    branches:
      - audit/kurashiru-live-20260924
    paths:
      - ".github/workflows/tmp-kurashiru-live-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore latest candidate queue
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          aws s3 cp "s3://${R2_BUCKET}/state/latest/new_game_candidate_queue.json.gz" "${tmp}/queue.gz" \
            --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          gzip -dc "${tmp}/queue.gz" > data/new_game_candidate_queue.json

      - name: Inspect current first-party ad detail surfaces
        run: |
          python - <<'PY'
          import json,re,sys
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as direct

          source=next(
              x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]
              if x["id"]=="kurashiru_reward"
          )
          category="https://www.rewards.kurashiru.com/categories/3"
          raw,final=direct.fetch_first_party(category,source,timeout=20,max_bytes=3_000_000)

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links=[]; self.current=None
              def handle_starttag(self,tag,attrs):
                  if tag=="a":
                      self.current={"href":dict(attrs).get("href",""),"parts":[]}
              def handle_data(self,data):
                  if self.current is not None:
                      self.current["parts"].append(data)
              def handle_endtag(self,tag):
                  if tag=="a" and self.current is not None:
                      node=self.current; self.current=None
                      self.links.append((node["href"],re.sub(r"\s+"," "," ".join(node["parts"])).strip()))
          p=Links(); p.feed(raw)
          ads=[]
          pages=[]
          for href,text in p.links:
              absolute=urljoin(final,href)
              parsed=urlparse(absolute)
              if re.fullmatch(r"/ads/[0-9]+",parsed.path):
                  ads.append({"url":absolute,"text":text[:500]})
              if parsed.path=="/categories/3" and parsed.query:
                  pages.append(absolute)

          detail_rows=[]
          for item in ads[:6]:
              u=item["url"]
              body,detail_final=direct.fetch_first_party(u,source,timeout=20,max_bytes=3_000_000)
              visible=direct.visible_text(body)
              title_match=re.search(r"(?is)<title[^>]*>(.*?)</title>",body)
              title=direct.visible_text(title_match.group(0)) if title_match else ""
              scripts=[]
              for m in re.finditer(r'(?is)<script[^>]*>(.*?)</script>',body):
                  text=m.group(1)
                  if any(k in text for k in ("cashback_amount","conversion_name","affiliat","stepUp")):
                      scripts.append(text[:7000])
                      if len(scripts)>=4: break
              snippets={}
              for marker in ("コイン","獲得条件","却下","成果","ポイント","注意","利用条件","達成条件"):
                  pos=visible.find(marker)
                  if pos>=0:
                      snippets[marker]=visible[max(0,pos-300):pos+2200]
              detail_rows.append({
                  "url":u,"finalUrl":detail_final,"linkText":item["text"],
                  "htmlBytes":len(body.encode("utf-8")),
                  "title":title[:300],"snippets":snippets,"scriptSamples":scripts,
              })

          print("KURASHIRU_DETAIL_AUDIT",json.dumps({
              "adCountOnPage":len(ads),
              "ads":ads[:25],
              "paginationLinks":pages[:20],
              "details":detail_rows,
          },ensure_ascii=False,sort_keys=True))
          PY
      - name: Measure full-catalog ranking impact
        run: |
          python - <<'PY'
          import json,sys
          from datetime import datetime,timezone
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as direct
          import daily_scan_review as daily

          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          sources={x["id"]:x for x in cfg["sources"]}
          targets=json.load(open("config/game_targets.json",encoding="utf-8"))["games"]
          old=json.load(open("data/new_game_candidate_queue.json",encoding="utf-8")).get("items",[])
          now=datetime.now(timezone.utc).isoformat()

          def classify(items):
              out=[]
              for item in items:
                  item=dict(item)
                  item["checkedAt"]=now
                  item.update(direct.classify_new_game_candidate(item))
                  out.append(item)
              return out

          def live_source(source_id):
              source=sources[source_id]
              out=[]; seen=set()
              urls=(source.get("direct_listing_urls") or [])[:source.get("new_game_discovery_listing_limit",1)]
              for url in urls:
                  raw,final=direct.fetch_first_party(url,source,timeout=20,max_bytes=3_000_000)
                  rows=direct.discover_new_game_listing_candidates(
                      raw,final,source,targets,
                      limit=source.get("new_game_discovery_candidate_limit",1200)
                  )
                  for item in rows:
                      oid=item.get("offerIdentity")
                      if oid in seen: continue
                      seen.add(oid); out.append(item)
              return classify(out)

          kur=dict(sources["kurashiru_reward"])
          kur.update({
              "direct_detail_url_hints":["/ads/"],
              "coverage_detail_review_enabled":True,
              "coverage_detail_review_mode":"candidate_only",
              "new_game_discovery_enabled":True,
              "new_game_discovery_scope":"full_paginated_game_app_category",
              "full_catalog_discovery_enabled":True,
          })
          sources["kurashiru_reward"]=kur
          seen=set(); kur_items=[]; signatures=set(); pages=0; stopped=""
          for page in range(1,61):
              url=f"https://www.rewards.kurashiru.com/categories/3?page={page}"
              raw,final=direct.fetch_first_party(url,kur,timeout=20,max_bytes=3_000_000)
              sig=direct.listing_detail_identity_signature(raw,final,kur,limit=5000)
              pages+=1
              if not sig:
                  stopped="empty"; break
              if sig in signatures:
                  stopped="repeat"; break
              signatures.add(sig)
              rows=direct.discover_new_game_listing_candidates(raw,final,kur,targets,limit=2000)
              for item in rows:
                  oid=item.get("offerIdentity")
                  if oid in seen: continue
                  seen.add(oid); kur_items.append(item)
          kur_items=classify(kur_items)

          powl=live_source("powl")
          gendama=live_source("gendama")
          base=[x for x in old if x.get("source") not in {"powl","gendama","kurashiru_reward"}]
          fresh=base+powl+gendama

          def group_stats(items):
              families=daily.source_families(sources)
              groups={}
              for item in items:
                  if item.get("classification")=="likely_non_game":
                      continue
                  sid=str(item.get("source") or "")
                  if sid not in sources or not direct.source_participates_in_new_game_ranking(sources[sid]):
                      continue
                  url=str(item.get("firstPartyCandidateUrl") or "")
                  identity=str(item.get("offerIdentity") or "")
                  if not url or not identity:
                      continue
                  name=daily.discovery_name(item.get("titleHint"))
                  if not name:
                      continue
                  key=direct.normalized_text(name)
                  bucket=groups.setdefault(key,{"game":name,"offers":{}})
                  bucket["offers"].setdefault((families[sid],identity),(sid,url,item))
              handoff=[]
              for g in groups.values():
                  fams={fam for fam,_ in g["offers"]}
                  if len(fams)>=2:
                      handoff.append(g)
              rates=daily.load_point_rate_registry()
              unknown=0; known=0
              for g in handoff:
                  bounds=[]
                  complete=True
                  for _,_,item in g["offers"].values():
                      b=daily.listing_reward_upper_bound_yen(item,False,rates)
                      if b is None: complete=False
                      else: bounds.append(b)
                  if complete and bounds: known+=1
                  else: unknown+=1
              return {
                  "groups":len(groups),"handoffGroups":len(handoff),
                  "handoffOffers":sum(len(g["offers"]) for g in handoff),
                  "knownBoundGroups":known,"unknownBoundGroups":unknown,
                  "games":sorted(g["game"] for g in handoff),
              }

          before=group_stats(fresh)
          after=group_stats(fresh+kur_items)
          added=sorted(set(after["games"])-set(before["games"]))
          summary={
              "kurashiruPagesAttempted":pages,
              "kurashiruStopReason":stopped,
              "kurashiruCandidates":len(kur_items),
              "powlCandidates":len(powl),
              "gendamaCandidates":len(gendama),
              "before":{k:v for k,v in before.items() if k!="games"},
              "after":{k:v for k,v in after.items() if k!="games"},
              "addedHandoffGroups":len(added),
              "addedGames":added[:80],
              "maxGroups":daily.MAX_GROUPS,
          }
          print("KURASHIRU_RANKING_IMPACT",json.dumps(summary,ensure_ascii=False,sort_keys=True))
          if len(kur_items)<900:
              raise SystemExit(f"Kurashiru catalog unexpectedly small: {len(kur_items)}")
          PY

      - name: Inspect current first-party category surface
        run: |
          python - <<'PY'
          import json,re,sys
          from collections import Counter
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as direct

          source=next(
              x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]
              if x["id"]=="kurashiru_reward"
          )
          url="https://www.rewards.kurashiru.com/categories/3"
          raw,final=direct.fetch_first_party(url,source,timeout=20,max_bytes=3_000_000)

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links=[]; self.stack=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="a":
                      self.stack.append({"href":dict(attrs).get("href",""),"parts":[]})
              def handle_data(self,data):
                  if self.stack:
                      self.stack[-1]["parts"].append(data)
              def handle_endtag(self,tag):
                  if tag=="a" and self.stack:
                      node=self.stack.pop()
                      self.links.append((node["href"],re.sub(r"\s+"," "," ".join(node["parts"])).strip()))
          p=Links(); p.feed(raw)
          links=[]
          for href,text in p.links:
              if not href: continue
              absolute=urljoin(final,href)
              if urlparse(absolute).hostname in {"www.rewards.kurashiru.com","rewards.kurashiru.com"}:
                  links.append((absolute,text))
          paths=Counter(urlparse(u).path for u,_ in links)
          likely=[
              {"url":u,"text":text[:300]}
              for u,text in links
              if any(k in urlparse(u).path.lower() for k in (
                  "campaign","offer","mission","reward","detail","service","app"
              ))
          ]
          visible=direct.visible_text(raw)
          fragments={}
          for marker in ("ゲーム","アプリ","ポイント","コイン","ワーキングヒーロー","エバーテイル","パズル"):
              pos=visible.find(marker)
              if pos>=0:
                  fragments[marker]=visible[max(0,pos-350):pos+1400]

          script_json=[]
          for m in re.finditer(r'(?is)<script[^>]*>(.*?)</script>',raw):
              body=m.group(1)
              if any(token in body for token in ("campaign","offer","mission","reward","カテゴリ")):
                  script_json.append(body[:3000])
                  if len(script_json)>=8: break

          print("KURASHIRU_CATEGORY_AUDIT",json.dumps({
              "finalUrl":final,
              "htmlBytes":len(raw.encode("utf-8")),
              "linkCount":len(links),
              "uniqueLinks":len({u for u,_ in links}),
              "commonPaths":paths.most_common(25),
              "likelyLinks":likely[:40],
              "fragments":fragments,
              "scriptSamples":script_json,
          },ensure_ascii=False,sort_keys=True))
          PY
