name: Temporary Kurashiru Rewards live audit

on:
  push:
    branches:
      - audit/kurashiru-live-20260924
    paths:
      - ".github/workflows/tmp-kurashiru-live-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect current first-party ad detail surfaces
        run: |
          python - <<'PY'
          import json,re,sys
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as direct

          source=next(
              x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]
              if x["id"]=="kurashiru_reward"
          )
          category="https://www.rewards.kurashiru.com/categories/3"
          raw,final=direct.fetch_first_party(category,source,timeout=20,max_bytes=3_000_000)

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links=[]; self.current=None
              def handle_starttag(self,tag,attrs):
                  if tag=="a":
                      self.current={"href":dict(attrs).get("href",""),"parts":[]}
              def handle_data(self,data):
                  if self.current is not None:
                      self.current["parts"].append(data)
              def handle_endtag(self,tag):
                  if tag=="a" and self.current is not None:
                      node=self.current; self.current=None
                      self.links.append((node["href"],re.sub(r"\s+"," "," ".join(node["parts"])).strip()))
          p=Links(); p.feed(raw)
          ads=[]
          pages=[]
          for href,text in p.links:
              absolute=urljoin(final,href)
              parsed=urlparse(absolute)
              if re.fullmatch(r"/ads/[0-9]+",parsed.path):
                  ads.append({"url":absolute,"text":text[:500]})
              if parsed.path=="/categories/3" and parsed.query:
                  pages.append(absolute)

          detail_rows=[]
          for item in ads[:6]:
              u=item["url"]
              body,detail_final=direct.fetch_first_party(u,source,timeout=20,max_bytes=3_000_000)
              visible=direct.visible_text(body)
              title_match=re.search(r"(?is)<title[^>]*>(.*?)</title>",body)
              title=direct.visible_text(title_match.group(0)) if title_match else ""
              scripts=[]
              for m in re.finditer(r'(?is)<script[^>]*>(.*?)</script>',body):
                  text=m.group(1)
                  if any(k in text for k in ("cashback_amount","conversion_name","affiliat","stepUp")):
                      scripts.append(text[:7000])
                      if len(scripts)>=4: break
              snippets={}
              for marker in ("コイン","獲得条件","却下","成果","ポイント","注意","利用条件","達成条件"):
                  pos=visible.find(marker)
                  if pos>=0:
                      snippets[marker]=visible[max(0,pos-300):pos+2200]
              detail_rows.append({
                  "url":u,"finalUrl":detail_final,"linkText":item["text"],
                  "htmlBytes":len(body.encode("utf-8")),
                  "title":title[:300],"snippets":snippets,"scriptSamples":scripts,
              })

          print("KURASHIRU_DETAIL_AUDIT",json.dumps({
              "adCountOnPage":len(ads),
              "ads":ads[:25],
              "paginationLinks":pages[:20],
              "details":detail_rows,
          },ensure_ascii=False,sort_keys=True))
          PY
      - name: Inspect current first-party category surface
        run: |
          python - <<'PY'
          import json,re,sys
          from collections import Counter
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as direct

          source=next(
              x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]
              if x["id"]=="kurashiru_reward"
          )
          url="https://www.rewards.kurashiru.com/categories/3"
          raw,final=direct.fetch_first_party(url,source,timeout=20,max_bytes=3_000_000)

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links=[]; self.stack=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="a":
                      self.stack.append({"href":dict(attrs).get("href",""),"parts":[]})
              def handle_data(self,data):
                  if self.stack:
                      self.stack[-1]["parts"].append(data)
              def handle_endtag(self,tag):
                  if tag=="a" and self.stack:
                      node=self.stack.pop()
                      self.links.append((node["href"],re.sub(r"\s+"," "," ".join(node["parts"])).strip()))
          p=Links(); p.feed(raw)
          links=[]
          for href,text in p.links:
              if not href: continue
              absolute=urljoin(final,href)
              if urlparse(absolute).hostname in {"www.rewards.kurashiru.com","rewards.kurashiru.com"}:
                  links.append((absolute,text))
          paths=Counter(urlparse(u).path for u,_ in links)
          likely=[
              {"url":u,"text":text[:300]}
              for u,text in links
              if any(k in urlparse(u).path.lower() for k in (
                  "campaign","offer","mission","reward","detail","service","app"
              ))
          ]
          visible=direct.visible_text(raw)
          fragments={}
          for marker in ("ゲーム","アプリ","ポイント","コイン","ワーキングヒーロー","エバーテイル","パズル"):
              pos=visible.find(marker)
              if pos>=0:
                  fragments[marker]=visible[max(0,pos-350):pos+1400]

          script_json=[]
          for m in re.finditer(r'(?is)<script[^>]*>(.*?)</script>',raw):
              body=m.group(1)
              if any(token in body for token in ("campaign","offer","mission","reward","カテゴリ")):
                  script_json.append(body[:3000])
                  if len(script_json)>=8: break

          print("KURASHIRU_CATEGORY_AUDIT",json.dumps({
              "finalUrl":final,
              "htmlBytes":len(raw.encode("utf-8")),
              "linkCount":len(links),
              "uniqueLinks":len({u for u,_ in links}),
              "commonPaths":paths.most_common(25),
              "likelyLinks":likely[:40],
              "fragments":fragments,
              "scriptSamples":script_json,
          },ensure_ascii=False,sort_keys=True))
          PY
