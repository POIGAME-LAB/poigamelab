name: Temporary one-site top-five validation

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - .github/workflows/tmp-one-site-top-five.yml

permissions:
  contents: read

jobs:
  validate-and-live:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53c04fe528475f13b8c74fb44ff0c9581670bc5b

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate one-site handoff and duplicate guard offline
        run: |
          python -m py_compile \
            scripts/daily_scan_review.py \
            scripts/write_new_game_content_queue.py \
            scripts/research_new_game_channels.py \
            scripts/research_top_five_offers.py \
            scripts/adopt_verified_games.py
          python -m pytest -q \
            tests/test_daily_scan_review.py \
            tests/test_daily_scan_review_recall.py \
            tests/test_new_game_content_queue.py \
            tests/test_new_game_queue_ranking_gate.py \
            tests/test_research_new_game_channels.py \
            tests/test_research_top_five_offers.py \
            tests/test_phase3_production_adoption_v30.py

      - name: Run one read-only real eight-site scan
        run: python scripts/daily_scan_review.py

      - name: Build one-site top-five handoff
        run: python scripts/write_new_game_content_queue.py

      - name: Diagnose and verify five ranked candidates
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          report=json.loads(Path("data/daily_scan_review.json").read_text(encoding="utf-8"))
          queue=json.loads(Path("data/new_game_content_queue.json").read_text(encoding="utf-8"))
          results=report.get("results") or []

          reason_counts=Counter()
          amount_sources=Counter()
          for row in results:
              for reason in row.get("holdReasons") or []:
                  reason_counts[reason]+=1
              for d in row.get("details") or []:
                  if d.get("rewardYen") is not None:
                      amount_sources[str(d.get("source") or "unknown")]+=1

          rankable=[
              r for r in results
              if r.get("candidateEligible")
              and r.get("maxObservedRewardYen") is not None
              and "detail_budget_reached" not in (r.get("holdReasons") or [])
          ]
          rankable.sort(key=lambda x: (-int(x.get("maxObservedRewardYen") or 0), str(x.get("game") or "")))

          summary={
              "listingGroups": report.get("listingGroups"),
              "candidateListingGroups": report.get("candidateListingGroups"),
              "twoSiteListingGroups": report.get("twoSiteListingGroups"),
              "reviewedGroups": report.get("reviewedGroups"),
              "detailInspectionCalls": report.get("detailInspectionCalls"),
              "groupLimitReached": report.get("groupLimitReached"),
              "detailLimitReached": report.get("detailLimitReached"),
              "sourceScanIncomplete": report.get("sourceScanIncomplete"),
              "incompleteDiscoverySources": report.get("incompleteDiscoverySources"),
              "expectedPartialDiscoverySources": report.get("expectedPartialDiscoverySources"),
              "rankingComplete": report.get("rankingComplete"),
              "rankableCount": len(rankable),
              "queueCount": queue.get("count"),
              "queueHoldReason": queue.get("holdReason"),
              "reasonCounts": dict(reason_counts),
              "amountSources": dict(amount_sources),
              "top15": [
                  {
                      "game": r.get("game"),
                      "maxObservedRewardYen": r.get("maxObservedRewardYen"),
                      "confirmedSourceCount": r.get("confirmedSourceCount"),
                      "yenSources": [
                          d.get("source") for d in (r.get("details") or [])
                          if d.get("rewardYen") is not None
                      ],
                  }
                  for r in rankable[:15]
              ],
          }
          print(json.dumps(summary,ensure_ascii=False))

          assert report.get("groupLimitReached") is False, summary
          assert report.get("detailLimitReached") is False, summary
          assert report.get("sourceScanIncomplete") is False, summary
          assert report.get("incompleteDiscoverySources") == [], summary
          assert report.get("rankingComplete") is True, summary
          assert report.get("expectedPartialDiscoverySources") == ["powl"], summary

          items=queue.get("items") or []
          assert queue.get("phase") == "NEW_GAME_CONTENT_QUEUE_V1"
          assert queue.get("publicationAuthorized") is False
          assert queue.get("holdReason") is None
          assert queue.get("count") == 5, summary
          assert len(items) == 5, summary
          assert [x.get("rank") for x in items] == [1,2,3,4,5], summary
          assert all(int(x.get("confirmedSourceCount") or 0) >= 1 for x in items), summary
          rewards=[int(x.get("maxObservedRewardYen") or 0) for x in items]
          assert rewards == sorted(rewards,reverse=True), summary
          print(json.dumps({
              "result":"PASS",
              "topFive":[
                  {
                      "rank":x.get("rank"),
                      "game":x.get("game"),
                      "maxObservedRewardYen":x.get("maxObservedRewardYen"),
                      "confirmedSourceCount":x.get("confirmedSourceCount"),
                      "pointSiteEvidence":x.get("pointSiteEvidence"),
                  }
                  for x in items
              ],
          },ensure_ascii=False))
          PY
