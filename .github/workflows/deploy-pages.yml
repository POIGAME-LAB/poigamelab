name: Deploy POIGAME LAB to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - "Refresh comparison offers (API-free)"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: poigamelab-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Pre-deploy public-site checks
        run: |
          python -m pytest -q tests/test_deploy_smoke.py tests/test_offer_history.py
          node tests/test_site_data_v24.js
          node tests/test_site_health_v25.js

      - name: Build explicit public artifact
        run: python scripts/build_public_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
