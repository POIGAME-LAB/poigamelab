name: Deploy POIGAME LAB to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - "Refresh comparison offers (API-free)"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: poigamelab-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner and image tools
        run: python -m pip install --disable-pip-version-check pytest pillow

      - name: Pre-deploy public-site checks
        run: |
          python -m pytest -q tests/test_deploy_smoke.py tests/test_offer_history.py tests/test_static_index_fallback.py tests/test_game_card_images.py
          node tests/test_game_card_image_helper.js
          node tests/test_site_data_v24.js
          node tests/test_site_health_v25.js

      - name: Build explicit public artifact
        run: |
          python scripts/build_public_site.py
          python scripts/include_generated_guides.py --artifact _site
          python scripts/generate_index_thumbnails.py --output _site/assets/game-thumbs
          python scripts/patch_compact_index_actions.py
          python scripts/inject_static_index_fallback.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # The Pages artifact is sometimes not yet visible to deploy-pages right after the
      # upload ("No artifacts named github-pages were found"); it failed 5 of 12 runs on
      # 2026-11-24/25. Give it a moment, then retry once with the same artifact.
      - name: Wait for the Pages artifact to become visible
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: first_deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the deploy
        if: steps.first_deploy.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry)
        id: retry_deploy
        if: steps.first_deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Record the deployed page URL
        id: deployment
        run: echo "page_url=${{ steps.first_deploy.outputs.page_url || steps.retry_deploy.outputs.page_url }}" >> "$GITHUB_OUTPUT"
