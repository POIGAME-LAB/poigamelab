name: Validate direct comparison refresh

on:
  pull_request:
    paths:
      - ".github/workflows/refresh-verified-offers.yml"
      - ".github/workflows/research-new-game-content.yml"
      - ".github/workflows/publish-researched-new-games.yml"
      - ".github/workflows/validate-direct-refresh.yml"
      - ".github/workflows/deploy-pages.yml"
      - "config/refresh_policy.json"
      - "config/game_targets.json"
      - "config/point_sources.json"
      - "config/offerwall_providers.json"
      - "config/approved_offer_baselines.json"
      - "data/published_offers.csv"
      - "data/offer_history.csv"
      - "data/warau_baseline_candidates.json"
      - "site-data.js"
      - "site-footer.js"
      - "robots.txt"
      - "*.html"
      - "assets/**"
      - "scripts/direct_offer_refresh.py"
      - "scripts/daily_scan_review.py"
      - "scripts/structured_publication.py"
      - "scripts/write_new_game_content_queue.py"
      - "scripts/validate_daily_publication.py"
      - "scripts/generate_warau_baseline_candidates.py"
      - "scripts/build_public_site.py"
      - "scripts/append_offer_history.py"
      - "scripts/point-income-device-capture.py"
      - "scripts/import-point-income-device-catalog.py"
      - "scripts/postprocess-point-income-device-catalog.py"
      - "scripts/verify-point-income-device-details.py"
      - "scripts/publish-point-income-device-offers.py"
      - "scripts/refresh-point-income-listing-only.py"
      - "scripts/point-income-shortcuts-light.py"
      - ".github/workflows/import-point-income-device-catalog.yml"
      - "tests/test_import_point_income_device_catalog.py"
      - "tests/test_postprocess_point_income_device_catalog.py"
      - "tests/test_point_income_device_workflow.py"
      - "tests/test_point_income_device_detail_verification.py"
      - "tests/test_point_income_listing_only_refresh.py"
      - "tests/test_direct_offer_refresh_v1.py"
      - "tests/test_daily_scan_review.py"
      - "tests/test_daily_scan_review_recall.py"
      - "tests/test_structured_publication.py"
      - "tests/test_new_game_content_queue.py"
      - "tests/test_new_game_research_workflow.py"
      - "tests/test_publish_new_game_workflow.py"
      - "tests/test_daily_publication_gate.py"
      - "tests/test_warau_baseline_candidates.py"
      - "tests/test_public_site_build.py"
      - "tests/test_offer_history.py"
      - "tests/test_phase2_auto_refresh_v23.py"
      - "tests/test_phase2_multigame.py"
      - "tests/test_site_data_v24.js"
      - "tests/test_site_health_v25.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Syntax check
        run: |
          python -m py_compile scripts/direct_offer_refresh.py
          python -m py_compile scripts/daily_scan_review.py
          python -m py_compile scripts/structured_publication.py
          python -m py_compile scripts/write_new_game_content_queue.py
          python -m py_compile scripts/validate_daily_publication.py
          python -m py_compile scripts/generate_warau_baseline_candidates.py
          python -m py_compile scripts/build_public_site.py
          python -m py_compile scripts/append_offer_history.py
          python -m py_compile scripts/point-income-device-capture.py
          python -m py_compile scripts/import-point-income-device-catalog.py
          python -m py_compile scripts/postprocess-point-income-device-catalog.py
          python -m py_compile scripts/verify-point-income-device-details.py
          python -m py_compile scripts/publish-point-income-device-offers.py
          python -m py_compile scripts/refresh-point-income-listing-only.py
          python -m py_compile scripts/point-income-shortcuts-light.py
          python -m py_compile tests/test_import_point_income_device_catalog.py
          python -m py_compile tests/test_postprocess_point_income_device_catalog.py
          python -m py_compile tests/test_point_income_device_workflow.py
          python -m py_compile tests/test_point_income_device_detail_verification.py
          python -m py_compile tests/test_import_point_income_device_catalog.py
          python -m py_compile tests/test_daily_scan_review.py
          python -m py_compile tests/test_daily_scan_review_recall.py
          python -m py_compile tests/test_structured_publication.py
          python -m py_compile tests/test_new_game_content_queue.py
          python -m py_compile tests/test_new_game_research_workflow.py
          python -m py_compile tests/test_publish_new_game_workflow.py
          python -m py_compile tests/test_daily_publication_gate.py

      - name: Point Income device pipeline tests
        run: |
          python -m pytest -q \
            tests/test_import_point_income_device_catalog.py \
            tests/test_postprocess_point_income_device_catalog.py \
            tests/test_point_income_device_workflow.py \
            tests/test_point_income_device_detail_verification.py \
            tests/test_point_income_listing_only_refresh.py

      - name: Current 01:17 pipeline contract tests
        run: |
          python -m pytest -q \
            tests/test_daily_scan_review.py \
            tests/test_daily_scan_review_recall.py \
            tests/test_structured_publication.py \
            tests/test_new_game_content_queue.py \
            tests/test_new_game_research_workflow.py \
            tests/test_publish_new_game_workflow.py \
            tests/test_daily_publication_gate.py \
            tests/test_offer_history.py

      - name: Legacy collector regressions that still describe current behavior
        run: |
          # Keep the large historical suite for parser/security coverage, while
          # excluding assertions that encode superseded schedules, catalog size,
          # artifact allowlists, or the old direct entrypoint. Their replacements
          # are exercised by the current contract suite above and by the exact
          # Pages-artifact rehearsal workflow.
          python -m pytest -q \
            tests/test_direct_offer_refresh_v1.py \
            tests/test_warau_baseline_candidates.py \
            tests/test_public_site_build.py \
            tests/test_phase2_auto_refresh_v23.py \
            tests/test_phase2_multigame.py \
            --deselect=tests/test_direct_offer_refresh_v1.py::test_scheduled_refresh_persists_candidate_queue \
            --deselect=tests/test_direct_offer_refresh_v1.py::test_repository_coverage_discovery_v2_is_candidate_only_and_registers_missing_sources \
            --deselect=tests/test_direct_offer_refresh_v1.py::test_repository_all_discovered_offerwall_domains_have_reviewed_presence_only_providers \
            --deselect=tests/test_direct_offer_refresh_v1.py::test_repository_hapitas_is_scheduled_review_only_with_current_targets \
            --deselect=tests/test_direct_offer_refresh_v1.py::test_warau_paginated_discovery_configuration_and_stop_guards \
            --deselect=tests/test_direct_offer_refresh_v1.py::test_full_catalog_coverage_reuses_all_cached_listing_snapshots \
            --deselect=tests/test_direct_offer_refresh_v1.py::test_refresh_policy_schedule_label_matches_one_am_jst \
            --deselect=tests/test_direct_offer_refresh_v1.py::test_first_party_reward_status_separates_new_verified_and_changed \
            --deselect=tests/test_direct_offer_refresh_v1.py::test_pointtown_detail_parser_rejects_ambiguous_reward_region \
            --deselect=tests/test_public_site_build.py::test_public_site_builder_copies_only_launch_allowlist \
            --deselect=tests/test_public_site_build.py::test_public_artifact_is_self_contained_for_current_managed_games \
            --deselect=tests/test_public_site_build.py::test_current_reviewed_warau_comparison_rows_match_source_evidence \
            --deselect=tests/test_public_site_build.py::test_adsense_code_is_present_on_monetized_pages \
            --deselect=tests/test_public_site_build.py::test_every_catalog_game_has_published_guide_mapping \
            --deselect=tests/test_public_site_build.py::test_ga4_uses_standard_gtag_snippet_once_on_public_pages \
            --deselect=tests/test_public_site_build.py::test_shared_header_and_navigation_are_wired \
            --deselect=tests/test_public_site_build.py::test_approved_catalog_game_art_is_published \
            --deselect=tests/test_phase2_auto_refresh_v23.py::test_scheduled_policy_uses_all_six_standard_comparison_sources \
            --deselect=tests/test_phase2_auto_refresh_v23.py::test_workflow_is_api_free_and_daily \
            --deselect=tests/test_phase2_auto_refresh_v23.py::test_new_game_enrollment_keeps_single_daily_api_free_workflow \
            --deselect=tests/test_phase2_auto_refresh_v23.py::test_v32_games_join_daily_refresh_with_same_schedule

      - name: Frontend data regression tests
        run: |
          node tests/test_site_data_v24.js
          node tests/test_site_health_v25.js
