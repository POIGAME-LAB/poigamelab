name: Validate direct comparison refresh

on:
  pull_request:
    paths:
      - ".github/workflows/refresh-verified-offers.yml"
      - ".github/workflows/validate-direct-refresh.yml"
      - "config/refresh_policy.json"
      - "config/game_targets.json"
      - "config/point_sources.json"
      - "scripts/direct_offer_refresh.py"
      - "tests/test_direct_offer_refresh_v1.py"
      - "tests/test_phase2_auto_refresh_v23.py"
      - "tests/test_phase2_multigame.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Syntax check
        run: |
          python -m py_compile scripts/direct_offer_refresh.py
          python -m py_compile tests/test_direct_offer_refresh_v1.py
          python -m py_compile tests/test_phase2_auto_refresh_v23.py
          python -m py_compile tests/test_phase2_multigame.py

      - name: Targeted regression tests
        run: |
          python -m pytest -q \
            tests/test_direct_offer_refresh_v1.py \
            tests/test_phase2_auto_refresh_v23.py \
            tests/test_phase2_multigame.py

      - name: One-time live first-party smoke check
        run: |
          python scripts/direct_offer_refresh.py
          python - <<'PY'
          import collections, json
          from pathlib import Path
          status=json.loads(Path("data/comparison_refresh_status.json").read_text())
          review=json.loads(Path("data/comparison_review_queue.json").read_text())
          print("apiCalls =", status.get("apiCalls"))
          for g in status.get("games", []):
              print(g["game"], "confirmed", f'{g.get("standardConfirmed",0)}/{g.get("standardTotal",0)}', "ready", g.get("comparisonReady"))
          reasons=collections.Counter(x.get("reason") for x in review.get("items", []))
          print("review reasons =", dict(reasons))
          for item in review.get("items", []):
              if item.get("game") in {"メメントモリ","ワーキングヒーロー","ホワイトアウト・サバイバル"}:
                  safe={k:v for k,v in item.items() if k not in {"error"}}
                  print("review item =", safe)
          PY
