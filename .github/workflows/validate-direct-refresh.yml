name: Validate direct comparison refresh

on:
  pull_request:
    paths:
      - ".github/workflows/refresh-verified-offers.yml"
      - ".github/workflows/validate-direct-refresh.yml"
      - "config/refresh_policy.json"
      - "config/game_targets.json"
      - "config/point_sources.json"
      - "scripts/direct_offer_refresh.py"
      - "tests/test_direct_offer_refresh_v1.py"
      - "tests/test_phase2_auto_refresh_v23.py"
      - "tests/test_phase2_multigame.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Syntax check
        run: |
          python -m py_compile scripts/direct_offer_refresh.py
          python -m py_compile tests/test_direct_offer_refresh_v1.py
          python -m py_compile tests/test_phase2_auto_refresh_v23.py
          python -m py_compile tests/test_phase2_multigame.py

      - name: Targeted regression tests
        run: |
          python -m pytest -q \
            tests/test_direct_offer_refresh_v1.py \
            tests/test_phase2_auto_refresh_v23.py \
            tests/test_phase2_multigame.py
