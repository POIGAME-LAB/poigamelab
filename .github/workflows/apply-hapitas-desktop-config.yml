name: Apply Hapitas desktop discovery config

on:
  push:
    branches:
      - fix/hapitas-desktop-discovery
    paths:
      - "scripts/apply_hapitas_desktop_config.py"
      - ".github/workflows/apply-hapitas-desktop-config.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hapitas-desktop-discovery
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed runtime config
        run: python scripts/apply_hapitas_desktop_config.py
      - name: Commit generated config change
        run: |
          set -euo pipefail
          git config user.name "poigamelab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/point_sources.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: use desktop UA for Hapitas discovery"
          git push
