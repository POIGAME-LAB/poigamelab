name: Temporary MIKOSHI live audit

on:
  push:
    branches:
      - audit/mikoshi-live-20260925
    paths:
      - ".github/workflows/tmp-mikoshi-live.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect MIKOSHI public page and bundles
        run: |
          python - <<'PY'
          import json,re
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          from urllib.request import Request,urlopen

          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1"
          urls=[
              "https://web.mikoshi.jp/shopping/suggest",
              "https://web.mikoshi.jp/",
              "https://mikoshi.jp/",
          ]
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.scripts=[]; self._href=None; self._txt=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="a":
                      self._href=a.get("href"); self._txt=[]
                  elif tag=="script" and a.get("src"):
                      self.scripts.append(a.get("src"))
              def handle_data(self,data):
                  if self._href is not None:self._txt.append(data)
              def handle_endtag(self,tag):
                  if tag=="a" and self._href is not None:
                      self.links.append((self._href,re.sub(r"\s+"," "," ".join(self._txt)).strip()))
                      self._href=None; self._txt=[]

          out={"pages":[],"bundleHints":[]}
          script_urls=[]
          for url in urls:
              try:
                  req=Request(url,headers={"User-Agent":UA,"Accept-Language":"ja,en-US;q=0.8,en;q=0.5"})
                  with urlopen(req,timeout=20) as r:
                      data=r.read(2_500_000); final=r.geturl(); ctype=r.headers.get("Content-Type")
                  raw=data.decode("utf-8","replace")
                  p=P(); p.feed(raw)
                  script_urls += [urljoin(final,s) for s in p.scripts]
                  visible=re.sub(r"(?is)<(?:script|style|noscript|svg)\b[^>]*>.*?</(?:script|style|noscript|svg)>"," ",raw)
                  visible=re.sub(r"(?s)<[^>]+>"," ",visible)
                  visible=re.sub(r"\s+"," ",unescape(visible)).strip()
                  js_hints=sorted(set(re.findall(r'(?:https?://[^"\'<> ]+|/[A-Za-z0-9_./?=&%-]{3,})',raw)))
                  out["pages"].append({
                      "url":url,"final":final,"bytes":len(data),"contentType":ctype,
                      "title":(re.findall(r"(?is)<title[^>]*>(.*?)</title>",raw) or [""])[0][:250],
                      "scripts":[urljoin(final,s) for s in p.scripts[:50]],
                      "links":[{"url":urljoin(final,h),"text":t[:160]} for h,t in p.links[:100]],
                      "keywords":{k:(k in visible) for k in ["ゲーム","アプリ","ポイント","案件","ショッピング","おすすめ"]},
                      "visibleExcerpt":visible[:2400],
                      "htmlHints":[x for x in js_hints if any(k in x.lower() for k in ("api","offer","game","app","campaign","reward","suggest","shopping"))][:120],
                  })
              except Exception as exc:
                  out["pages"].append({"url":url,"error":type(exc).__name__+":"+str(exc)[:200]})

          seen=set()
          for su in script_urls:
              if su in seen or len(out["bundleHints"])>=20: continue
              seen.add(su)
              host=(urlparse(su).hostname or "").lower()
              if not (host.endswith("mikoshi.jp") or host.endswith("cloudfront.net")):
                  continue
              try:
                  req=Request(su,headers={"User-Agent":UA})
                  with urlopen(req,timeout=20) as r:
                      data=r.read(3_000_000)
                  raw=data.decode("utf-8","replace")
                  endpoints=sorted(set(re.findall(r'https?://[^"\' ]+|/(?:api|v[0-9]+|graphql|shopping|games?|apps?|offers?|campaigns?|rewards?)[A-Za-z0-9_./?=&%:-]*',raw,re.I)))
                  hits=[x for x in endpoints if any(k in x.lower() for k in ("api","game","app","offer","campaign","reward","shopping","suggest"))]
                  out["bundleHints"].append({"url":su,"bytes":len(data),"endpoints":hits[:120]})
              except Exception as exc:
                  out["bundleHints"].append({"url":su,"error":type(exc).__name__+":"+str(exc)[:160]})

          # Inspect known dynamically imported app bundles discovered from main.
          secondary=[
              "https://web.mikoshi.jp/assets/Games-fae3ee75.js",
              "https://web.mikoshi.jp/assets/OfferDetail-a56cc006.js",
              "https://web.mikoshi.jp/assets/GameCard-ae15a47c.js",
              "https://web.mikoshi.jp/assets/ShoppingDetail-393528bb.js",
          ]
          sec=[]
          for su in secondary:
              try:
                  req=Request(su,headers={"User-Agent":UA})
                  with urlopen(req,timeout=20) as r:
                      raw=r.read(3_000_000).decode("utf-8","replace")
                  strings=sorted(set(re.findall(r'["\\\']([^"\\\']{3,260})["\\\']',raw)))
                  interesting=[
                      x for x in strings
                      if any(k in x.lower() for k in (
                          "http","api","graphql","game","offer","reward","campaign",
                          "mission","point","shopping","suggest","recommend","category"
                      ))
                  ]
                  patterns={
                      "fetch":re.findall(r'fetch\\(([^)]{1,240})\\)',raw)[:40],
                      "axios":re.findall(r'(?:axios|baseURL|url)[:=]([^,;}]{1,240})',raw,re.I)[:80],
                  }
                  sec.append({"url":su,"bytes":len(raw),"interestingStrings":interesting[:220],"patterns":patterns})
              except Exception as exc:
                  sec.append({"url":su,"error":type(exc).__name__+":"+str(exc)[:160]})
          out["secondaryBundles"]=sec
          print("MIKOSHI_AUDIT",json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
