name: Temporary MIKOSHI live audit

on:
  push:
    branches:
      - audit/mikoshi-live-20260925
    paths:
      - ".github/workflows/tmp-mikoshi-live.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect MIKOSHI public page and bundles
        run: |
          python - <<'PY'
          import json,re
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          from urllib.request import Request,urlopen

          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1"
          urls=[
              "https://web.mikoshi.jp/shopping/suggest",
              "https://web.mikoshi.jp/",
              "https://mikoshi.jp/",
          ]
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.scripts=[]; self._href=None; self._txt=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="a":
                      self._href=a.get("href"); self._txt=[]
                  elif tag=="script" and a.get("src"):
                      self.scripts.append(a.get("src"))
              def handle_data(self,data):
                  if self._href is not None:self._txt.append(data)
              def handle_endtag(self,tag):
                  if tag=="a" and self._href is not None:
                      self.links.append((self._href,re.sub(r"\s+"," "," ".join(self._txt)).strip()))
                      self._href=None; self._txt=[]

          out={"pages":[],"bundleHints":[]}
          script_urls=[]
          for url in urls:
              try:
                  req=Request(url,headers={"User-Agent":UA,"Accept-Language":"ja,en-US;q=0.8,en;q=0.5"})
                  with urlopen(req,timeout=20) as r:
                      data=r.read(2_500_000); final=r.geturl(); ctype=r.headers.get("Content-Type")
                  raw=data.decode("utf-8","replace")
                  p=P(); p.feed(raw)
                  script_urls += [urljoin(final,s) for s in p.scripts]
                  visible=re.sub(r"(?is)<(?:script|style|noscript|svg)\b[^>]*>.*?</(?:script|style|noscript|svg)>"," ",raw)
                  visible=re.sub(r"(?s)<[^>]+>"," ",visible)
                  visible=re.sub(r"\s+"," ",unescape(visible)).strip()
                  js_hints=sorted(set(re.findall(r'(?:https?://[^"\'<> ]+|/[A-Za-z0-9_./?=&%-]{3,})',raw)))
                  out["pages"].append({
                      "url":url,"final":final,"bytes":len(data),"contentType":ctype,
                      "title":(re.findall(r"(?is)<title[^>]*>(.*?)</title>",raw) or [""])[0][:250],
                      "scripts":[urljoin(final,s) for s in p.scripts[:50]],
                      "links":[{"url":urljoin(final,h),"text":t[:160]} for h,t in p.links[:100]],
                      "keywords":{k:(k in visible) for k in ["ゲーム","アプリ","ポイント","案件","ショッピング","おすすめ"]},
                      "visibleExcerpt":visible[:2400],
                      "htmlHints":[x for x in js_hints if any(k in x.lower() for k in ("api","offer","game","app","campaign","reward","suggest","shopping"))][:120],
                  })
              except Exception as exc:
                  out["pages"].append({"url":url,"error":type(exc).__name__+":"+str(exc)[:200]})

          seen=set()
          for su in script_urls:
              if su in seen or len(out["bundleHints"])>=20: continue
              seen.add(su)
              host=(urlparse(su).hostname or "").lower()
              if not (host.endswith("mikoshi.jp") or host.endswith("cloudfront.net")):
                  continue
              try:
                  req=Request(su,headers={"User-Agent":UA})
                  with urlopen(req,timeout=20) as r:
                      data=r.read(3_000_000)
                  raw=data.decode("utf-8","replace")
                  endpoints=sorted(set(re.findall(r'https?://[^"\' ]+|/(?:api|v[0-9]+|graphql|shopping|games?|apps?|offers?|campaigns?|rewards?)[A-Za-z0-9_./?=&%:-]*',raw,re.I)))
                  hits=[x for x in endpoints if any(k in x.lower() for k in ("api","game","app","offer","campaign","reward","shopping","suggest"))]
                  out["bundleHints"].append({"url":su,"bytes":len(data),"endpoints":hits[:120]})
              except Exception as exc:
                  out["bundleHints"].append({"url":su,"error":type(exc).__name__+":"+str(exc)[:160]})

          # Inspect known dynamically imported app bundles discovered from main.
          secondary=[
              "https://web.mikoshi.jp/assets/Games-fae3ee75.js",
              "https://web.mikoshi.jp/assets/OfferDetail-a56cc006.js",
              "https://web.mikoshi.jp/assets/GameCard-ae15a47c.js",
              "https://web.mikoshi.jp/assets/ShoppingDetail-393528bb.js",
          ]
          sec=[]
          for su in secondary:
              try:
                  req=Request(su,headers={"User-Agent":UA})
                  with urlopen(req,timeout=20) as r:
                      raw=r.read(3_000_000).decode("utf-8","replace")
                  strings=sorted(set(re.findall(r'["\\\']([^"\\\']{3,260})["\\\']',raw)))
                  interesting=[
                      x for x in strings
                      if any(k in x.lower() for k in (
                          "http","api","graphql","game","offer","reward","campaign",
                          "mission","point","shopping","suggest","recommend","category"
                      ))
                  ]
                  patterns={
                      "fetch":re.findall(r'fetch\\(([^)]{1,240})\\)',raw)[:40],
                      "axios":re.findall(r'(?:axios|baseURL|url)[:=]([^,;}]{1,240})',raw,re.I)[:80],
                  }
                  sec.append({"url":su,"bytes":len(raw),"interestingStrings":interesting[:220],"patterns":patterns})
              except Exception as exc:
                  sec.append({"url":su,"error":type(exc).__name__+":"+str(exc)[:160]})
          out["secondaryBundles"]=sec
          deps=[
              "https://web.mikoshi.jp/assets/http-common-6469cf1c.js",
              "https://web.mikoshi.jp/assets/SkyflagApiService-9fc7a2bd.js",
          ]
          depout=[]
          for su in deps:
              try:
                  req=Request(su,headers={"User-Agent":UA})
                  with urlopen(req,timeout=20) as r:
                      raw=r.read(3_000_000).decode("utf-8","replace")
                  strings=sorted(set(re.findall(r'["\\\']([^"\\\']{2,500})["\\\']',raw)))
                  depout.append({
                      "url":su,"bytes":len(raw),
                      "interestingStrings":[x for x in strings if any(k in x.lower() for k in (
                          "http","api","baseurl","game","offer","ad","point","reward","skyflag","shopping"
                      ))][:300],
                      "rawExcerpt":raw[:12000],
                  })
              except Exception as exc:
                  depout.append({"url":su,"error":type(exc).__name__+":"+str(exc)[:180]})
          out["dependencyBundles"]=depout
          api_urls=[
              "https://web.mikoshi.jp/v2/skyflag/suggest?limit=100",
              "https://web.mikoshi.jp/v2/skyflag/ads?os=1&limit=100",
              "https://web.mikoshi.jp/v2/skyflag/ads?os=2&limit=100",
          ]
          apiout=[]
          for au in api_urls:
              try:
                  req=Request(au,headers={
                      "User-Agent":UA,
                      "Accept":"application/json, text/plain, */*",
                      "Referer":"https://web.mikoshi.jp/",
                  })
                  with urlopen(req,timeout=20) as r:
                      data=r.read(4_000_000); final=r.geturl(); ctype=r.headers.get("Content-Type")
                  textdata=data.decode("utf-8","replace")
                  try:
                      parsed=json.loads(textdata)
                  except Exception:
                      parsed=None
                  summary={"url":au,"final":final,"bytes":len(data),"contentType":ctype}
                  if isinstance(parsed,dict):
                      summary["keys"]=sorted(parsed.keys())
                      for key,val in parsed.items():
                          if isinstance(val,list):
                              summary["listKey"]=key
                              summary["count"]=len(val)
                              summary["sample"]=val[:5]
                              break
                      if "data" in parsed and isinstance(parsed["data"],dict):
                          summary["dataKeys"]=sorted(parsed["data"].keys())
                          for key,val in parsed["data"].items():
                              if isinstance(val,list):
                                  summary["dataListKey"]=key
                                  summary["count"]=len(val)
                                  summary["sample"]=val[:5]
                                  break
                  elif isinstance(parsed,list):
                      summary["count"]=len(parsed); summary["sample"]=parsed[:5]
                  else:
                      summary["excerpt"]=textdata[:1800]
                  apiout.append(summary)
              except Exception as exc:
                  code=getattr(exc,"code",None)
                  apiout.append({"url":au,"error":type(exc).__name__+":"+str(exc)[:180],"code":code})
          out["apiProbes"]=apiout

          # Print the small Games bundle for service discovery.
          try:
              req=Request("https://web.mikoshi.jp/assets/Games-fae3ee75.js",headers={"User-Agent":UA})
              with urlopen(req,timeout=20) as r:
                  games_raw=r.read(100000).decode("utf-8","replace")
              out["gamesBundleRaw"]=games_raw[:12000]
          except Exception as exc:
              out["gamesBundleRaw"]="ERROR:"+type(exc).__name__
          for name in ("GameCard-ae15a47c.js","OfferDetail-a56cc006.js"):
              try:
                  su="https://web.mikoshi.jp/assets/"+name
                  req=Request(su,headers={"User-Agent":UA})
                  with urlopen(req,timeout=20) as r:
                      raw=r.read(200000).decode("utf-8","replace")
                  out[name+"Raw"]=raw[:30000]
              except Exception as exc:
                  out[name+"Raw"]="ERROR:"+type(exc).__name__
          extra_urls=[
              "https://web.mikoshi.jp/v2/games/list?uid=",
              "https://web.mikoshi.jp/v2/games/estlier/list?uid=",
              "https://web.mikoshi.jp/v2/skyflag/ads?os=1&limit=1000",
              "https://web.mikoshi.jp/v2/skyflag/ads?os=2&limit=1000",
          ]
          extra=[]
          for au in extra_urls:
              try:
                  req=Request(au,headers={
                      "User-Agent":UA,
                      "Accept":"application/json, text/plain, */*",
                      "Referer":"https://web.mikoshi.jp/",
                  })
                  with urlopen(req,timeout=30) as r:
                      data=r.read(8_000_000); final=r.geturl(); ctype=r.headers.get("Content-Type")
                  body=data.decode("utf-8","replace")
                  parsed=json.loads(body)
                  summary={"url":au,"final":final,"bytes":len(data),"contentType":ctype}
                  if isinstance(parsed,dict):
                      summary["keys"]=sorted(parsed.keys())
                      for k,v in parsed.items():
                          if isinstance(v,list):
                              summary["listKey"]=k;summary["count"]=len(v);summary["sample"]=v[:12];break
                  elif isinstance(parsed,list):
                      summary["count"]=len(parsed);summary["sample"]=parsed[:12]
                  extra.append(summary)
              except Exception as exc:
                  extra.append({"url":au,"error":type(exc).__name__+":"+str(exc)[:200],"code":getattr(exc,"code",None)})
          out["extraApiProbes"]=extra

          try:
              req=Request("https://web.mikoshi.jp/assets/main-f1adedca.js",headers={"User-Agent":UA})
              with urlopen(req,timeout=20) as r:
                  main_raw=r.read(500000).decode("utf-8","replace")
              rate_hits=[]
              for key in ("1ポイント","1円","交換","exchange","pointRate","yen"):
                  for m in list(re.finditer(re.escape(key),main_raw,re.I))[:20]:
                      rate_hits.append({"key":key,"context":main_raw[max(0,m.start()-320):m.end()+520]})
              out["rateBundleHints"]=rate_hits[:100]
          except Exception as exc:
              out["rateBundleHints"]=[{"error":type(exc).__name__}]
          # Build a conservative game-like shortlist from both Skyflag OS feeds
          # and inspect current first-party detail payloads.
          merged={}
          os_membership={}
          for os_id,label in ((1,"Android"),(2,"iOS")):
              au=f"https://web.mikoshi.jp/v2/skyflag/ads?os={os_id}&limit=1000"
              req=Request(au,headers={"User-Agent":UA,"Accept":"application/json, text/plain, */*","Referer":"https://web.mikoshi.jp/"})
              with urlopen(req,timeout=30) as r:
                  payload=json.loads(r.read(8_000_000).decode("utf-8","replace"))
              for ad in payload.get("ads",[]):
                  aid=str(ad.get("id") or "")
                  if not aid: continue
                  merged[aid]=ad
                  os_membership.setdefault(aid,set()).add(label)
          game_markers=("ゲーム","rpg","パズル","シミュレーション","サバイバル","育成","バトル","冒険","クエスト","ソリティア","merge","マージ","mafia","kingdom","zombie","ゾンビ","idle","ステージ","レベル","チャプター")
          likely=[]
          for aid,ad in merged.items():
              hay=(str(ad.get("name") or "")+" "+re.sub(r"<[^>]+>"," ",str(ad.get("description") or ""))).casefold()
              if any(m.casefold() in hay for m in game_markers):
                  likely.append({
                      "id":aid,
                      "name":ad.get("name"),
                      "point":ad.get("point"),
                      "os":sorted(os_membership.get(aid,set())),
                      "description":re.sub(r"\\s+"," ",re.sub(r"<[^>]+>"," ",str(ad.get("description") or ""))).strip()[:300],
                  })
          likely.sort(key=lambda x:(-(x["point"] if isinstance(x["point"],int) else 0),x["name"] or ""))
          out["likelyGameOffers"]={"count":len(likely),"top":likely[:50]}

          detailout=[]
          for row in likely[:8]:
              au=f"https://web.mikoshi.jp/v2/skyflag/ads/{row['id']}"
              try:
                  req=Request(au,headers={"User-Agent":UA,"Accept":"application/json, text/plain, */*","Referer":"https://web.mikoshi.jp/"})
                  with urlopen(req,timeout=20) as r:
                      data=json.loads(r.read(3_000_000).decode("utf-8","replace"))
                  detailout.append({
                      "id":row["id"],"os":row["os"],"keys":sorted(data.keys()) if isinstance(data,dict) else [],
                      "payload":data,
                  })
              except Exception as exc:
                  detailout.append({"id":row["id"],"error":type(exc).__name__+":"+str(exc)[:180]})
          out["gameDetailProbes"]=detailout
          print("MIKOSHI_AUDIT",json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
