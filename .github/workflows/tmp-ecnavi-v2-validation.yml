name: Temporary ECNavi v2 validation
on:
  push:
    branches: [fix/ecnavi-live-parser-20260924]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused ECNavi regressions
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile scripts/direct_offer_refresh.py scripts/daily_scan_review.py scripts/structured_publication.py
          python -m pytest -q tests/test_direct_offer_refresh_v1.py -k ecnavi
          python -m pytest -q tests/test_unified_eight_site_pipeline.py -k reward_contracts
      - name: Restore latest R2 new-game queue
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          aws s3 cp "s3://${R2_BUCKET}/state/latest/new_game_candidate_queue.json.gz" "${tmp}/queue.gz" --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          gzip -dc "${tmp}/queue.gz" > data/new_game_candidate_queue.json
      - name: Verify current ECNavi candidates live
        run: |
          python - <<'PY'
          import collections,json,sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d
          import daily_scan_review as daily
          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          s=sources["ec_navi"]
          items=[x for x in json.load(open("data/new_game_candidate_queue.json",encoding="utf-8")).get("items",[])
                 if x.get("source")=="ec_navi" and x.get("active",True)]
          counts=collections.Counter()
          parsed=[]
          held=[]
          for item in items:
              url=item.get("firstPartyCandidateUrl")
              alias=daily.discovery_name(item.get("titleHint"))
              raw,final=d.fetch_first_party(url,s,timeout=20,max_bytes=1500000)
              ev=d.inspect_ecnavi_offer(raw,url,final,[alias])
              counts[(ev.get("state"),ev.get("reason") or "")]+=1
              row={
                  "titleHint":item.get("titleHint"),"url":url,
                  "state":ev.get("state"),"reason":ev.get("reason"),
                  "parserVersion":ev.get("parserVersion"),
                  "titleMatchProvenance":ev.get("titleMatchProvenance"),
                  "platform":ev.get("platform"),
                  "rewardPoints":ev.get("verifiedCurrentRewardPoints"),
                  "rewardYen":ev.get("verifiedCurrentRewardYen"),
                  "publicationAuthorized":ev.get("publicationAuthorized"),
              }
              print("LIVE",json.dumps(row,ensure_ascii=False,sort_keys=True))
              (parsed if ev.get("state")=="parsed" else held).append(row)
          print("SUMMARY",json.dumps({
              "candidates":len(items),"parsed":len(parsed),"held":len(held),
              "outcomes":{f"{k[0]}|{k[1]}":v for k,v in counts.items()},
          },ensure_ascii=False,sort_keys=True))
          assert len(items) > 0
          assert len(parsed) >= 15
          assert all(x["parserVersion"]=="ecnavi-detail-review-v2" for x in parsed)
          assert all(x["publicationAuthorized"] is False for x in parsed)
          assert all(
              x["reason"]=="point_yen_conversion_mismatch"
              for x in held
          ), held
          PY
