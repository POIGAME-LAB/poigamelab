name: Temporary Amefuri known-game audit
on:
  push:
    branches: [audit/amefuri-known-games-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit known-game Amefuri offers
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d

          cfg=json.load(open("config/point_sources.json",encoding="utf-8"))
          sources={x["id"]:x for x in cfg["sources"]}
          s=sources["amefuri"]
          targets=json.load(open("config/game_targets.json",encoding="utf-8"))["games"]

          pages=[]
          for url in s.get("direct_listing_urls",[]):
              try:
                  raw,final=d.fetch_first_party(url,s,timeout=20,max_bytes=1500000)
                  pages.append((raw,final))
              except Exception as exc:
                  print("LISTING_ERROR",json.dumps({"url":url,"error":d.summarize_fetch_error(exc)},ensure_ascii=False))
          print("LISTINGS",len(pages))

          summary=[]
          for target in targets:
              game=str(target.get("game") or "").strip()
              aliases=[game]+[str(x) for x in target.get("aliases",[]) if str(x).strip()]
              urls=[]
              seen=set()
              for raw,final in pages:
                  if not d.target_present(d.visible_text(raw),aliases):
                      continue
                  for url in d.discover_detail_links(raw,final,s,aliases,limit=12):
                      ident=d.offer_identity_key(url,"amefuri")
                      if ident and ident not in seen:
                          seen.add(ident); urls.append(url)
              rows=[]
              for url in urls[:6]:
                  try:
                      parsed=d.inspect_detail(url,s,aliases)
                      ev=parsed.get("sourceEvidence") or {}
                  except Exception as exc:
                      ev={"state":"exception","reason":d.summarize_fetch_error(exc)}
                  row={
                      "url":url,"state":ev.get("state"),"reason":ev.get("reason"),
                      "parserVersion":ev.get("parserVersion"),"name":ev.get("name"),
                      "platform":ev.get("platform"),"rewardMode":ev.get("rewardMode"),
                      "rewardYen":ev.get("verifiedCurrentRewardYen"),
                      "deadlineExplicit":ev.get("achievementDeadlineExplicit"),
                      "publicationAuthorized":ev.get("publicationAuthorized"),
                      "fingerprint":ev.get("evidenceFingerprint"),
                  }
                  rows.append(row)
                  print("OFFER",json.dumps({"game":game,**row},ensure_ascii=False,sort_keys=True))
              if urls:
                  summary.append({"game":game,"foundUrls":len(urls),"inspected":len(rows),
                                  "parsed":sum(1 for r in rows if r["state"]=="parsed"),
                                  "urls":urls[:12]})
          print("SUMMARY",json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY
