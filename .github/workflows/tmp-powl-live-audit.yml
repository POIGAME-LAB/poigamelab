name: Temporary Powl live audit
on:
  push:
    branches: [audit/powl-live-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Powl high-value detail structure
        run: |
          python - <<'PY'
          import html,json,re,sys
          from urllib.parse import urljoin,urlparse
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d

          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          s=sources["powl"]
          raw,final=d.fetch_first_party(s["direct_listing_urls"][0],s,timeout=20,max_bytes=2500000)
          doc=d.EvidenceHTML(raw).root
          rows=[]
          seen=set()
          for a in doc.find(tag="a"):
              url=urljoin(final,a.attrs.get("href","")).split("#",1)[0]
              m=re.fullmatch(r"/reward/(\d+)",urlparse(url).path)
              if not m or m.group(1) in seen: continue
              node=a.parent; primary=False
              for _ in range(5):
                  if node is None: break
                  if "search-result-simple-list" in node.attrs.get("class","").split():
                      primary=True; break
                  node=node.parent
              if not primary: continue
              label=d.evidence_text(a).strip()
              pts=[int(x.replace(",","")) for x in re.findall(r"(?<![0-9,])([1-9][0-9]{0,2}(?:,[0-9]{3})*|[1-9][0-9]*)\s*pt\b",label,re.I)]
              pts=sorted(set(pts))
              if len(pts)!=1: continue
              item={"id":m.group(1),"url":url,"label":label,"points":pts[0]}
              item.update(d.classify_new_game_candidate({"titleHint":label}))
              if item.get("classification")=="likely_game":
                  rows.append(item); seen.add(m.group(1))
          rows.sort(key=lambda x:(-x["points"],x["id"]))
          for item in rows[:10]:
              body,detail_final=d.fetch_first_party(item["url"],s,timeout=20,max_bytes=2000000)
              text=d.visible_text(body)
              detail=d.EvidenceHTML(body).root
              title_nodes=[{"text":d.evidence_text(n)[:260],"class":n.attrs.get("class",""),"id":n.attrs.get("id","")} for n in detail.find(tag="title")]
              h2_nodes=[{"text":d.evidence_text(n)[:260],"class":n.attrs.get("class",""),"id":n.attrs.get("id","")} for n in detail.find(tag="h2")]
              needle=f'{item["points"]:,}pt'
              contexts=[]
              for match in list(re.finditer(re.escape(needle),body,re.I))[:6]:
                  s0=max(0,match.start()-500); e0=min(len(body),match.end()+500)
                  snippet=re.sub(r"\s+"," ",body[s0:e0])
                  contexts.append(snippet[:1200])
              print("DETAIL",json.dumps({
                  "id":item["id"],"label":item["label"][:500],"points":item["points"],
                  "final":detail_final,"title":title_nodes,"h2":h2_nodes[:8],
                  "rewardHtmlContexts":contexts,
                  "termsPos":text.find("ポイント獲得条件"),
                  "recommendPos":text.find("あなたへのおすすめ広告"),
              },ensure_ascii=False,sort_keys=True))
          PY
