name: Temporary Powl live audit
on:
  push:
    branches: [audit/powl-live-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Powl listing and current reward detail pages
        run: |
          python - <<'PY'
          import json,re,sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d

          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          s=sources["powl"]
          listing=s["direct_listing_urls"][0]
          raw,final=d.fetch_first_party(listing,s,timeout=20,max_bytes=2000000)
          candidates=d.discover_new_game_listing_candidates(raw,final,s,[],limit=500)
          print("LISTING",json.dumps({
              "url":listing,"final":final,"bytes":len(raw.encode("utf-8")),
              "candidates":len(candidates),
          },ensure_ascii=False,sort_keys=True))

          sample=[]
          if candidates:
              step=max(1,len(candidates)//12)
              for i in range(0,len(candidates),step):
                  if len(sample)>=12: break
                  sample.append(candidates[i])
          for item in sample:
              url=item["firstPartyCandidateUrl"]
              try:
                  body,detail_final=d.fetch_first_party(url,s,timeout=20,max_bytes=2000000)
                  text=d.visible_text(body)
                  doc=d.EvidenceHTML(body).root
                  h1=[d.evidence_text(x) for x in doc.find(tag="h1")]
                  h2=[d.evidence_text(x) for x in doc.find(tag="h2")]
                  titles=[d.evidence_text(x) for x in doc.find(tag="title")]
                  canon=[x.attrs.get("href","") for x in doc.find(tag="link") if "canonical" in x.attrs.get("rel","").split()]
                  print("DETAIL",json.dumps({
                      "titleHint":item.get("titleHint"),"url":url,"final":detail_final,
                      "bytes":len(body.encode("utf-8")),"h1":h1[:4],"h2":h2[:12],
                      "title":titles[:3],"canonical":canon[:3],
                      "markers":{m:text.find(m) for m in (
                          "獲得ポイント","ポイント獲得条件","成果条件","却下条件",
                          "達成期限","反映目安","iOS","Android","円","pt","ポイント"
                      )},
                      "head":re.sub(r"\s+"," ",text)[:9000],
                  },ensure_ascii=False,sort_keys=True))
              except Exception as exc:
                  print("ERROR",json.dumps({
                      "titleHint":item.get("titleHint"),"url":url,
                      "error":d.summarize_fetch_error(exc)
                  },ensure_ascii=False,sort_keys=True))
          PY
