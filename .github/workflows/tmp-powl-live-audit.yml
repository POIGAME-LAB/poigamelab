name: Temporary Powl live audit
on:
  push:
    branches: [audit/powl-live-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Powl reward-link DOM ancestry
        run: |
          python - <<'PY'
          import collections,json,re,sys
          from urllib.parse import urljoin,urlparse
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d
          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          s=sources["powl"]
          raw,final=d.fetch_first_party(s["direct_listing_urls"][0],s,timeout=20,max_bytes=2500000)
          doc=d.EvidenceHTML(raw).root
          rows=[]
          seen=set()
          chain_counts=collections.Counter()
          for a in doc.find(tag="a"):
              href=a.attrs.get("href","")
              url=urljoin(final,href)
              m=re.fullmatch(r"/reward/(\d+)",urlparse(url).path)
              if not m or m.group(1) in seen:
                  continue
              seen.add(m.group(1))
              chain=[]
              node=a.parent
              for _ in range(6):
                  if node is None: break
                  chain.append({
                      "tag":node.tag,
                      "id":node.attrs.get("id",""),
                      "class":node.attrs.get("class",""),
                  })
                  node=node.parent
              sig=" > ".join(
                  f"{x['tag']}#{x['id']}.{x['class']}" for x in chain[:4]
              )
              chain_counts[sig]+=1
              if len(rows)<80:
                  rows.append({
                      "id":m.group(1),"label":d.evidence_text(a)[:300],
                      "chain":chain,
                  })
          print("COUNTS",json.dumps(chain_counts.most_common(30),ensure_ascii=False))
          for row in rows:
              print("ROW",json.dumps(row,ensure_ascii=False,sort_keys=True))
          PY
