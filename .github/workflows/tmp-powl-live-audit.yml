name: Temporary Powl live audit
on:
  push:
    branches: [audit/powl-live-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Powl listing capacity and routes
        run: |
          python - <<'PY'
          import json,re,sys
          from urllib.parse import urljoin,urlparse
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d
          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          s=sources["powl"]
          raw,final=d.fetch_first_party(s["direct_listing_urls"][0],s,timeout=20,max_bytes=2500000)
          hrefs=re.findall(r'''href=["']([^"'#]+)''',raw,re.I)
          rewards=[]
          seen=set()
          for href in hrefs:
              url=urljoin(final,href)
              m=re.search(r"/reward/(\d+)",urlparse(url).path)
              if m and m.group(1) not in seen:
                  seen.add(m.group(1)); rewards.append(url)
          genre=sorted({urljoin(final,h) for h in hrefs if "/genre/" in h})[:100]
          paths=sorted({urlparse(urljoin(final,h)).path for h in hrefs if h.startswith("/")})
          scripts=re.findall(r'''<script[^>]+src=["']([^"']+)''',raw,re.I)
          api_tokens=sorted(set(re.findall(r'''["']([^"']*(?:api|reward|genre|ranking|search)[^"']*)["']''',raw,re.I)))
          print("SUMMARY",json.dumps({
              "bytes":len(raw.encode("utf-8")),
              "hrefCount":len(hrefs),
              "uniqueRewardIds":len(rewards),
              "firstRewardUrls":rewards[:10],
              "lastRewardUrls":rewards[-10:],
              "genreLinks":genre,
              "scriptSrc":[urljoin(final,x) for x in scripts],
              "interestingPaths":[p for p in paths if any(k in p for k in ("genre","reward","ranking","search"))][:120],
              "apiTokens":api_tokens[:150],
          },ensure_ascii=False,sort_keys=True))
          PY
