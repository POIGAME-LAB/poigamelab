name: Collect guide evidence (Phase 4 quarantine)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Collect directly verified guide pages (quarantine only)
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/collect_guide_evidence.py
      - name: Verify Phase 4 quarantine contract
        run: python -m pytest -q tests/test_phase4_guide_evidence_v49.py
      - name: Upload quarantined evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase4-guide-evidence
          path: |
            data/guide_evidence.json
            data/guide_research_status.json
          retention-days: 7
