name: Temporary Tavily auth audit

on:
  push:
    branches:
      - fix/tavily-bearer-auth-20260924
    paths:
      - ".github/workflows/tmp-tavily-auth-audit.yml"
      - "scripts/collect_guide_evidence.py"
      - "tests/test_phase4_guide_evidence_v49.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Tavily auth regressions
        run: |
          python -m pytest -q tests/test_phase4_guide_evidence_v49.py
          python -m pytest -q tests/test_research_new_game_channels.py
      - name: Verify one live Tavily search
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0,"scripts")
          from collect_guide_evidence import tavily_search
          key=os.getenv("TAVILY_API_KEY","")
          if not key:
              raise SystemExit("TAVILY_API_KEY unavailable")
          response=tavily_search('"ザ・グランドマフィア" ポイ活',key,max_results=2)
          rows=response.get("results") if isinstance(response,dict) else None
          summary={
              "responseIsObject":isinstance(response,dict),
              "resultsIsList":isinstance(rows,list),
              "resultCount":len(rows) if isinstance(rows,list) else None,
              "hasRequestId":bool(response.get("request_id")) if isinstance(response,dict) else False,
          }
          print("TAVILY_AUTH_AUDIT",json.dumps(summary,ensure_ascii=False,sort_keys=True))
          if not isinstance(rows,list):
              raise SystemExit("Tavily search result contract invalid")
          PY
