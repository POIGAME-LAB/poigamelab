name: Temporary deploy post-Amefuri
on:
  push:
    branches: [ops/deploy-post-amefuri-20260924]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages deploy on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo POIGAME-LAB/poigamelab --ref main
