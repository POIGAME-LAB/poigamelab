name: Temporary ECNavi live audit
on:
  push:
    branches: [audit/ecnavi-live-20260924]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect ECNavi reward/header variants
        run: |
          python - <<'PY'
          import json,re,sys
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d
          sources={x["id"]:x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]}
          s=sources["ec_navi"]
          for offer_id in ("10721046","10711896","10721567","10711752","10720320","10721984"):
              url=f"https://ecnavi.jp/ad/{offer_id}/show/?frame=category"
              raw,final=d.fetch_first_party(url,s,timeout=20,max_bytes=1500000)
              text=d.visible_text(raw)
              doc=d.EvidenceHTML(raw).root
              h1=[d.evidence_text(x) for x in doc.find(tag="h1")]
              title=h1[0] if h1 else ""
              start=text.find(title)
              condition=text.find("加算条件",start)
              header=text[start:condition] if start>=0 and condition>start else ""
              print("OFFER",offer_id)
              print("TITLE",json.dumps(title,ensure_ascii=False))
              print("HEADER",json.dumps(re.sub(r"\s+"," ",header),ensure_ascii=False))
              print("RATE",bool(re.search(r"10\s*pts?\.?\s*[=＝]\s*1\s*円",text,re.I)))
          PY
