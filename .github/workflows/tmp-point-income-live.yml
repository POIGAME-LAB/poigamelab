name: Temporary Point Income live audit

on:
  push:
    branches:
      - audit/point-income-live-20260925
    paths:
      - ".github/workflows/tmp-point-income-live.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect current public Point Income surfaces
        run: |
          python - <<'PY'
          import json,re
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          from urllib.request import Request,urlopen

          URLS=[
              "https://pointi.jp/",
              "https://sp.pointi.jp/",
              "https://pointi.jp/robots.txt",
              "https://pointi.jp/sitemap.xml",
          ]
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1"

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.scripts=[]; self.forms=[]; self._href=None; self._txt=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="a":
                      self._href=a.get("href"); self._txt=[]
                  elif tag=="script" and a.get("src"):
                      self.scripts.append(a.get("src"))
                  elif tag=="form":
                      self.forms.append({"action":a.get("action"),"method":a.get("method")})
              def handle_data(self,data):
                  if self._href is not None: self._txt.append(data)
              def handle_endtag(self,tag):
                  if tag=="a" and self._href is not None:
                      self.links.append((self._href,re.sub(r"\s+"," "," ".join(self._txt)).strip()))
                      self._href=None; self._txt=[]

          out={"pages":[]}
          for url in URLS:
              try:
                  req=Request(url,headers={"User-Agent":UA,"Accept-Language":"ja,en-US;q=0.7,en;q=0.5"})
                  with urlopen(req,timeout=20) as r:
                      data=r.read(2_500_000); final=r.geturl(); ctype=r.headers.get("Content-Type")
                  raw=data.decode("utf-8","replace")
                  p=P(); p.feed(raw)
                  links=[]
                  for href,text in p.links:
                      if not href: continue
                      absolute=urljoin(final,unescape(href))
                      host=(urlparse(absolute).hostname or "").lower()
                      if host.endswith("pointi.jp"):
                          links.append({"url":absolute,"text":text[:220]})
                  interesting=[
                      x for x in links
                      if any(k in (x["text"]+" "+x["url"]).lower()
                             for k in ("ゲーム","アプリ","game","app","スマホ","サービス","案件","広告","category","search"))
                  ]
                  buckets={}
                  for x in links:
                      path=urlparse(x["url"]).path
                      first="/"+"/".join([v for v in path.split("/") if v][:2])
                      buckets[first]=buckets.get(first,0)+1
                  visible=re.sub(r"(?is)<(?:script|style|noscript|svg)\b[^>]*>.*?</(?:script|style|noscript|svg)>"," ",raw)
                  visible=re.sub(r"(?s)<[^>]+>"," ",visible)
                  visible=re.sub(r"\s+"," ",unescape(visible)).strip()
                  jsonish=sorted(set(re.findall(r'(?:https?://[^"\'<> ]+|/[^"\'<> ]*(?:api|ajax|search|category|game|app)[^"\'<> ]*)',raw,re.I)))
                  out["pages"].append({
                      "url":url,"final":final,"contentType":ctype,"bytes":len(data),
                      "title":(re.findall(r"(?is)<title[^>]*>(.*?)</title>",raw) or [""])[0][:300],
                      "linkCount":len(links),
                      "pathBuckets":sorted(buckets.items(),key=lambda x:(-x[1],x[0]))[:35],
                      "interestingLinks":interesting[:120],
                      "forms":p.forms[:30],
                      "scripts":[urljoin(final,x) for x in p.scripts[:40]],
                      "jsonish":jsonish[:100],
                      "keywords":{k:(k in visible) for k in ["ゲーム","アプリ","スマホ","ポイント獲得","広告利用"]},
                      "visibleExcerpt":visible[:2500],
                  })
              except Exception as exc:
                  out["pages"].append({"url":url,"error":type(exc).__name__+":"+str(exc)[:200]})
          print("POINT_INCOME_AUDIT",json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
