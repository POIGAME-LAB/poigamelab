name: Temporary Kurashiru Reward live audit

on:
  push:
    branches:
      - feat/kurashiru-reward-ranking-v1-20260924
    paths:
      - ".github/workflows/tmp-kurashiru-reward-live-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect current listing and detail markup
        run: |
          python - <<'PY'
          import json,re,sys
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as direct

          source=next(x for x in json.load(open("config/point_sources.json",encoding="utf-8"))["sources"]
                      if x["id"]=="kurashiru_reward")

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.items=[]; self.href=None; self.text=[]; self.attrs={}
              def handle_starttag(self,tag,attrs):
                  if tag=="a":
                      self.attrs=dict(attrs); self.href=self.attrs.get("href"); self.text=[]
              def handle_data(self,data):
                  if self.href is not None: self.text.append(data)
              def handle_endtag(self,tag):
                  if tag=="a" and self.href is not None:
                      self.items.append((self.href,re.sub(r"\s+"," "," ".join(self.text)).strip(),self.attrs))
                      self.href=None; self.text=[]; self.attrs={}

          def links(raw,base):
              p=Links(); p.feed(raw)
              return [(urljoin(base,h),t,a) for h,t,a in p.items if h]

          out={"listings":[],"details":[]}
          detail_urls=[]
          seen_page_ads=set()
          for page in range(1,51):
              url=("https://www.rewards.kurashiru.com/categories/3"
                   if page==1 else f"https://www.rewards.kurashiru.com/categories/3?page={page}")
              raw,final=direct.fetch_first_party(url,source,timeout=20,max_bytes=3_000_000)
              ls=links(raw,final)
              ads=[(u,t,a) for u,t,a in ls if re.fullmatch(r"/ads/\d+",urlparse(u).path)]
              page_links=[u for u,t,a in ls if urlparse(u).path=="/categories/3" and "page=" in urlparse(u).query]
              fragments={}
              if page==1:
                  for needle in ("/ads/19125","/ads/19120"):
                      pos=raw.find(needle)
                      if pos>=0:
                          fragments[needle]=raw[max(0,pos-1200):pos+2400]
              out["listings"].append({
                  "requested":url,"final":final,"bytes":len(raw.encode("utf-8")),
                  "adLinks":len(ads),"uniqueAds":len({u for u,_,_ in ads}),
                  "pagination":sorted(set(page_links)),
                  "countLabels":re.findall(r"\\(([0-9,]+)件\\)",direct.visible_text(raw))[:5],
                  "samples":[{"url":u,"text":t[:420],"class":a.get("class")} for u,t,a in ads[:12]],
                  "rawFragments":fragments,
                  "has36": "(36件)" in re.sub(r"\s+","",direct.visible_text(raw)),
              })
              page_ids={u for u,_,_ in ads}
              new_ids=page_ids-seen_page_ads
              seen_page_ads.update(page_ids)
              for u,t,a in ads:
                  if u not in detail_urls:
                      detail_urls.append(u)
              if not ads or not new_ids:
                  break

          out["listingSummary"]={
              "pagesFetched":len(out["listings"]),
              "uniqueAds":len(detail_urls),
              "pagesWith20":sum(1 for x in out["listings"] if x["uniqueAds"]==20),
              "lastPageAds":out["listings"][-1]["uniqueAds"] if out["listings"] else 0,
          }

          wanted=[]
          for u in detail_urls:
              if any(x in u for x in ["/ads/12947","/ads/18828"]):
                  wanted.append(u)
          for u in detail_urls:
              if u not in wanted:
                  wanted.append(u)
              if len(wanted)>=5: break

          for url in wanted[:5]:
              raw,final=direct.fetch_first_party(url,source,timeout=20,max_bytes=3_000_000)
              text=direct.visible_text(raw)
              doc=direct.EvidenceHTML(raw).root
              title_nodes=doc.find(tag="title")
              h1s=[direct.evidence_text(x) for x in doc.find(tag="h1") if direct.evidence_text(x)]
              # Record class names around reward/terms without dumping full HTML.
              classes={}
              for cls in [
                  "point-amount","reward","coin","ad-detail","service-overview",
                  "attention","terms","condition","ad-detail__title","ad-detail__reward"
              ]:
                  vals=[direct.evidence_text(x)[:900] for x in doc.find(cls=cls) if direct.evidence_text(x)]
                  if vals: classes[cls]=vals[:4]
              markers={}
              for m in ["コイン獲得条件","コイン還元","100コイン = 1円相当","注意事項",
                        "承認条件","却下条件","成果調査","iOS","Android"]:
                  pos=text.find(m)
                  if pos>=0: markers[m]=text[max(0,pos-220):pos+1300]
              pairs=re.findall(r"([1-9][0-9,]*)\s*>\s*([1-9][0-9,]*)\s*コイン",text)
              out["details"].append({
                  "url":url,"final":final,"bytes":len(raw.encode("utf-8")),
                  "title":direct.evidence_text(title_nodes[0]) if len(title_nodes)==1 else "",
                  "h1s":h1s[:4],"rewardPairs":pairs[:8],"markers":markers,"classes":classes
              })

          print("KURASHIRU_LIVE_AUDIT",json.dumps(out,ensure_ascii=False,sort_keys=True))
          if not out["listings"] or out["listingSummary"]["uniqueAds"] < 20:
              raise SystemExit("insufficient listing coverage")
          if not out["details"] or not any(x["rewardPairs"] for x in out["details"]):
              raise SystemExit("reward pair not found")
          PY
