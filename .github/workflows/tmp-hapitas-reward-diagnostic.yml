name: Temporary Hapitas reward parser diagnostic

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - .github/workflows/tmp-hapitas-reward-diagnostic.yml

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53c04fe528475f13b8c74fb44ff0c9581670bc5b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect listing card markup
        run: |
          python - <<'PY'
          import json,re,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          import daily_scan_review as daily
          cfg=json.loads(Path("config/point_sources.json").read_text(encoding="utf-8"))
          src=next(x for x in cfg["sources"] if x["id"]=="hapitas")
          raw,final=daily.resilient_fetch_first_party(src["direct_listing_urls"][0],src)
          for ident in ["98600","87594","96775","96353"]:
              m=re.search(r'href=["\'][^"\']*itemid/'+ident+r'[^"\']*["\']',raw,re.I)
              print("ITEM",ident,"FOUND",bool(m))
              if m:
                  snippet=re.sub(r"\s+"," ",raw[max(0,m.start()-1800):m.start()+3800])
                  print(snippet[:5600])
          PY
