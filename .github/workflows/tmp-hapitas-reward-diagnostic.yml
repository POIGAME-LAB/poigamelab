name: Temporary Hapitas reward parser diagnostic

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - .github/workflows/tmp-hapitas-reward-diagnostic.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5b7ce01a80d4196d09aaeb4d29efcf403f909d34
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Offline candidate identity regressions
        run: |
          python -m py_compile scripts/direct_offer_refresh.py scripts/daily_scan_review.py
          python -m pytest -q \
            tests/test_site_centric_new_game_discovery.py \
            tests/test_new_game_candidate_classification.py \
            tests/test_daily_scan_review.py
      - name: Live high-reward Hapitas candidate check
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import direct_offer_refresh as d
          import daily_scan_review as daily

          cfg=json.loads(Path('config/point_sources.json').read_text(encoding='utf-8'))
          src=next(x for x in cfg['sources'] if x['id']=='hapitas')
          targets=json.loads(Path('config/game_targets.json').read_text(encoding='utf-8')).get('games') or []
          url=src['direct_listing_urls'][0]
          raw,final=daily.resilient_fetch_first_party(url,src)
          items=d.discover_new_game_listing_candidates(raw,final,src,targets,limit=1200)
          by_id={str(x.get('offerIdentity')):x for x in items}
          checks={
            '98600':'パズル＆コンクエスト',
            '96775':'[LV3まで1時間] ゾンビ・パニック',
            '96352':'ザ・アンツ',
          }
          out=[]
          for ident,expected_title in checks.items():
              assert ident in by_id, (ident, sorted(by_id)[:20], len(by_id))
              item=by_id[ident]
              assert item['titleHint']==expected_title, item
              assert 'pt' not in item['titleHint'].casefold(), item
              parsed=d.inspect_detail(item['firstPartyCandidateUrl'],src,[item['titleHint']],fetcher=daily.resilient_fetch_first_party)
              ev=parsed.get('sourceEvidence') or {}
              assert ev.get('state')=='parsed', (ident,item,ev)
              reward=daily.explicit_yen(ev)
              assert type(reward) is int and reward>2100, (ident,reward,ev)
              out.append({'id':ident,'title':item['titleHint'],'rewardYen':reward,'parser':ev.get('parserVersion')})
          print(json.dumps({'result':'PASS','candidateCount':len(items),'items':out},ensure_ascii=False))
          PY