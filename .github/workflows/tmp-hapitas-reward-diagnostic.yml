name: Temporary Hapitas reward parser diagnostic

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - .github/workflows/tmp-hapitas-reward-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 68c198a9347e7302fba3e079ff23eb2b2519cf4e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Hapitas terms DOM
        run: |
          python - <<'PY'
          import json,re,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d
          import daily_scan_review as daily
          cfg=json.loads(Path("config/point_sources.json").read_text(encoding="utf-8"))
          src=next(x for x in cfg["sources"] if x["id"]=="hapitas")
          for url in [
            "https://hapitas.jp/item/detail/itemid/91053/apn/navigation_category",
            "https://hapitas.jp/item/detail/itemid/98148/apn/navigation_category",
          ]:
              raw,final=daily.resilient_fetch_first_party(url,src)
              out={"url":url}
              for marker in ["ポイント対象条件","ポイント獲得条件","成果受付期限","成果調査受付期限","ハピタスご利用前に必ずご確認ください"]:
                  positions=[m.start() for m in re.finditer(marker,raw)]
                  contexts=[]
                  for pos in positions[:4]:
                      contexts.append(re.sub(r"\s+"," ",raw[max(0,pos-1200):pos+3200])[:4400])
                  out[marker]={"count":len(positions),"contexts":contexts}
              print(json.dumps(out,ensure_ascii=False))
          PY
