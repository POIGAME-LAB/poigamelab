name: Temporary Hapitas reward parser diagnostic

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - .github/workflows/tmp-hapitas-reward-diagnostic.yml

permissions:
  contents: read

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53c04fe528475f13b8c74fb44ff0c9581670bc5b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find high unlisted Hapitas candidates
        run: |
          python - <<'PY'
          import json,re,sys
          from pathlib import Path
          from urllib.parse import urljoin
          sys.path.insert(0,"scripts")
          import direct_offer_refresh as d
          import daily_scan_review as daily

          cfg=json.loads(Path("config/point_sources.json").read_text(encoding="utf-8"))
          src=next(x for x in cfg["sources"] if x["id"]=="hapitas")
          targets=json.loads(Path("config/game_targets.json").read_text(encoding="utf-8")).get("games") or []
          listing=src["direct_listing_urls"][0]
          raw,final=daily.resilient_fetch_first_party(listing,src)
          doc=d.EvidenceHTML(raw).root
          candidates=[]
          seen=set()
          for anchor in doc.find(tag="a"):
              href=(anchor.attrs.get("href") or "").strip()
              absolute=urljoin(final,href).split("#",1)[0]
              try:
                  ident=d.hapitas_offer_id(absolute)
              except Exception:
                  continue
              if ident in seen: continue
              seen.add(ident)
              node=anchor
              context=""
              for _ in range(7):
                  if node is None: break
                  txt=d.evidence_text(node)
                  if len(txt)<=1800:
                      context=txt
                  marker=" ".join([getattr(node,"tag",""),node.attrs.get("class",""),node.attrs.get("id","")]).casefold()
                  if any(x in marker for x in ("item","service","campaign","card")) and len(txt)<=1800:
                      context=txt
                      break
                  node=getattr(node,"parent",None)
              if not context: continue
              pts=[int(x.replace(",","")) for x in re.findall(r"(?<![0-9,])([1-9][0-9]{0,2}(?:,[0-9]{3})*|[1-9][0-9]*)\s*pt\b",context,re.I)]
              if not pts: continue
              label=d.evidence_text(anchor).strip()
              if not label or len(label)<2 or len(label)>180:
                  label=context[:160]
              if d.context_matches_known_game(context,targets):
                  continue
              candidates.append({"hint":max(pts),"label":label,"url":absolute,"context":context[:500]})
          candidates.sort(key=lambda x:(-x["hint"],x["label"]))
          verified=[]
          for item in candidates[:30]:
              raw2,final2=daily.resilient_fetch_first_party(item["url"],src)
              parsed=d.inspect_detail(item["url"],src,[item["label"]],fetcher=lambda u,s:(raw2,final2))
              ev=parsed.get("sourceEvidence") or {}
              if ev.get("state")!="parsed":
                  continue
              reward=daily.explicit_yen(ev)
              if reward is None: continue
              verified.append({"game":ev.get("name"),"reward":reward,"url":item["url"],"listingHint":item["hint"]})
              if len(verified)>=12: break
          verified.sort(key=lambda x:(-x["reward"],x["game"] or ""))
          print(json.dumps({"candidateCount":len(candidates),"topVerified":verified},ensure_ascii=False))
          assert len(verified)>=5, verified
          assert verified[4]["reward"]>2100, verified[:5]
          PY
