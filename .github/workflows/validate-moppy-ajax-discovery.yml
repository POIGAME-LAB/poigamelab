name: Validate Moppy AJAX discovery

on:
  pull_request:
    paths:
      - "config/point_sources.json"
      - "tests/test_moppy_ajax_discovery.py"
      - ".github/workflows/validate-moppy-ajax-discovery.yml"

permissions:
  contents: read

jobs:
  validate-moppy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax check
        run: python -m py_compile tests/test_moppy_ajax_discovery.py
      - name: Run focused Moppy config test
        run: python -m pytest -q tests/test_moppy_ajax_discovery.py
