name: Temporary repair unified builder

on:
  push:
    branches:
      - feat/unified-eight-site-offers-v2
    paths:
      - ".github/workflows/tmp-fix-unified-builder.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-eight-site-offers-v2
          fetch-depth: 0

      - name: Remove unnecessary cleanup patch from temporary builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/tmp-build-unified-eight-site.yml')
          text = p.read_text(encoding='utf-8')
          start = text.find("          old = '''            data/daily_scan_review.json ")
          if start < 0:
              raise SystemExit('cleanup patch start not found')
          end_marker = "          w = w.replace(old, new, 1)\n"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('cleanup patch end not found')
          end += len(end_marker)
          p.write_text(text[:start] + text[end:], encoding='utf-8')
          PY

      - name: Commit repair and remove helper
        run: |
          set -euo pipefail
          git config user.name "poigamelab-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-unified-builder.yml
          git add .github/workflows/tmp-build-unified-eight-site.yml
          git diff --cached --check
          git commit -m "chore: repair unified foundation builder"
          git push origin HEAD:feat/unified-eight-site-offers-v2
