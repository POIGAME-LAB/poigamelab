name: Collect POIGAME LAB data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ddgs requests beautifulsoup4
      - run: python scripts/collect_data.py
      - name: Commit candidate data
        run: |
          git config user.name "poigamelab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: refresh data candidates"
          git push
