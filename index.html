<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POIGAME LAB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", "Helvetica Neue", Arial, sans-serif;
      background: #ffffff;
      color: #2d1768;
    }

    header {
      height: 82px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid #eee9fe;
    }

    .header-logo img {
      display: block;
      width: 260px;
      max-width: 42vw;
      height: auto;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      color: #32156f;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
    }

    .hero {
      background: linear-gradient(180deg, #ffffff 0%, #f8f5ff 100%);
    }

    .hero-visual {
      width: 100%;
      overflow: hidden;
      background: white;
    }

    .hero-visual img {
      width: 100%;
      height: auto;
      display: block;
    }

    .search-area {
      padding: 34px 20px 52px;
      background: linear-gradient(180deg, #ffffff 0%, #f6f2ff 100%);
    }

    .search-frame {
      max-width: 820px;
      margin: 0 auto;
      padding: 4px;
      background: linear-gradient(100deg, #6a3dff, #a855f7 58%, #ffd93d);
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(76, 40, 160, .16);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: white;
      border-radius: 18px;
    }

    .search-icon {
      padding-left: 14px;
      color: #6a3dff;
      font-size: 20px;
      font-weight: 900;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      height: 54px;
      border: none;
      outline: none;
      padding: 0 12px;
      font-size: 16px;
      color: #2d1768;
      background: transparent;
    }

    .search-box input::placeholder {
      color: #aaa2bd;
    }

    .search-box button {
      min-width: 120px;
      height: 54px;
      border: none;
      cursor: pointer;
      font-weight: 900;
      color: #33165e;
      background: linear-gradient(145deg, #fff27b, #ffd93d 55%, #ffb700);
      border-radius: 14px;
    }

    .coming {
      text-align: center;
      padding: 42px 20px 80px;
      color: #6f6590;
    }

    .coming small {
      display: block;
      margin-bottom: 8px;
      color: #6a3dff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .coming h2 {
      color: #32156f;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .lab-dashboard {
      max-width: 1100px;
      margin: -22px auto 0;
      padding: 0 30px;
      position: relative;
      z-index: 3;
    }

    .lab-dashboard-inner {
      display: grid;
      grid-template-columns: 1.35fr repeat(3, 1fr);
      gap: 12px;
      padding: 18px;
      border-radius: 24px;
      background: linear-gradient(120deg, #35127a, #7047ff 62%, #8d5bff);
      box-shadow: 0 18px 45px rgba(58, 25, 130, .24);
      color: white;
    }

    .dashboard-lead { padding: 10px 12px; }
    .dashboard-lead small { color: #ffe56b; font-weight: 900; letter-spacing: 1.6px; }
    .dashboard-lead h2 { margin: 5px 0 3px; font-size: 24px; }
    .dashboard-lead p { color: #e8e0ff; font-size: 12px; line-height: 1.6; }

    .dashboard-stat {
      min-height: 92px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 17px;
      background: rgba(255,255,255,.11);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .dashboard-stat span { color: #ddd2ff; font-size: 11px; font-weight: 800; }
    .dashboard-stat strong { margin-top: 5px; font-size: 23px; color: #fff; }
    .dashboard-stat.highlight strong { color: #ffe45c; }

    @media (max-width: 700px) {
      header {
        height: 68px;
        padding: 0 16px;
      }

      nav {
        display: none;
      }

      .header-logo img {
        width: 210px;
        max-width: 70vw;
      }

      .search-area {
        padding: 26px 14px 40px;
      }

      .search-box button {
        min-width: 86px;
      }

      .lab-dashboard { padding: 0 14px; margin-top: -12px; }
      .lab-dashboard-inner { grid-template-columns: 1fr 1fr; padding: 12px; }
      .dashboard-lead { grid-column: 1 / -1; }
      .dashboard-stat:last-child { grid-column: 1 / -1; }
      .dashboard-lead h2 { font-size: 20px; }
      .dashboard-stat strong { font-size: 19px; }
    }
    /* =========================
   注目ゲーム案件
========================= */

/* 達成目安・難易度 */

.game-meta {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.game-meta span {
  flex: 1;
  padding: 9px 10px;
  border: 1px solid #ebe6fa;
  border-radius: 10px;
  background: #faf8ff;
  color: #5f5572;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
}

.game-thumbnail {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border-radius: 15px;
}

.featured-games {
  max-width: 1100px;
  margin: 0 auto;
  padding: 70px 30px 90px;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  margin-bottom: 22px;
}

.section-label {
  display: inline-block;
  color: #7047ff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.section-heading h2 {
  margin: 0;
  color: #28125f;
  font-size: 28px;
  font-weight: 900;
}

.view-all {
  color: #7047ff;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
}

.view-all:hover {
  text-decoration: underline;
}


/* 並び替えボタン */

.sort-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 25px;
}

.sort-buttons button {
  padding: 9px 16px;
  border: 1px solid #ded7f7;
  border-radius: 999px;
  background: #ffffff;
  color: #5c5275;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.sort-buttons button.active {
  border-color: #7047ff;
  background: #7047ff;
  color: #ffffff;
}


/* ゲームカード3列 */

.game-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.game-card {
  overflow: hidden;
  border: 1px solid #ebe6fa;
  border-radius: 22px;
  background: #ffffff;
  box-shadow: 0 10px 35px rgba(73, 40, 145, 0.10);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.game-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 16px 40px rgba(73, 40, 145, 0.16);
}


/* ゲーム画像部分 */

.game-image {
  position: relative;
  padding: 14px;
}

.image-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 15px;
  background:
    linear-gradient(
      135deg,
      #efeaff 0%,
      #f8f6ff 50%,
      #fff4c8 100%
    );
  color: #8069c9;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
}

.rank-badge {
  position: absolute;
  z-index: 2;
  top: 24px;
  left: 24px;
  padding: 6px 11px;
  border-radius: 999px;
  background: #ffd83d;
  color: #321568;
  font-size: 11px;
  font-weight: 900;
}


/* カード本文 */

.game-info {
  padding: 4px 18px 20px;
}

.game-info h3 {
  margin: 0 0 5px;
  color: #28125f;
  font-size: 20px;
  font-weight: 900;
}

.game-condition {
  margin: 0 0 16px;
  color: #8b839d;
  font-size: 12px;
}


/* 最高還元 */

.reward-box {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 14px;
  padding: 13px 14px;
  border-radius: 14px;
  background: #f7f4ff;
}

.reward-box span {
  color: #746a8a;
  font-size: 11px;
  font-weight: 700;
}

.reward-box strong {
  color: #7047ff;
  font-size: 21px;
  font-weight: 900;
}


/* ポイントサイト */

.point-site {
  min-height: 34px;
  margin: 0 0 16px;
  color: #625a73;
  font-size: 12px;
  line-height: 1.5;
}


/* 詳細ボタン */

.detail-button {
  display: block;
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  background: linear-gradient(90deg, #7047ff, #8b52ff);
  color: #ffffff;
  font-size: 13px;
  font-weight: 800;
  text-align: center;
  text-decoration: none;
}

.detail-button:hover {
  opacity: 0.9;
}


/* スマホ対応 */

@media (max-width: 800px) {

  .featured-games {
    padding: 45px 18px 65px;
  }

  .section-heading {
    align-items: flex-start;
  }

  .section-heading h2 {
    font-size: 22px;
  }

  .game-grid {
    grid-template-columns: 1fr;
  }

}

.offer-button {
  display: block;
  margin-top: 10px;
  padding: 12px 16px;
  text-align: center;
  border-radius: 10px;
  font-weight: bold;
  text-decoration: none;
  background: #ffd84d;
  color: #2b174f;
  transition: 0.2s;
}

.offer-button:hover {
  transform: translateY(-2px);
  opacity: 0.9;
}

.offer-button.disabled {
  background: #e5e5e5;
  color: #888;
  cursor: default;
  pointer-events: none;
}
  .verification-line {
    margin: 8px 0 0;
    font-size: 12px;
    font-weight: 800;
    color: #5c4a84;
  }

  .verification-line.verified {
    color: #216e4e;
  }

  .verification-line.legacy {
    color: #8a6d1f;
  }

  .verification-line.warning {
    color: #a45600;
  }

  .dashboard-health-note {
    margin-top: 6px;
    color: #e8dcff;
    font-size: 11px;
    font-weight: 700;
  }


  /* PUBLIC_STATUS_UI_V1 */
  .verification-line.warning {
    display: none !important;
  }

  .verification-line.legacy {
    color: #756f80 !important;
  }

  #statHealth {
    display: none !important;
  }

</style>
</head>

<body>

  <header>
    <a href="#" class="header-logo">
      <img src="poigamelab_logo_horizontal.png" alt="POIGAME LAB">
    </a>

    <nav>
      <a href="#">ゲームを探す</a>
      <a href="#">案件を比べる</a>
      <a href="#">攻略情報</a>
      <a href="#">POIGAME LABとは</a>
    </nav>
  </header>

  <main class="hero">

    <div class="hero-visual">
      <img src="poigamelab_hero.png" alt="ポイゲームラボ">
    </div>

    <section class="search-area">
      <div class="search-frame">
        <div class="search-box">
          <div class="search-icon">⌕</div>
          <input type="text" placeholder="ゲーム名を入力">
          <button>検索</button>
        </div>
      </div>
    </section>

    <section class="lab-dashboard" aria-label="POIGAME LAB データサマリー">
      <div class="lab-dashboard-inner">
        <div class="dashboard-lead">
          <small>LIVE DATA</small>
          <h2>最新データサマリー</h2>
          <p>確認済みの掲載データを自動集計。自動収集した候補は確認後に公開します。</p>
        </div>
        <div class="dashboard-stat">
          <span>掲載ゲーム</span>
          <strong id="statGameCount">-- 件</strong>
        </div>
        <div class="dashboard-stat highlight">
          <span>掲載中の最高還元</span>
          <strong id="statMaxReward">-- 円</strong>
        </div>
        <div class="dashboard-stat">
          <span>データ最終更新</span>
          <strong id="statUpdated">----</strong>
          <small id="statHealth" class="dashboard-health-note"></small>
        </div>
      </div>
    </section>

        <!-- 注目ゲーム案件 -->
        <section class="featured-games">

          <div class="section-heading">
            <div>
              <span class="section-label">PICK UP</span>
              <h2>🔥 いま注目のポイ活ゲーム</h2>
            </div>

            <a href="#" class="view-all">すべて見る →</a>
          </div>

          <div class="sort-buttons">
            <button class="active">おすすめ順</button>
            <button>報酬が高い順</button>
            <button>簡単な順</button>
            <button>新着</button>
          </div>

          <div class="game-grid">



          </div>

        </section>

  </main>
  <script src="games.js"></script>
  <script src="site-data.js"></script>

<script>
  async function loadGames() {
    try {
      const rows = await POIGAME_DATA.fetchCsv("games.csv");
      games.length = 0;

      rows.forEach((row) => {
        const name = String(row.name || "").trim();
        if (!name) return;

        games.push({
          name,
          image: String(row.image || "").trim(),
          condition: String(row.condition || "").trim() || "指定条件クリア",
          days: String(row.days || "").trim() || "調査中",
          difficulty: String(row.difficulty || "").trim() || "調査中",
          overview: String(row.overview || "").trim(),
          tips: String(row.tips || "").trim(),
          featured: String(row.featured || "").trim().toLowerCase() === "true",
          addedDate: String(row.addedDate || "").trim(),
          offers: []
        });
      });
    } catch (error) {
      console.error("ゲームデータの読み込みに失敗しました", error);
    }
  }

  async function loadOffers() {
    games.forEach((game) => {
      game.offers = [];
    });

    try {
      const result = await POIGAME_DATA.loadOffersWithFallback();

      result.offers.forEach((offer) => {
        let game = games.find((item) => item.name === offer.gameName);
        if (!game) {
          game = {
            name: offer.gameName,
            image: "",
            condition: offer.condition || "指定条件クリア",
            days: "調査中",
            difficulty: "調査中",
            overview: "",
            tips: "",
            featured: true,
            addedDate: "",
            offers: []
          };
          games.push(game);
        }
        game.offers.push(offer);
      });
    } catch (error) {
      console.error("案件データの読み込みに失敗しました", error);
    }
  }
  const gameGrid = document.querySelector(".game-grid");
  const searchInput = document.querySelector('.search-box input');
  const searchButton = document.querySelector('.search-box button');
  const sortButtons = document.querySelectorAll(".sort-buttons button");
  const statGameCount = document.getElementById("statGameCount");
  const statMaxReward = document.getElementById("statMaxReward");
  const statUpdated = document.getElementById("statUpdated");
  const statHealth = document.getElementById("statHealth");
  let dataHealth = { available: false, generatedAt: "", success: false, games: {} };

  let currentSort = "recommended";
  let currentSearch = "";

  function getBestOffer(game) {
    const currentOffers = (game.offers || []).filter((offer) =>
      POIGAME_DATA.isOfferFresh(offer, dataHealth.staleAfterHours || 48)
    );
    if (currentOffers.length === 0) {
      return null;
    }

    return currentOffers.reduce((best, offer) => {
      return offer.reward > best.reward ? offer : best;
    });
  }

  function updateDashboard() {
    const allOffers = games.flatMap((game) => game.offers || []);
    const verifiedOffers = allOffers.filter((offer) =>
      POIGAME_DATA.isOfferFresh(offer, dataHealth.staleAfterHours || 48)
    );
    const maxReward = verifiedOffers.length
      ? Math.max(...verifiedOffers.map((offer) => Number(offer.reward) || 0))
      : 0;
    const dates = verifiedOffers
      .map((offer) => offer.updatedAt)
      .filter(Boolean)
      .sort();
    const latest = dates.length ? dates[dates.length - 1] : "未登録";

    statGameCount.textContent = `${games.length} 件`;
    statMaxReward.textContent = maxReward ? `${maxReward.toLocaleString()} 円` : "確認待ち";
    statUpdated.textContent = dataHealth.available
      ? POIGAME_DATA.formatHealthUpdatedAt(dataHealth)
      : (verifiedOffers.length ? latest : "確認待ち");

    if (statHealth) {
      const statuses = Object.values(dataHealth.games || {}).map((item) => item.state);
      if (statuses.includes("failed")) statHealth.textContent = "掲載情報を確認中";
      else if (statuses.includes("degraded")) statHealth.textContent = "掲載情報を確認中";
      else if (statuses.includes("stale")) statHealth.textContent = "掲載情報を確認中";
      else if (dataHealth.available) statHealth.textContent = "自動更新 正常";
      else statHealth.textContent = "";
    }
  }

  function renderGames() {
    updateDashboard();
    let visibleGames = [...games];

    if (currentSearch) {
      visibleGames = visibleGames.filter((game) =>
        game.name.toLowerCase().includes(currentSearch.toLowerCase())
      );
    }

    if (currentSort === "reward") {
      visibleGames.sort((a, b) => {
        const bestA = getBestOffer(a);
        const bestB = getBestOffer(b);

        const rewardA = bestA ? bestA.reward : -1;
        const rewardB = bestB ? bestB.reward : -1;

        return rewardB - rewardA;
      });
    }

    if (currentSort === "easy") {
  const difficultyOrder = {
    "簡単": 1,
    "普通": 2,
    "難しい": 3,
    "調査中": 999
  };

  visibleGames.sort((a, b) => {
    const difficultyA = difficultyOrder[a.difficulty] ?? 999;
    const difficultyB = difficultyOrder[b.difficulty] ?? 999;

    return difficultyA - difficultyB;
  });
}

    if (currentSort === "new") {
      visibleGames.sort((a, b) => {
        const dateA = Date.parse(a.addedDate || "1970-01-01") || 0;
        const dateB = Date.parse(b.addedDate || "1970-01-01") || 0;
        return dateB - dateA;
      });
    }

    if (currentSort === "recommended") {
      visibleGames.sort((a, b) => {
        return Number(b.featured) - Number(a.featured);
      });
    }

    gameGrid.innerHTML = "";

    if (visibleGames.length === 0) {
      gameGrid.innerHTML = `
        <div class="no-results">
          該当するゲームが見つかりませんでした。
        </div>
      `;
      return;
    }

    visibleGames.forEach((game, cardIndex) => {
      const bestOffer = getBestOffer(game);

      const rewardText = bestOffer
        ? bestOffer.reward.toLocaleString() + " 円"
        : "--- 円";

      const pointSiteText = bestOffer
        ? pointSites[bestOffer.site] || bestOffer.site
        : "調査中";

      const card = document.createElement("article");
      card.className = "game-card";

      card.innerHTML = `
  <div class="game-image">
    ${cardIndex < 3 ? `<span class="rank-badge">${cardIndex + 1}位</span>` : (game.featured ? `<span class="rank-badge">注目</span>` : "")}

    ${
      game.image
        ? `<img
            src="${POIGAME_DATA.safeHttpUrl(game.image) || POIGAME_DATA.escapeHtml(game.image)}"
            alt="${POIGAME_DATA.escapeHtml(game.name)}"
            class="game-thumbnail"
          >`
        : `<div class="image-placeholder">GAME IMAGE</div>`
    }
  </div>

  <div class="game-info">
    <h3>${POIGAME_DATA.escapeHtml(game.name)}</h3>

    <p class="game-condition">
      ${POIGAME_DATA.escapeHtml(game.condition)}
    </p>

    <div class="reward-box">
      <span>最高還元</span>
      <strong>${rewardText}</strong>
    </div>

    <p class="point-site">
      おすすめポイントサイト：${POIGAME_DATA.escapeHtml(pointSiteText)}
    </p>

    ${
      bestOffer
        ? (() => {
            const healthLabel = POIGAME_DATA.getOfferHealthLabel(bestOffer, dataHealth.games?.[game.name]);
            return `<p class="verification-line ${healthLabel.state}">${POIGAME_DATA.escapeHtml(healthLabel.text)}</p>`;
          })()
        : ""
    }

    <div class="game-meta">
      <span>⏱ 達成目安：${POIGAME_DATA.escapeHtml(game.days)}</span>
      <span>🎮 難易度：${POIGAME_DATA.escapeHtml(game.difficulty)}</span>
    </div>

    <a
      href="game.html?game=${encodeURIComponent(game.name)}"
      class="detail-button"
    >
      比較・攻略を見る
    </a>

    ${
      bestOffer && bestOffer.url
        ? `
          <a
            href="${POIGAME_DATA.safeHttpUrl(bestOffer.url)}"
            class="offer-button"
            target="_blank"
            rel="noopener noreferrer"
          >
            💰 最高還元サイトへ
          </a>
        `
        : `
          <span class="offer-button disabled">
            💰 案件リンク準備中
          </span>
        `
    }
  </div>
`;

      gameGrid.appendChild(card);
    });
  }

  function searchGames() {
    currentSearch = searchInput.value.trim();
    renderGames();
  }

  searchButton.addEventListener("click", searchGames);

  searchInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      searchGames();
    }
  });

  sortButtons.forEach((button, index) => {
  button.addEventListener("click", () => {
    sortButtons.forEach((btn) => {
      btn.classList.remove("active");
    });

    button.classList.add("active");

    if (index === 0) {
      currentSort = "recommended";
    }

    if (index === 1) {
      currentSort = "reward";
    }

    if (index === 2) {
      currentSort = "easy";
    }

    if (index === 3) {
      currentSort = "new";
    }

    renderGames();
  });
});

  Promise.all([loadGames(), POIGAME_DATA.loadDataHealth()])
  .then(([, health]) => {
    dataHealth = health;
    return loadOffers();
  })
  .then(() => {
    renderGames();
  });
</script>
