■注意事項
・本案件は日本国内でのみ挑戦可能です。
・同一アプリに関する報酬獲得は1人1回までとなります。
・広告クリックから1時間以内にアプリを初回起動してください。
　※1時間以上かかる場合は、起動前に再度広告をクリックしてください。
・獲得条件達成期限までに条件を達成した場合のみ報酬対象となります。
・条件達成から報酬反映までの間に時間を要する場合があります。
・広告クリックから条件達成まで、必ず同一の標準ブラウザで遷移してください。同一の標準ブラウザで遷移されていない場合、報酬が獲得できない可能性があります。
・広告クリックから条件達成までに通信環境を変更した場合、獲得対象外となることがあります。
・端末の広告計測設定を必ず有効にしてください。有効になっていない場合、報酬が獲得できない可能性があります。
　（例：iOS ⇒ 「設定」＞「プライバシー」＞「トラッキング」＞「Appからのトラッキング要求を許可」をON）
　（例：Android ⇒ 「設定」＞「Google」＞「広告」＞「広告のパーソナライズをオプトアウト」をOFF）
・URLを他のユーザーに対し共有したり、コピーしたURLを用いたキャンペーン紹介はお控えください。
・広告IDを意図的に削除/リセットした場合、不正利用とみなされることがあります。
・広告クリックから180日を経過している場合、調査できない可能性があります。
・キャンペーンは予告なく変更・終了する可能性があります。
・商品の購入によって報酬を獲得した場合、報酬獲得後に対象商品を返金・キャンセルすると、不正とみなされる可能性がございます。
■獲得対象外条件
以下のいずれかに当てはまる場合は、報酬対象外となります。
・挑戦中/チャレンジ中（またはポイント通帳）に反映されない場合。
　※挑戦中に反映されましても、2度目の挑戦の場合は獲得対象外となります。
・広告クリックから1時間以内にアプリの初回起動が完了しなかった場合。
・過去に同一アプリをインストール/条件到達したことがある場合。
・過去に同一アプリでキャンペーン参加したことがある場合（他ポイントサイトや別OS・別端末を含む）。
・新規インストールした端末とは異なる端末にデータ引き継ぎや共有を行った場合。
　※PCやエミュレーターへの引き継ぎ・共有も同様となります 
・エミュレーターを使用してインストール・プレイした場合。
　※引き継ぎの有無にかかわらず、エミュレーターの使用は不可となります
・公共Wi-Fiを利用してインストール/条件到達した場合。
・他端末で同一IPを利用したインストール/条件到達をした場合（家族・友人の利用を含む）。
・回線が不安定な状態でインストールした場合。
・広告クリック後に、異なるブラウザで条件到達した場合。
・端末の広告計測設定が無効の場合。
・アドブロック（広告ブロック）を利用している場合。
・プライベートモードまたはシークレットモードを使用していた場合。
・VPNやプライベートリレーなどの利用により、ご自身のIPアドレスが確認できない場合。
・日本国外からのアクセス、または国外IPを使用してのアクセスが確認された場合。
・インストールが他の広告成果とみなされた場合。
・インストール中に他の操作を行った場合や、SNS等で動画視聴をした場合。
・不備・不正・虚偽・重複・いたずら申請、画像改ざん、不正ツール（BOTやチート）利用が確認された場合。
・本キャンペーンページ以外からお申し込みされた場合。
（個人のブログやSNS等に記載されたリンクや、他者に共有・コピーされたURLからのお申し込みも含みます。）
・広告主に正常な申込でないと判断された場合。
・報酬加算前にアプリをアンインストールしていた場合。
　※iOS端末で「非使用のAppを取り除く」設定がONになっており、自動アンインストールされた場合も獲得対象外となります。
・過去に条件達成まで到達したことがある場合。
■お問い合わせに関して
アプリ案件に関しましてはインストール＆初回起動後、チャレンジ中/挑戦中に反映されない場合はお問い合わせ対象外となります。（ご利用のサイトにより判定中、発生など文言が異なります。挑戦中/チャレンジ中などのメニューが無い場合もございます。）
上記に該当せず、獲得条件達成後に報酬が未獲得の場合、本サイトのお問い合わせフォームよりご連絡ください。
※広告主へ直接お問い合わせする事を固く禁じます。お問い合わせされた場合、いかなる理由があろうと報酬獲得対象外と致します。
報酬未獲得に関する調査の際は下記が必要になりますのでご準備ください。
